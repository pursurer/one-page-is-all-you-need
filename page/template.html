    if (!e.target.closest?.("#topnav [data-nav], [data-goto], [data-pick], [data-jump], .ref")) return;
    jumping = true; clearTimeout(still); still = setTimeout(land, 500);
  }, true);
  const later = () => { clearTimeout(timer); timer = setTimeout(measure, 160); };
  addEventListener("scroll", () => {
    if (jumping) { clearTimeout(still); still = setTimeout(land, 160); }
    if (!queued) { queued = true; requestAnimationFrame(update); }
  }, { passive: true });
  addEventListener("resize", later);
  document.addEventListener("toggle", later, true);
  document.addEventListener("click", e => { if (e.target.closest?.(".more, [aria-expanded], summary")) later(); });
  document.fonts?.ready.then(later);
  afterRender.push(later);
})();

/*
 * #8 The end of the page (designeer: grace wang's footer): our pond once more. When it comes into view the cat
 * leaves the numbers and leaps over to sit at its edge, bigger than anywhere else on the page, and now and then
 * fishes (Cat.foot). The koi are the band's own: they swim here while the band is off screen (Pond.zone). Under it,
 * the next edition's time, from the edition's history ("the 08:00 schedule").
 */
(() => {
  const box = document.getElementById("foot-pond"), next = document.getElementById("foot-next"), slot = document.getElementById("slot-foot");
  if (!DESIGN.footCat) { box.hidden = true; return; }
  const at = [...state.history, ...(EDITION.history || [])].map(h => String(h.how || "").match(/\b(\d\d:\d\d) schedule\b/)).find(Boolean);
  next.textContent = at ? `next edition · ${now().slice(0, 5) < at[1] ? "today" : "tomorrow"} ${at[1]}` : "";
  new IntersectionObserver(([e]) => { if (e.isIntersecting) Cat.foot(); }, { threshold: 0.7 }).observe(slot);
})();

/*
 * The design switches. "design" at the end of the footer opens a small glass panel with one box per effect. Apply
 * keeps the choice (localStorage and #fx= in the address) and reloads, as several effects start when the page loads.
 */
(() => {
  const panel = document.createElement("div");
  panel.className = "fx-panel"; panel.id = "fx-panel"; panel.hidden = true;
  panel.setAttribute("role", "dialog"); panel.setAttribute("aria-label", "Design effects");
  panel.innerHTML = `<h2>Design effects</h2><p>Learnt from designeer.xyz. They stack; Apply reloads the page.</p>${FX.map(([k, label, d]) => `<label><input type="checkbox" name="${k}"${DESIGN[k] ? " checked" : ""}><span>${esc(label)}</span><span class="meta">${d ? "" : "off by default"}</span></label>`).join("")}<div class="fx-row"><button type="button" data-fx="reset">Defaults</button><button type="button" class="go" data-fx="apply">Apply</button></div>`;
  document.body.append(panel);
  const btn = () => document.querySelector(".fx-btn");
  const open = on => {
    panel.hidden = !on;
    btn()?.setAttribute("aria-expanded", String(on));
    if (on) panel.querySelector("input")?.focus(); else btn()?.focus();
  };
  function apply(vals) {
    const diff = FX.filter(([k, , d]) => vals[k] !== d).map(([k, , d]) => (d ? "-" : "") + k).join(",");
    try { if (diff) localStorage.setItem(FX_KEY, diff); else localStorage.removeItem(FX_KEY); } catch (e) { /* the address keeps it */ }
    try { history.replaceState(null, "", diff ? `#fx=${diff}` : location.pathname + location.search); } catch (e) { location.hash = diff ? `fx=${diff}` : ""; }
    location.reload();
  }
  panel.addEventListener("click", e => {
    const b = e.target.closest("[data-fx]");
    if (!b) return;
    if (b.dataset.fx === "reset") apply(Object.fromEntries(FX.map(([k, , d]) => [k, d])));
    else apply(Object.fromEntries(FX.map(([k]) => [k, panel.querySelector(`input[name="${k}"]`).checked])));
  });
  panel.addEventListener("keydown", e => { if (e.key === "Escape") open(false); });
  document.addEventListener("click", e => {
    if (e.target.closest(".fx-btn")) { open(panel.hidden); return; }
    if (!panel.hidden && !e.target.closest(".fx-panel")) open(false);
  });
  afterRender.push(() => {
    const f = document.querySelector("#footer .meta");
    if (f && !f.querySelector(".fx-btn")) f.insertAdjacentHTML("beforeend", ` · <button class="fx-btn" type="button" aria-controls="fx-panel" aria-expanded="false">design ${FX.filter(([k]) => DESIGN[k]).length}/${FX.length}</button>`);
  });
})();


/*
 * Trial v11 (candleFocus): the 30-day candles, after Damir Sokolovsky's "Unslopping a vibecoded dashboard" (one bar
 * lit among quiet ones) and Lorenzo Cabra's "Stacked Bars" (rounded bars in colour). The candles take the code's own
 * line colour, the one its row's trend line has; their bodies are rounded. Today's candle stands in a lit column with
 * its change above it, and the days before it grow fainter with age. The 1-month range is a shaded band with its two
 * dashed edges. A pointer over the chart moves the light to that day (see the hover below).
 * The column and the band are paths, not rects: `.chart rect` is what the cat's yarn treats as a candle.
 */
function focusCandles(h, r, demo) {
  const W = 560, H = 150, pad = 4, data = h.ohlc, last = data.length - 1;
  const lo = Math.min(...data.map(d => d.l)), hi = Math.max(...data.map(d => d.h));
  const y = v => pad + (hi - v) / ((hi - lo) || 1) * (H - pad * 2);
  const step = (W - pad * 2) / data.length, bw = Math.max(3, step * 0.56), rx = Math.min(bw / 2, 2.5);
  const cx = i => pad + step * i + step / 2, f = v => v.toFixed(1);
  const box = (x0, y0, x1, y1) => `M${f(x0)} ${f(y0)}H${f(x1)}V${f(y1)}H${f(x0)}Z`;
  const colour = DESIGN.colorLines ? `var(--line-${Math.max(0, EDITION.market.holdings.indexOf(h)) % 6})` : "var(--ink)";
  const mood = moodAttr(h.pct < 0 ? "bad" : "good");
  let s = "";
  [0.25, 0.5, 0.75].forEach(k => { const yy = pad + k * (H - pad * 2); s += `<line class="gl" x1="0" x2="${W}" y1="${yy}" y2="${yy}"/>`; });
  if (r) {
    const x0 = pad + step * Math.max(0, data.length - (h.closes.length - r.from));
    s += `<path class="c-band" d="${box(x0, y(r.hi), W - pad, y(r.lo))}"/>` + [r.hi, r.lo].map(v => `<line class="lv" x1="${f(x0)}" x2="${W - pad}" y1="${f(y(v))}" y2="${f(y(v))}"/>`).join("");
  }
  s += `<path class="c-col" d="${box(cx(last) - step / 2, 0, cx(last) + step / 2, H)}"/>`;
  data.forEach((d, i) => {
    const top = y(Math.max(d.o, d.c)), bot = y(Math.min(d.o, d.c));
    /* the change on that day, against the close before it; today's is the edition's own figure */
    const move = i === last && h.pct != null ? h.pct : (d.c / (i ? data[i - 1].c : d.o) - 1) * 100;
    const age = i === last ? 1 : (0.9 - 0.55 * (last - i) / last).toFixed(2);
    const today = i === last ? ` data-perch="market-today-${esc(h.symbol)}" data-act="squash"${mood}` : "";
    s += `<g class="c-day${i === last ? " on" : ""}" style="--age:${age}" data-i="${i}" data-m="${move.toFixed(2)}" data-x="${f(cx(i) / W * 100)}" data-y="${f(y(d.h) / H * 100)}">`
      + `<line class="wick" x1="${f(cx(i))}" x2="${f(cx(i))}" y1="${f(y(d.h))}" y2="${f(y(d.l))}"/>`
      + `<rect class="${d.c >= d.o ? "up" : "down"}" x="${f(cx(i) - bw / 2)}" y="${f(top)}" width="${f(bw)}" height="${f(Math.max(1, bot - top))}" rx="${rx}"${today}/></g>`;
  });
  const svg = `<svg class="chart focus" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(h.symbol)}, last ${data.length} daily candles${demo}." style="--c:${colour}">${s}</svg>`;
  return {
    svg: `<div class="c-wrap" data-last="${last}" data-step="${f(step)}">${svg}<span class="c-tip meta" aria-hidden="true"></span></div>`,
    note: "daily candles" + demo + " · hollow closed up, filled closed down · today lit, earlier days fainter"
  };
}

/*
 * Trial v11 (candleFocus): the light follows the pointer. Over the chart, the day under the pointer is lit and says its
 * change and how many trading days back it is; off the chart, the light goes back to today. Each render draws the
 * chart again, so the tip is placed after every render too.
 */
(() => {
  if (!DESIGN.candleFocus) return;
  const back = n => n === 0 ? "today" : `${n} trading ${n === 1 ? "day" : "days"} back`;
  function light(wrap, i) {
    const last = +wrap.dataset.last, g = wrap.querySelector(`.c-day[data-i="${i}"]`), tip = wrap.querySelector(".c-tip");
    if (!g || !tip) return;
    wrap.querySelectorAll(".c-day.on").forEach(x => x.classList.remove("on"));
    g.classList.add("on");
    wrap.querySelector(".c-col")?.setAttribute("transform", `translate(${((i - last) * +wrap.dataset.step).toFixed(1)} 0)`);
    tip.innerHTML = `<b>${chg(+g.dataset.m)}</b> ${back(last - i)}`;
    const x = +g.dataset.x;
    tip.style.left = `${x}%`;
    tip.style.top = `${g.dataset.y}%`;
    tip.classList.toggle("end", x > 82);
    tip.classList.toggle("start", x < 18);
  }
  afterRender.push(() => document.querySelectorAll(".c-wrap").forEach(w => light(w, +w.dataset.last)));
  let over = null;
  document.addEventListener("pointermove", e => {
    const wrap = e.target.closest?.(".c-wrap");
    if (over && over !== wrap) { light(over, +over.dataset.last); over = null; }
    if (!wrap) return;
    const svg = wrap.querySelector("svg"), b = svg.getBoundingClientRect(), k = b.width / 560;
    const i = Math.max(0, Math.min(+wrap.dataset.last, Math.floor((e.clientX - b.left - 4 * k) / (+wrap.dataset.step * k))));
    over = wrap;
    light(wrap, i);
  }, { passive: true });
  document.addEventListener("pointerleave", () => { if (over) { light(over, +over.dataset.last); over = null; } });
})();


/*
 * Trial v13 (water): pond, black or light water, as in ASCII Koi (app.js). The user, 11-06: the panel is the nav's
 * liquid glass, with no words, shows only when T is pressed, for a moment, in the pond's lower left corner; then:
 * "参考 designeer.xyz 相关设计为我重新设计". So it follows shawn.'s "interactions on the toolbar"
 * (designeer.xyz/finds/zzzzshawn-2110676622290624760): a big rounded tile filled by a dithered colour ball beside a grid
 * of smaller rounded squares. Here the ball is the water in use, drawn in cells like the pond and lit from the upper
 * left; the grid holds the three waters, each square filled with its colour, and a tile that feeds the koi.
 * T moves to the next water, as T does in ASCII Koi, and the panel shows which one it is; a click on a square picks it.
 * It fades out a few seconds after the last key or click, and stays while it is pointed at or holds the focus.
 * The choice is kept in this browser when it may keep it (not inside n8n's sandbox, where it lasts the visit).
 * A new water spreads from its square: the old pond, drawn once on a canvas on top, opens in a widening ring.
 */
(() => {
  if (!DESIGN.water) return;
  const WATERS = ["pond", "black", "light"], NAMES = { pond: "Pond water", black: "Black water", light: "Light water" };
  const RGB = { pond: [14, 42, 50], black: [13, 19, 21], light: [233, 228, 218] };
  const KEY = "one-page-water", SHOW_MS = 2600, root = document.documentElement;
  const store = {
    get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
    set(v) { try { localStorage.setItem(KEY, v); } catch (e) { /* the sandbox: kept for this visit only */ } }
  };
  const saved = store.get();
  if (WATERS.includes(saved)) { root.dataset.water = saved; Pond.colors(); }
  const now = () => root.dataset.water || "pond";
  const stage = document.getElementById("stage"), pond = document.getElementById("pond"), nav = document.getElementById("topnav");
  const canFeed = DESIGN.feed && !reduce;
  const box = document.createElement("div");
  box.className = "pond-water float";
  box.setAttribute("role", "group");
  box.setAttribute("aria-label", "Water, press T for the next");
  box.innerHTML = `<canvas class="pw-ball" aria-hidden="true"></canvas><div class="pw-grid" role="radiogroup" aria-label="Water">`
    + WATERS.map(w => `<button type="button" role="radio" data-water-pick="${w}" aria-label="${NAMES[w]}" title="${NAMES[w]}"></button>`).join("")
    + (canFeed ? `<button type="button" class="pw-feed" aria-label="Feed the koi" title="Feed the koi"><i></i><i></i><i></i></button>` : "")
    + `</div>`;
  document.body.append(box);
  const snap = document.createElement("canvas");
  snap.className = "water-snap";
  snap.setAttribute("aria-hidden", "true");
  stage.after(snap);
  const mark = () => box.querySelectorAll("[data-water-pick]").forEach(b => b.setAttribute("aria-checked", String(b.dataset.waterPick === now())));

  /*
   * The ball: the water in use as a sphere of cells, 3.5px each with a hairline gap like the pond's tiles, lit from the
   * upper left with a soft highlight, over a faint grid of dots. Its colour eases to a new water in about half a second,
   * and while the panel shows, the light drifts a little, as the caustic net does on the pond.
   */
  const ball = box.querySelector(".pw-ball"), bctx = ball.getContext("2d"), SIZE = 70;
  let col = RGB[now()].slice(), raf = 0, last = 0, tb = 0;
  const mix = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
  const rgbs = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  function drawBall() {
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    if (ball.width !== Math.round(SIZE * dpr)) { ball.width = ball.height = Math.round(SIZE * dpr); }
    bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bctx.clearRect(0, 0, SIZE, SIZE);
    const ink = [235, 230, 220], light = col[0] + col[1] + col[2] > 450;
    /* the tile's own dot grid */
    bctx.fillStyle = rgbs(ink, 0.08);
    for (let y = 3.5; y < SIZE; y += 5) for (let x = 3.5; x < SIZE; x += 5) bctx.fillRect(x - 0.5, y - 0.5, 1, 1);
    const R = 27, C = SIZE / 2, cell = 3.5, lx = -0.55 + 0.07 * Math.sin(tb * 0.7), ly = -0.62 + 0.05 * Math.cos(tb * 0.5), lz = 0.56;
    const ln = Math.hypot(lx, ly, lz), Lx = lx / ln, Ly = ly / ln, Lz = lz / ln;
    const deep = light ? mix(col, [0, 0, 0], 0.42) : mix(col, [0, 0, 0], 0.35), mid = light ? col : mix(col, [255, 255, 255], 0.14), lit = light ? [255, 255, 255] : mix(col, [255, 255, 255], 0.62);
    for (let y = C - R; y < C + R; y += cell) for (let x = C - R; x < C + R; x += cell) {
      const dx = (x + cell / 2 - C) / R, dy = (y + cell / 2 - C) / R, d2 = dx * dx + dy * dy;
      if (d2 > 1) continue;
      const nz = Math.sqrt(1 - d2), lam = Math.max(0, dx * Lx + dy * Ly + nz * Lz), spec = Math.pow(lam, 18);
      let c = lam < 0.5 ? mix(deep, mid, lam * 2) : mix(mid, lit, (lam - 0.5) * 1.1);
      c = mix(c, [255, 255, 255], spec * 0.7);
      /* a darker rim, so the ball reads on any glass */
      if (d2 > 0.8) c = mix(c, light ? [60, 52, 44] : [0, 0, 0], (d2 - 0.8) * 1.6);
      bctx.fillStyle = rgbs(c);
      bctx.fillRect(x + 0.35, y + 0.35, cell - 0.7, cell - 0.7);
    }
  }
  function tick(t) {
    raf = 0;
    if (!box.classList.contains("on")) return;
    const dt = last ? Math.min(0.05, (t - last) / 1000) : 0;
    last = t; tb += dt;
    const to = RGB[now()];
    col = mix(col, to, Math.min(1, dt * 7));
    drawBall();
    if (!reduce) raf = requestAnimationFrame(tick);
  }
  const animate = () => { if (reduce) { col = RGB[now()].slice(); drawBall(); return; } if (!raf) { last = 0; raf = requestAnimationFrame(tick); } };

  /* Showing, for a moment: in the lower left corner of the pond on screen (the band, or the pond at the end), or under
     the nav when no pond is in view. */
  let hideAt = 0, held = false;
  const inView = el => { const r = el?.getBoundingClientRect(); return !!r && r.height > 0 && r.bottom > 40 && r.top < innerHeight - 40; };
  const host = () => box.parentElement?.classList.contains("pond-slot") ? box.parentElement : null;
  function show() {
    const band = document.getElementById("slot"), foot = document.getElementById("slot-foot");
    const to = Pond.progress() > 0.98 && inView(band) ? band : Pond.progress() > 0.98 && inView(foot) ? foot : null;
    if (to) { if (box.parentElement !== to) { box.classList.remove("on", "float"); to.append(box); void box.offsetWidth; } }
    else {
      if (!box.classList.contains("float")) { box.classList.remove("on"); box.classList.add("float"); document.body.append(box); void box.offsetWidth; }
      const r = nav?.getBoundingClientRect();
      box.style.setProperty("--water-top", `${Math.round(r && r.height && getComputedStyle(nav).opacity !== "0" ? r.bottom + 8 : 12)}px`);
    }
    box.classList.add("on");
    animate();
    clearTimeout(hideAt);
    if (!held) hideAt = setTimeout(hide, SHOW_MS);
  }
  function hide() { if (!held && !box.contains(document.activeElement)) box.classList.remove("on"); }
  box.addEventListener("pointerenter", () => { held = true; clearTimeout(hideAt); });
  box.addEventListener("pointerleave", () => { held = false; hideAt = setTimeout(hide, 1200); });
  box.addEventListener("focusout", () => { clearTimeout(hideAt); hideAt = setTimeout(hide, 1200); });

  function setWater(name, at) {
    if (!WATERS.includes(name) || name === now()) return;
    if (!reduce && pond.width) {
      /* the old water and its koi, where the pond is on screen now */
      snap.width = pond.width; snap.height = pond.height;
      const s = snap.getContext("2d");
      s.fillStyle = getComputedStyle(stage).getPropertyValue("--pond").trim() || "#0e2a32";
      s.fillRect(0, 0, snap.width, snap.height);
      s.drawImage(pond, 0, 0);
      snap.style.clipPath = stage.style.clipPath;
      snap.style.setProperty("--x", at.x + "px");
      snap.style.setProperty("--y", at.y + "px");
      snap.classList.remove("wipe");
      snap.classList.add("show");
      void snap.offsetWidth;
      snap.classList.add("wipe");
    }
    root.dataset.water = name;
    store.set(name);
    Pond.colors();
    mark();
    animate();
  }
  snap.addEventListener("transitionend", () => snap.classList.remove("show", "wipe"));
  const centre = w => { const r = box.querySelector(`[data-water-pick="${w}"]`).getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
  /* The feed tile drops a handful into the open water of this pond, to the right of the panel. */
  function feedHere() {
    const h = host();
    if (!h) return;
    const r = h.getBoundingClientRect(), p = box.getBoundingClientRect(), x0 = Math.max(r.left + r.width * 0.3, p.right + 40);
    Pond.feed(x0 + Math.random() * Math.max(10, r.right - 40 - x0) * 0.6, r.top + r.height * (0.35 + Math.random() * 0.3));
  }
  box.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.classList.contains("pw-feed")) feedHere();
    else setWater(b.dataset.waterPick, centre(b.dataset.waterPick));
    show();
  });
  /* arrow keys move along the three waters, as in a radio group */
  box.addEventListener("keydown", e => {
    const d = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : e.key === "ArrowLeft" || e.key === "ArrowUp" ? -1 : 0;
    if (!d || !e.target.closest("[data-water-pick]")) return;
    e.preventDefault();
    const w = WATERS[(WATERS.indexOf(now()) + d + 3) % 3];
    setWater(w, centre(w));
    box.querySelector(`[data-water-pick="${w}"]`).focus();
    show();
  });
  /* T: the next water, and the panel shows which one it is. Not while typing, and not with a modifier key. */
  document.addEventListener("keydown", e => {
    if ((e.key !== "t" && e.key !== "T") || e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
    if (e.target.closest?.("input, textarea, select, [contenteditable]")) return;
    show();
    const w = WATERS[(WATERS.indexOf(now()) + 1) % 3];
    requestAnimationFrame(() => setWater(w, centre(w)));
  });
  mark();
  drawBall();
})();

balance();
applyTheme();
/* Trial v4: the rows are fitted again when the width changes or the fonts arrive. */
let fitWidth = innerWidth, fitTimer = 0;
window.addEventListener("resize", () => {
  if (innerWidth === fitWidth) return;
  fitWidth = innerWidth;
  clearTimeout(fitTimer);
  fitTimer = setTimeout(balance, 200);
});
document.fonts?.ready.then(balance);
Pond.start();
Marks.start();
Cat.start();

/* Live: a tab that stays open, or that Chrome puts back from its cache, keeps the edition it was opened with.
   From 08:05 Paris n8n has today's edition (the 08:00 run, or the page builds it when that run was missed),
   so once this edition is older than that, today's page is opened again. The page is sandboxed (origin null):
   it cannot ask n8n first and has no storage. The time of the last try is kept in window.name, which a reload
   keeps, and there is at most one try every 30 minutes. When n8n is not running, the browser shows its error page. */
const Renew = (() => {
  const KEY = "one-page-renew:", WAIT = 30 * 60e3, DUE = 8 * 60 + 5;
  const parts = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Paris", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  /* The date of the newest edition n8n should have at this time: today from 08:05 Paris, the day before until then. */
  const due = (ms = Date.now()) => {
    const p = Object.fromEntries(parts.formatToParts(ms).map(x => [x.type, x.value]));
    const back = Number(p.hour) * 60 + Number(p.minute) < DUE ? 1 : 0;
    return new Date(Date.UTC(Number(p.year), Number(p.month) - 1, Number(p.day) - back)).toISOString().slice(0, 10);
  };
  const lastTry = () => { const m = /^one-page-renew:(\d+)$/.exec(window.name); return m ? Number(m[1]) : 0; };
  const mark = () => { window.name = KEY + Date.now(); };
  const old = () => EDITION.date < due();
  function check() {
    if (!live || state.renewing || state.busy || document.visibilityState !== "visible" || !old()) return;
    /* A try in the future means the clock was set back: do not let it block. */
    const since = Date.now() - lastTry();
    if (since >= 0 && since < WAIT) return;
    mark();
    state.renewing = true;
    render();
    location.replace("/webhook/today");
    /* Still here after two minutes: the load was stopped. Take the notice away; the next try waits for WAIT. */
    setTimeout(() => { state.renewing = false; render(); }, 120e3);
  }
  function start() {
    if (!live) return;
    /* Straight from n8n (not from the cache) and still not today's: n8n has just tried to build it, so wait before asking again. */
    const nav = performance.getEntriesByType?.("navigation")?.[0];
    if (nav && nav.transferSize > 0 && EDITION.staleEdition && old()) mark();
    document.addEventListener("visibilitychange", check);
    window.addEventListener("focus", check);
    window.addEventListener("pageshow", e => { if (e.persisted && state.renewing) { state.renewing = false; render(); } check(); });
    setInterval(check, 60e3);
    check();
  }
  return { due, check, start };
})();
Renew.start();
</script>
</body>
</html>
