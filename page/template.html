let split = null, fitSig = "", balancing = false;
/*
 * Trial v9 (rows): the board in rows, as in designeer's bento grids. A row is a wide card (Markets, AI news, the trip)
 * on the left two thirds and a narrow one (classes, shopping) on the right third: the lines of the five and the
 * inbox, so one gutter runs down the page. The cards in a row share their top and bottom edges, and balanceRows()
 * evens their lengths. Two narrow cards share a row half and half, and so do two wide ones under 1101 px; above, a
 * wide card left over has the row to itself, its rows in two columns. In one column the cards keep today's order.
 * v10: the rows follow today's importance (order(): what needs the reader, then the cards the five points to, then
 * the size of the move), as the contract asks; v9 paired the cards by length and moved the day's first card down.
 * The cards are taken two at a time in that order, so no card sits above a more important one; the wide one of a

  /* in one column (under 900 px) the cards simply keep today's order */
  const board = document.getElementById("board"), rows = !matchMedia("(min-width: 900px)").matches ? ids.map(id => ["one", id])
    : inOrder(ids);
  const hosts = [...board.querySelectorAll(":scope > .brow")];
  rows.forEach(([kind, ...cards], i) => {
    const row = hosts[i] || board.appendChild(document.createElement("div"));
    row.className = `brow ${kind}`;
    if ([...row.children].map(x => x.id).join() !== cards.join()) cards.forEach(id => row.appendChild(document.getElementById(id)));

 * rows in two columns, so it shows an even number. In one column (under 900 px) nothing needs evening.

  const board = document.getElementById("board"), h = el => el.getBoundingClientRect().height;

    const cards = [...row.children];
    if (cards.length === 1) {
      const k = FIT_KEY[cards[0].id];
      if (k && fit[k] % 2 && fit[k] < (avail[k] || 0)) { fit[k]++; render(); }
      continue;
    }
    const [x, y] = cards;
    for (let n = 0; n < 12; n++) {
      const hx = h(x), hy = h(y), diff = Math.abs(hx - hy);
      if (diff < 16) break;
      const ks = FIT_KEY[(hx < hy ? x : y).id], kl = FIT_KEY[(hx < hy ? y : x).id];
      const add = ks && fit[ks] < (avail[ks] || 0) ? ks : null, take = kl && fit[kl] > (kl === "travel" ? 1 : MIN_ROWS) && fit[kl] <= (avail[kl] || 0) ? kl : null;

  }
  for (const [col, want] of [["col-a", split.a], ["col-b", split.b]]) {
    const host = document.getElementById(col);

/*
 * Trial v4: the layout decides how many rows each card shows. Beside the five, classes go to the board if the column
 * would run more than 48 px past the five; then mail shows as many mails to read later as fit above the five's last line. On the board, a row is added to the shorter column, or taken from the longer one
 * (never below two rows), while that brings the two columns' ends closer. When the ends are less than about one row
 * apart, the last card of each column is stretched to meet the other. It runs at the start, when the width changes,
 * and when a card's tier or source changes; a reader's folds and clicks only change their own card.
 */

  const sideEl = document.getElementById("side"), five = () => document.getElementById("five").getBoundingClientRect().height;

      split = null; render();

      if (Math.abs(na - nb) >= diff) { fit[k] -= add ? 1 : -1; render(); break; }
    }
    const [ha, hb] = ends();
    board.classList.toggle("level", Math.abs(ha - hb) < 96);
  }
  balancing = false;
}

function render() {
  const E = EDITION;
  citeId = 0;
  const connected = state.sources.filter(s => s.status !== "off");
  const staleOnes = connected.filter(s => s.status === "stale");
  const okCount = connected.length - staleOnes.length;
  rankOf = [];
  E.picks.map((p, i) => i).sort((a, b) => groupOf(E.picks[a]) - groupOf(E.picks[b]) || a - b).forEach((i, n) => { rankOf[i] = n + 1; });
  const builtAt = String(lastBuild()?.time || E.builtAt).slice(0, 5);
  const statusText = state.busy ? "rebuilding…" : `${okCount}/${connected.length} sources ok · ${builtAt}`;

  document.getElementById("mast-right").innerHTML = `
      <span>${esc(E.weekday.slice(0, 3))} ${esc(E.day)} ${esc(E.monthYear)}</span>
      <button class="status${staleOnes.length ? " bad" : ""}" type="button" data-jump="behind"><span class="dot" aria-hidden="true"></span>${esc(statusText)}</button>`;

  /* An older edition when today's is not built yet, one notice per stale source, and a failed rebuild request. */
  document.getElementById("notice").innerHTML = (state.renewing ? `<p class="notice" role="status"><b>Loading today's edition.</b> If the 08:00 run was missed, n8n builds it first, which takes up to a minute.</p>`
    : E.staleEdition ? `<p class="notice" role="status"><b>This is the edition of ${esc(E.weekday)} ${esc(E.day)} ${esc(E.monthYear)}.</b> Today's edition is not built yet; it appears after the next run.</p>` : "")
    + staleOnes.map(s =>
      `<p class="notice" role="status"><b>⚠ ${esc(s.short)} failed twice${s.code ? ` (${esc(s.code)})` : ""}.</b> ${esc(s.note || "The last cached data is shown.")}${(b => b ? ` <button class="ink-link" type="button" data-goto="${b.sec}">Go to the block</button>` : "")(BLOCKS.find(b => b.src.includes(s.key)))}</p>`).join("")
    + (state.error ? `<p class="notice" role="status"><b>⚠ ${esc(state.error)}</b></p>` : "");

  /* Today's five */
  const pick = (p, i) => {
    /* The title and the line under it say what to do and why. Selecting the pick goes to the row it came from. */
    const found = String(p.result ?? "").trim(), r = dest(p);
    const checked = p.tool && found && found !== "—" ? `${CHECKED[p.tool] || `Checked with ${p.tool}`}: ${found}` : "Tool the agent called";
    const head = `<span class="sr">${rankOf[i]}. </span><span class="tt">${titleHtml(p)}</span>`;
    return `<li class="${p.kind}">

        <span class="rank" aria-hidden="true"${moodAttr(moodOf(p.ref))}>${rankOf[i]}</span>
        <div>
          ${r ? `<button class="pick-title" type="button">${head}<span class="sr">, go to ${r[0]}</span></button>` : `<span class="pick-title">${head}</span>`}
          <div class="pick-meta">

            <p class="pick-from meta">${p.from.map(cite).join("")}${p.tool ? `<span aria-hidden="true">→</span><span class="tool" title="${esc(checked)}">${esc(p.tool)}</span>${found && found !== "—" ? `<span class="found"><span class="sr">${esc(CHECKED[p.tool] || `Checked with ${p.tool}`)}: </span>${esc(nb(found))}</span>` : ""}` : ""}</p>
          </div>

        ${r ? chev : ""}

  };
  const indexed = E.picks.map((p, i) => [p, i]);
  const group = (n, label) => {
    const items = indexed.filter(([p]) => groupOf(p) === n);
    return items.length ? `<h3 class="group meta">${label} · ${items.length}</h3><ol class="picks">${items.map(([p, i]) => pick(p, i)).join("")}</ol>` : "";
  };

  /* "new" marks a mail the last run had not seen, but only in a list that also has older mail; when every mail is new it says nothing. */
  const mixed = list => list.some(m => m.isNew) && list.some(m => !m.isNew);
  const codesHidden = Number(E.mail?.codesHidden) || 0;
  /* Long numbers in a subject (an order, an account) are masked: the page is projected, and mail to read later now

  const masked = s => String(s).replace(/\d{6,}/g, "••••");
  const mailRow = (m, act, tagNew) => `<li>
      <span${zh(m.subject)}>${esc(masked(m.subject))}${tagNew && m.isNew ? ` <span class="tag meta">new</span>` : ""}<br><span class="meta">${esc(m.from)}</span></span>
      <span class="r">${m.deadline ? `<span class="meta${act ? " accent" : ""}"${act ? ` style="font-weight:600"` : ""}>due ${esc(m.deadline)}</span>` : ""}${refLink(featured("mail", m.subject))}</span>
    </li>`;

  /* Today's order of the blocks. A block on the board gets its tier and place on top of the card; a quiet one

  const plan = order(), B = Object.fromEntries(plan.map((b, i) => [b.key, { ...b, n: i + 1 }]));
  /* A block whose source failed says so on its badge and under its title, so it reads as cached from across the room.
     The glance list already gives the order, so the badge no longer carries the block's number (Impeccable trial v1). */
  const staleNote = b => { const s = b.src.map(src).find(s => s && s.status === "stale"); return s ? `<p class="stale-note"><b>${esc(s.short)} failed${s.code ? ` (${esc(s.code)})` : ""}.</b> Showing the data cached${when(s.cachedAt) ? ` on ${esc(when(s.cachedAt).replace(/[a-z]{3}/, m => m[0].toUpperCase() + m.slice(1)))}` : " by the last run"}.${s.note ? ` ${esc(s.note)}` : ""}</p>` : ""; };
  /* Trial v6 (pattern B): one figure per card, chosen by the data, is the card's loudest line. Under it what the figure
     counts, then one line that qualifies it. In the quiet strip the same parts run as one line of text. */
  const hero = (n, label, note = "", attrs = "", unit = "") => `<p class="hero"><span class="hero-n"${attrs}>${n}${unit ? `<small>\u00a0${unit}</small>` : ""}</span> <span class="hero-l">${label}</span>${note ? ` <span class="hero-x">${note}</span>` : ""}</p>`;
  const dir = n => n ? `<span class="dir" aria-hidden="true">${n > 0 ? "▲" : "▼"}</span><span class="sr">${n > 0 ? "up" : "down"} </span>` : "";
  /* A card on the board has two parts: on the left what the block is today (tier, title, its one sentence), on the

  const fill = (key, inner) => {
    const b = B[key], h = `<h2 class="title" id="${b.head}">${esc(b.name)}</h2>`, cached = b.src.some(stale);
    if (b.tier === 3 && !sideKeys.includes(key)) { document.getElementById(b.sec).innerHTML = `<div class="head">${h}${meta(b.src)}</div>${staleNote(b)}` + inner; return; }

    document.getElementById(b.sec).innerHTML = `<div class="blk-head"><div class="blk-top"><span class="blk-name"><h2 class="eyebrow" id="${b.head}">${esc(b.name)}</h2><span class="tier ${cached ? "stale" : TIER_CLASS[b.tier]}">${cached ? "cached" : TIERS[b.tier]}</span></span>${meta(b.src)}</div>${staleNote(b)}${lead.trim()}</div><div class="blk-body">${inner.slice(lead.length)}</div>`;
  };

  document.getElementById("zone1").innerHTML = `

  /* Classes */
  const C = E.courses, classes = C?.today || [];
  const nextAt = classes.findIndex(x => until(x.time.slice(0, 5)) !== "started");
  const nextLine = C?.next ? `<p class="meta foot-note">next · ${esc(C.next)}</p>` : "";
  fill("courses", !C ? offLine("zeus") : !classes.length ? `<p class="statement">No class today.</p>${nextLine}`
    : `<p class="verdict">${classes.length} ${classes.length === 1 ? "class" : "classes"} today${nextAt >= 0 ? `; the next starts at ${esc(classes[nextAt].time.slice(0, 5))}` : ", all started"}.</p>
    <ol class="agenda timeline">${classes.map((c, i) => `<li${i === nextAt ? ` class="next"` : nextAt < 0 || i < nextAt ? ` class="started"` : ""}><span class="time"${i === nextAt ? toy("zeus-next", "flip") : ""}>${esc(c.time.slice(0, 5))}</span>${i === nextAt ? `<span class="next-tag">next</span>` : ""}<span class="tl-title">${esc(c.title)}<br><span class="meta">${c.where ? esc(c.where) + " · " : ""}until ${esc(c.time.slice(-5))} · ${esc(until(c.time.slice(0, 5))).replace(/ /g, "\u00a0")}</span></span></li>`).join("")}</ol>
    ${nextLine}`);

  /* Mail */
  const [mailAct, mailLater] = E.mail ? mailSplit(E.mail) : [[], []];
  fill("mail", !E.mail ? offLine("gmail") : `<p class="hero"><span class="hero-n" data-w="act"${toy("mail-act", "hop", mailAct.length ? "" : "good")}>${mailAct.length}</span> <span class="hero-l" data-w="act">${mailAct.length === 1 ? "needs" : "need"} you today</span> <span class="hero-x"><span data-w="later"><span class="num">${mailLater.length}</span> can wait</span>${E.mail.hidden ? ` · <span data-w="hidden"><span class="num">${E.mail.hidden}</span>&nbsp;${E.mail.hidden === 1 ? "newsletter" : "newsletters"} hidden</span>` : ""}${codesHidden > 0 ? ` · <span data-w="codes"><span class="num">${codesHidden}</span>&nbsp;verification ${codesHidden === 1 ? "code" : "codes"} hidden</span>` : ""}</span>${mailWeek(E, { act: mailAct.length, later: mailLater.length, hidden: E.mail.hidden || 0, codes: Math.max(0, codesHidden) }) || waffle([["act", mailAct.length], ["later", mailLater.length], ["hidden", E.mail.hidden || 0], ["codes", Math.max(0, codesHidden)]])}</p>
    ${mailAct.length ? `<ul class="rows dim-list" style="margin-top:4px">${mailAct.slice(0, 3).map(m => mailRow(m, true, mixed(mailAct))).join("")}</ul>` : ""}

    ${fit.mail && mailLater.length ? `<h3 class="group meta">to read later</h3><ul class="rows later-list">${mailLater.slice(0, fit.mail).map(m => mailRow(m, false, mixed(mailLater))).join("")}</ul>` : ""}
    ${mailLater.length > fit.mail ? more("mail", `${mailLater.length - fit.mail} ${fit.mail ? "more " : ""}to read later`, `<ul class="rows">${mailLater.slice(fit.mail).map(m => mailRow(m, false, mixed(mailLater))).join("")}</ul>`) : ""}`);
  avail.mail = mailLater.length;

  /* AI and tech. AIHOT has two lists whose heat means different things: on the hot list it is how many people

     own heading, order and bar scale; without that, the items keep their order and share one scale. */
  const heatOf = a => Number(a.heat) || 0;
  const topHeat = list => Math.max(0, ...list.map(heatOf)) || 1;
  const news = (a, i, max, unit) => `<li class="news${i === 0 ? " first" : ""}">${lead ? `<span class="n meta" aria-hidden="true">${String(i + 1).padStart(2, "0")}</span>` : ""}
      <span><a class="ink-link" href="${safeUrl(a.url)}" target="_blank" rel="noopener"${zh(a.title)}>${esc(a.title)}</a>${a.isNew ? ` <span class="tag meta">new</span>` : ""} ${refLink(featuredAi(a))}</span>
      <span class="heat"><span class="meta"${unit === "score" ? ` title="AIHOT editors' score"` : unit ? ` title="AIHOT heat: people taking part"` : ""}${featuredAi(a) >= 0 ? toy("ai-" + a.url, "bar") : ""}>${esc(a.heat)} ${unit || "heat"}</span><span class="bar" aria-hidden="true"><i style="width:${Math.round(heatOf(a) / max * 100)}%"></i></span></span>

  /* As many rows as the layout gives the card (three by default), then the rest folded away. */
  const newsRows = (all, key, moreLabel, unit, from = 0) => {
    /* Trial v11 (aiLead): the list starts after the lead story (from 1), and its bars keep the lead's scale. */
    const max = topHeat(all), items = all.slice(from), row = (a, i) => news(a, i + from, max, unit), n = fit.ai;
    return `<ul class="rows dim-list" style="margin-top:4px">${items.slice(0, n).map(row).join("")}</ul>
    ${items.length > n ? more(key, `${items.length - n} ${moreLabel}`, `<ul class="rows dim-list">${items.slice(n).map((a, i) => row(a, i + n)).join("")}</ul>`) : ""}`;
  };
  const watched = E.ai ? E.ai.watch : [], byList = watched.length > 0 && watched.every(a => a.list === "hot" || a.list === "24h");
  const hotNews = watched.filter(a => a.list === "hot").sort((a, b) => heatOf(b) - heatOf(a)), dayNews = watched.filter(a => a.list === "24h").sort((a, b) => heatOf(b) - heatOf(a));
  /* Trial v11 (aiLead): the story that leads the block, the first of the hot list (or of the only list). */
  const leadOf = (byList ? (hotNews.length ? hotNews : dayNews) : watched)[0];
  const lead = DESIGN.aiLead && leadOf && leadOf.heat != null && Number.isFinite(Number(leadOf.heat)) ? leadOf : null, lead0 = lead ? 1 : 0;

  const aiWhat = !byList || hotNews.length ? `${E.ai?.hotCount != null ? `of <span class="num">${esc(E.ai.hotCount)}</span> ` : ""}hot topics` : `${stories(dayNews.length)} from the last 24 hours`;
  const aiHero = lead ? hero(esc(lead.heat), `<a class="ink-link ai-lead" href="${safeUrl(lead.url)}" target="_blank" rel="noopener"${zh(lead.title)}>${esc(lead.title)}</a>`,
      `${lead.isNew ? `<span class="tag meta">new</span> ` : ""}${byList && !hotNews.length ? `the best scored of <span class="num">${aiN}</span> ${stories(aiN)} from the last 24 hours on your watchlist` : `the hottest of <span class="num">${aiN}</span> watchlist ${aiN === 1 ? "match" : "matches"}${E.ai?.hotCount != null ? ` among <span class="num">${esc(E.ai.hotCount)}</span> hot topics` : ""}`}${byList && hotNews.length && dayNews.length ? `; and <span class="num">${dayNews.length}</span> ${stories(dayNews.length)} from the last 24 hours` : ""}${featuredAi(lead) >= 0 ? ` ${refLink(featuredAi(lead))}` : ""}`,
      featuredAi(lead) >= 0 ? toy("ai-" + lead.url, "bar") : "", byList && !hotNews.length ? "score" : "heat")
    : hero(aiN, `${aiWhat} ${aiN === 1 ? "matches" : "match"} your watchlist`, byList && hotNews.length && dayNews.length ? `and <span class="num">${dayNews.length}</span> ${stories(dayNews.length)} from the last 24 hours` : "");
  avail.ai = (!byList ? watched.length : hotNews.length || dayNews.length) - lead0;

    ${!watched.length ? "" : !byList ? newsRows(watched, "ai", "more topics", undefined, lead0)
      : [[hotNews, "ai", "hot topics", "more hot topics", "heat"], [dayNews, "ai-24h", "last 24 hours", "more from the last 24 hours", "score"]].filter(g => g[0].length)
        /* Only the first list shows its three rows; a second list waits folded, so the block keeps three rows (trial v2). */
        .map(([items, key, label, moreLabel, unit], n) => n ? more(key, `${items.length} from the ${label}`, `<ul class="rows dim-list">${items.map((a, i) => news(a, i, topHeat(items), unit)).join("")}</ul>`)

  const M = E.market, threshold = M?.threshold ?? 3, watch = watchOnly(), day = closeDay(M?.lastClose);

  const mover = M ? byMove(M.holdings)[0] : null, moverR = mover && rangeOf(mover);
  const closeAt = !day ? "the last close" : /close$/.test(day.head) ? esc(day.head) : `the ${esc(day.head)} close`;
  const marketHero = !mover ? "" : hero(dir(mover.pct) + Math.abs(mover.pct).toFixed(1), `<b>${esc(mover.symbol)}</b>${mover.name ? ` ${esc(mover.name)}` : ""}`,

  fill("market", !M ? offLine("market") : `${marketHero}${beyondLine ? `<p class="verdict">${esc(nb(beyondLine))}</p>` : ""}
    <div class="colhead meta" aria-hidden="true"><span>symbol</span><span>30 days</span><span>${day ? esc(day.head) : "last close"}</span></div>
    <ul class="holds">${shown.map(holdRow).join("")}</ul>
    ${codeBar}

/*
 * The koi pond. Decoration only: it carries no information.
 *
 * Each koi is a chain of spine nodes that trails its head, plus a travelling
 * body wave. Every character cell is sampled against the nearest point on the
 * spine (with sub-samples for soft edges), classified as body, fin, eye or
 * barbel, coloured by the fish's markings, and shaded by a light from the
 * upper left: light skin gets sparse glyphs, shadowed skin dense ones. Koi cast
 * a shadow on the pond floor and leave a short wake.
 *
 * Technique informed by stackedlol/ascii-sharks (MIT) and daoho.dev; the code
 * here is written for this page.
 *
 * The canvas is fixed and full screen. A clip rectangle shrinks from the whole
 * screen to the pond slot during the opening and then follows the slot. Koi
 * heads live in coordinates relative to that rectangle, so the shoal gathers
 * into the band as it shrinks.
 */
const POND_SLOT = "slot";
const Pond = (() => {
  const stage = document.getElementById("stage");
  const canvas = document.getElementById("pond");
  const intro = document.getElementById("intro");
  const introBox = document.getElementById("intro-box");
  const runway = document.getElementById("runway");
  const pauseBtn = document.getElementById("pause");
  const slotEl = document.getElementById(POND_SLOT);
  const footEl = DESIGN.footCat ? document.getElementById("slot-foot") : null;
  const ctx = canvas.getContext("2d");
  const N = 10;
  const RAMP = " .:-=+*#%@";
  const SUB = [0.25, 0.25, 0.75, 0.25, 0.25, 0.75, 0.75, 0.75];
  let vw = 0, vh = 0, dpr = 1, cw = 10, ch = 13, cols = 0, rows = 0, cw0 = 10, ch0 = 13, kOpen = 1.85;
  let t = 0, last = 0, paused = false, drawnAt = 0, prevKey = "", lastE = 0;
  let P = null;
  let tileRGB, tileA, glyphRGB, glyphA, glyphCode, shade, wake, wakeTmp, tintRGB, tintA;
  const touched = [];

  /* ── small maths ── */
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const sstep = (a, b, x) => { const k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
  const lerp = (a, b, e) => a + (b - a) * e;
  const h2 = (a, b) => { let x = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul(b | 0, 0x165667b1); x = Math.imul(x ^ (x >>> 15), 0x85ebca6b); x ^= x >>> 13; x = Math.imul(x, 0xc2b2ae35); return ((x ^ (x >>> 16)) >>> 0) / 4294967296; };
  const noise = (x, y, seed) => {
    const xi = Math.floor(x), yi = Math.floor(y), u = sstep(0, 1, x - xi), v = sstep(0, 1, y - yi);
    const a = h2(xi + seed * 131, yi), b = h2(xi + 1 + seed * 131, yi), c = h2(xi + seed * 131, yi + 1), d = h2(xi + 1 + seed * 131, yi + 1);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  };
  /* Trial v7: caustics. Two drifting noise fields; where they meet, light gathers in a thin moving net, as on a pool floor. */
  const caus = DESIGN.caustics ? (x, y) => 1 - Math.min(1, Math.abs(noise(x / 46 + t * 0.21, y / 46 - t * 0.13, 7) - noise(x / 39 - t * 0.17, y / 52 + t * 0.19, 11)) * 5.5) : () => 0;
  const rgb = hex => { const m = hex.trim().match(/^#?([0-9a-f]{6})$/i); const n = m ? parseInt(m[1], 16) : 0; return [n >> 16, (n >> 8) & 255, n & 255]; };
  const mixC = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
  const mul = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
  const pack = c => (clamp(c[0] | 0, 0, 255) << 16) | (clamp(c[1] | 0, 0, 255) << 8) | clamp(c[2] | 0, 0, 255);
  const css = n => `rgb(${n >> 16},${(n >> 8) & 255},${n & 255})`;

  /* ── koi body, as fractions of length: s runs from snout (0) to tail tip (1) ── */
  const BODY_END = 0.76;
  const halfW = s => s < 0.1 ? 0.118 * Math.pow(Math.sin(s / 0.1 * Math.PI / 2), 0.6)
    : s < 0.3 ? 0.118 + 0.02 * sstep(0.1, 0.3, s)
    : 0.03 + 0.108 * (1 - sstep(0.3, BODY_END, s));
  const tailW = s => 0.028 + 0.165 * Math.pow(sstep(0.72, 1, s), 0.85);
  const hit = { kind: 0, across: 0, rs: 1, ra: 0 };
  /* fin: an ellipse leaning back from a root on the body's edge */
  function fin(s, a, rootS, angle, reach, width) {
    const ra = halfW(rootS) * 0.85, ca = Math.cos(angle), sa = Math.sin(angle);
    const ds = s - rootS, da = a - ra;
    const along = ds * ca + da * sa - reach, perp = -ds * sa + da * ca;
    if ((along / reach) ** 2 + (perp / width) ** 2 > 1) return false;
    hit.kind = 2; hit.rs = ds; hit.ra = da;
    return true;
  }
  /* 1 body, 2 fin, 3 eye, 4 ridge, 5 barbel */
  function classify(s, a, past, flare, ahead, lateral) {
    hit.kind = 0; hit.across = 1; hit.rs = 1; hit.ra = 0;
    if (ahead > 0) {
      if (ahead < 0.05 && Math.abs(lateral - (0.042 + ahead * 0.75)) < 0.015) { hit.kind = 5; return true; }
      return false;
    }
    const w = halfW(s);
    if (s <= BODY_END && a <= w) {
      hit.across = a / w;
      hit.kind = s > 0.056 && s < 0.084 && hit.across > 0.5 && hit.across < 0.78 ? 3 : s > 0.3 && s < 0.6 && hit.across < 0.13 ? 4 : 1;
      return true;
    }
    if (s > 0.7 && past <= 0) {
      const tw = tailW(s) * flare;
      if (a <= tw && s <= 0.88 + 0.12 * (a / tw)) { hit.kind = 2; hit.rs = 1; hit.ra = (a / tw) * 0.8; return true; }
    }
    return fin(s, a, 0.2, 0.9 + 0.45 * (flare - 1), 0.07 * flare, 0.038) || fin(s, a, 0.47, 0.75, 0.038, 0.019);
  }

  /* ── markings: kohaku (red saddles), sanke (plus black spots), tancho (red crown) ── */
  function markings(variety, seed) {
    const r = j => h2(seed, j);
    if (variety === "tancho") return { red: [{ s: 0.1, v: 0, rs: 0.052, rv: 0.06 }], black: [] };
    const red = [];
    if (r(1) < 0.85) red.push({ s: 0.09, v: (r(2) - 0.5) * 0.03, rs: 0.05 + r(3) * 0.03, rv: 0.1 });
    /* Saddles of uneven length step from side to side, with white between them and on the flanks, so no koi reads as one solid colour or as stripes. */
    const n = r(4) < 0.25 ? 3 : 2, GAP = 0.05, w = [];
    for (let j = 0; j < n; j++) w.push(0.5 + r(30 + j));
    const unit = (0.45 - GAP * (n - 1)) / w.reduce((a, b) => a + b);
    let at = 0.23;
    for (let j = 0; j < n; j++) {
      const rs = unit * w[j] / 2;
      red.push({ s: at + rs, v: (j % 2 ? 1 : -1) * (0.022 + r(20 + j) * 0.018), rs: rs * 0.95, rv: 0.065 + rs * 0.3 + r(40 + j) * 0.02 });
      at += rs * 2 + GAP;
    }
    const black = [];
    if (variety === "sanke") for (let j = 0; j < 4 + Math.floor(r(50) * 3); j++) black.push({ s: 0.25 + r(60 + j) * 0.42, v: (r(70 + j) - 0.5) * 0.15, rs: 0.021, rv: 0.025 });
    return { red, black };
  }
  const inPatch = (m, s, vn, wob) => ((s - m.s) / m.rs) ** 2 + ((vn - m.v) / m.rv) ** 2 < 1 + wob;
  function skin(f, s, vn, across) {
    if (across > 0.9 || s > 0.74) return 0;
    const wob = (noise(s * 13 + f.seed, vn * 28, f.seed) - 0.5) * 0.65;
    for (const m of f.marks.black) if (inPatch(m, s, vn, wob)) return 2;
    for (const m of f.marks.red) if (inPatch(m, s, vn, wob)) return 1;
    return 0;
  }

  /* ── the shoal ── */
  /*
   * Fourteen koi, each in one of four colour schemes taken in turn (the same as
   * the pond on the GitHub page): the course's orange, vermilion, gold and sakura.
   * All patterned: kohaku and sanke, with one tancho late in the list.
   */
  const VARIETY = ["kohaku", "sanke", "kohaku", "sanke", "kohaku", "sanke", "kohaku", "sanke", "kohaku", "tancho", "sanke", "kohaku", "sanke", "kohaku"];
  const COLOURS = ["course", "vermilion", "gold", "sakura"];
  const fish = VARIETY.map((variety, i) => {
    const r = seeded("koi" + i);
    const right = i % 2 === 0, a = right ? (r() - 0.5) * 0.3 : Math.PI + (r() - 0.5) * 0.3;
    const L0 = 128 + r() * 52, seg = L0 / (N - 1);
    const nodes = new Float32Array(N * 2);
    for (let j = 0; j < N; j++) { nodes[j * 2] = -Math.cos(a) * seg * j; nodes[j * 2 + 1] = -Math.sin(a) * seg * j; }
    const seed = i * 97 + 13;
    return { variety, colour: COLOURS[i % 4], seen: 1, seed, marks: markings(variety, seed), a, nodes, seg, L0, cruise: 24 + r() * 12, nx: (i * 0.38 + 0.15) % 1, ny: 0.22 + r() * 0.56, depth: 0.35 + r() * 0.65, phase: r() * 6.28, beat: 0.5, turn: 0, flee: 0, fleeA: 0, seekX: 0, seekY: 0, seekFrom: 0, seekUntil: 0 };
  });
  /* the most one joint of a koi turns from the one in front of it, in radians */
  const BEND = 0.42;
  /* Trial v13 (feed): how keen each koi is, when it may eat again, how close it has come to the surface. */
  fish.forEach(f => Object.assign(f, { appetite: h2(f.seed, 5), fullUntil: 0, rise: 0, kick: 0, meal: null }));
  /* More koi in a bigger pond, by width or by area. */
  const room = (w, h) => clamp(Math.max(w / 210, w * h / 85000), 3, fish.length);
  /*
   * The opening screen sets how many koi there are, and the band keeps them all.

const Marks = (() => {
  const narrow = () => window.innerWidth < 720;
  const intro = AsciiMark(document.getElementById("wordmark"), () => ({
    text: "One Page", font: `700 ${narrow() ? 110 : 170}px "Noto Serif Display"`,
    cw: narrow() ? 4 : 7, ch: narrow() ? 5 : 9, maxW: Math.min(window.innerWidth * (narrow() ? 0.9 : 0.8), 700), crisp: true, tint: true, edge: DESIGN.titleEdge, glow: DESIGN.titleGlow ? 1 : 0
  }));
  /* "is all you need", drawn the same way as the title, smaller and a little fainter */
  const tag = AsciiMark(document.getElementById("wordmark-tag"), () => ({
    text: "is all you need", font: `700 ${narrow() ? 64 : 84}px "Noto Serif Display"`,
    cw: narrow() ? 3 : 4, ch: narrow() ? 4 : 5, maxW: Math.min(window.innerWidth * (narrow() ? 0.66 : 0.42), 420), tone: 0.88, crisp: true, tint: true, edge: DESIGN.titleEdge && !narrow(), glow: DESIGN.titleGlow ? 0.7 : 0
  }));
  /* The masthead: fine cells, glyphs that fill them and a backing tile, so it reads at its small size. */
  const mast = AsciiMark(document.getElementById("mast-mark"), () => ({
    text: "One Page", font: `700 110px "Noto Serif Display"`, cw: 3, ch: 3.8, maxW: 250, crisp: true
  }));
  let mastShown = false, last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (now - last < 66) return;
    last = now;
    const e = Pond.progress();
    if (e < 0.6) { intro.draw(now); tag.draw(now); }
    if (e > 0.95) {
      if (!mastShown) { mastShown = true; mast.restart(); }
      mast.draw(now);
    }
  }
  const build = () => Promise.all([intro.build(), tag.build(), mast.build()]);
  const drawAll = now => { intro.draw(now); tag.draw(now); mast.draw(now); };
  return {
    async start() {
      await build();
      intro.restart(); tag.restart(350);
      document.getElementById("intro-box").classList.add("go");
      if (reduce) { drawAll(0); return; }
      requestAnimationFrame(frame);
      window.addEventListener("resize", () => { build().then(() => drawAll(performance.now())); });
    }
  };
})();

const now = () => new Date().toLocaleTimeString("en-GB", { hour12: false, timeZone: "Europe/Paris" });
const pause = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));

/* Live: ask n8n to rebuild today's edition, then load the new page. Demo: play the run in the page. */
async function rebuild() {
  if (state.busy) return;
  state.busy = true;
  state.behind = true;
  state.error = null;
  if (live) {
    render();
    try {
      let r;
      try { r = await fetch("/webhook/rebuild", { method: "POST" }); }
      catch (net) {
        /* The request could not be sent from this sandboxed page: post a plain form instead; n8n answers with a redirect to today's page. */
        const f = Object.assign(document.createElement("form"), { method: "post", action: "/webhook/rebuild" });
        document.body.appendChild(f);
        f.submit();
        return;
      }
      if (r.status === 429) throw new Error("the last rebuild was less than 10 minutes ago");
      if (r.status === 502) throw new Error("the editor agent failed");
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      location.assign("/webhook/today");
    } catch (e) {
      state.busy = false;
      state.error = `Rebuild not started: ${e.message}. Today's edition is unchanged.`;
      state.log.push({ t: now(), msg: `Rebuild request failed (${e.message})`, bad: true });
      render();
    }
    return;
  }
  const fail = FAILURES[state.failure];
  const say = async (msg, bad = false, ms = 240) => { state.log.push({ t: now(), msg, bad }); render(); await pause(ms); };
  await say("Rebuild requested from this page");
  const on = state.sources.filter(s => s.status !== "off");
  for (const s of on) {
    if (fail && fail.source === s.key) {
      await say(`${s.short}: ${fail.code}, retrying once`, true, 420);
      await say(`${s.short}: ${fail.code} again, cache used`, true);
    } else {
      await say(`${s.short}: OK`, false, 150);
    }
  }
  await say(`Diff vs v${state.version}: 0 new items`);
  await say(`Editor agent: ${EDITION.picks.length} picks, ${EDITION.picks.filter(p => p.tool).length} tool calls`, false, 400);
  const v = state.version + 1, t = now();
  state.log.push({ t, msg: `Edition ${EDITION.date} replaced: v${state.version} to v${v}, still 1 row` });
  for (const s of on) {
    if (fail && fail.source === s.key) Object.assign(s, { status: "stale", code: fail.code, note: fail.note, cachedAt: s.cachedAt || `${EDITION.date}T${EDITION.builtAt}` });
    else Object.assign(s, { status: "ok", code: null, note: null, cachedAt: null, fetched: t });
  }
  state.version = v;
  state.history.push({ v, time: t, how: fail ? `a rebuild; ${src(fail.source).short} failed, so its cache was used` : "a manual rebuild" });
  state.busy = false;
  render();
}

/*
 * Trial v5: the nav on the top row. One tab per block, in the order the blocks sit on the page (top to bottom, then
 * left to right), so the five comes first and the quiet ones last. The block that fills most of the screen under the
 * nav is the current one, and the pill slides to its tab. A tab scrolls its block to just under the nav, and its tab
 * stays current until the reader scrolls on. The capsule shows once the opening has played; keyboard focus on it
 * during the opening finishes the opening first.
 * In Chromium the capsule is liquid glass: what passes under its rim bends, as through a lens. The bend comes from an
 * SVG displacement map built for the capsule's size: a convex squircle bezel, refracted by Snell's law (method from
 * kube.io, "Liquid Glass in the Browser", and archisvaze/liquid-glass, MIT). Elsewhere it is a frosted capsule.
 */
const Nav = (() => {
  const nav = document.getElementById("topnav"), track = document.getElementById("topnav-track"), pill = document.getElementById("topnav-pill");
  const runway = document.getElementById("runway");
  const HOSTS = ["zone1", "side", "col-a", "col-b", "quiet-list"];
  let items = [], sig = "", cur = null, queued = false, hold = null;
  const pageXY = el => { let x = 0, y = 0; for (let n = el; n; n = n.offsetParent) { x += n.offsetLeft; y += n.offsetTop; } return [x, y]; };

  function build() {
    const els = HOSTS.flatMap(id => [...(document.getElementById(id)?.children || [])]).concat([...document.querySelectorAll("#board > .brow > section")])
      .filter(el => el.matches("section[aria-labelledby]") && el.offsetParent !== null)
      .map(el => ({ el, at: pageXY(el) }))
      .sort((a, b) => Math.round(a.at[1] / 8) - Math.round(b.at[1] / 8) || a.at[0] - b.at[0]);
    const next = els.map(({ el }) => ({ el, id: el.id, q: el.classList.contains("q"), name: (document.getElementById(el.getAttribute("aria-labelledby"))?.textContent || el.id).trim() }));
    const s = next.map(i => `${i.id}:${i.name}${i.q ? "~" : ""}`).join("|");
    items = next;
    if (s !== sig) {
      sig = s;
      track.querySelectorAll("button").forEach(b => b.remove());
      for (const i of items) {
        const b = document.createElement("button");
        b.type = "button"; b.dataset.nav = i.id; b.textContent = DESIGN.navWords ? NAV_WORD[i.id] || i.name.split(" ")[0] : i.name;
        if (DESIGN.navWords) b.title = i.name;
        if (i.q) b.className = "q";
        track.appendChild(b);
      }
      cur = null;
    }
    spy();
  }

  function spy() {
    if (!items.length) return;
    const top = nav.getBoundingClientRect().bottom, h = innerHeight;
    let best = items[0], most = 0;
    for (const i of items) {
      const r = i.el.getBoundingClientRect(), seen = Math.min(r.bottom, h) - Math.max(r.top, top);
      if (seen > most + 1) { most = seen; best = i; }
    }
    /* After a tab, its block stays current: through the scroll there, and until the reader has moved 40px on. */
    if (hold) {
      const d = Math.abs(scrollY - hold.y);
      if (!hold.arrived && (d < 2 || performance.now() > hold.until)) hold.arrived = true;
      if (hold.arrived && d > 40) hold = null;
      else best = items.find(i => i.id === hold.id) || best;
    }
    const btn = track.querySelector(`[data-nav="${best.id}"]`);
    if (!btn) return;

      cur = best;
      track.querySelectorAll("[data-nav]").forEach(b => b === btn ? b.setAttribute("aria-current", "true") : b.removeAttribute("aria-current"));

    }

    pill.style.transform = `translateX(${btn.offsetLeft}px)`;
  }

  function show() { nav.classList.toggle("on", reduce || scrollY > runway.offsetHeight - 80); }
  function tick() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; show(); spy(); });
  }
  addEventListener("scroll", tick, { passive: true });
  addEventListener("resize", tick);

  nav.addEventListener("click", e => {
    const b = e.target.closest("[data-nav]");
    const el = b && document.getElementById(b.dataset.nav);
    if (!el) return;
    const under = parseFloat(getComputedStyle(nav).top) + nav.offsetHeight + 16;
    const y = Math.max(0, Math.min(pageXY(el)[1] - under, document.documentElement.scrollHeight - innerHeight));
    hold = { id: el.id, y, arrived: false, until: performance.now() + 1500 };
    scrollTo({ top: y, behavior: reduce ? "auto" : "smooth" });
    tick();
  });
  nav.addEventListener("focusin", () => {
    if (!reduce && scrollY < runway.offsetHeight - 80) requestAnimationFrame(() => scrollTo(0, runway.offsetHeight));
  });

  /* ── the lens ── */
  const squircle = x => Math.pow(1 - Math.pow(1 - x, 4), 0.25);
  /* How far a ray is bent at each step across the bezel, for a glass of this thickness and refractive index. */
  function profile(thick, bezel, ior, n = 128) {
    const out = new Float64Array(n), eta = 1 / ior;
    for (let i = 0; i < n; i++) {
      const x = i / n, y = squircle(x), d = (squircle(x + 1e-4) - y) / 1e-4;
      const m = Math.hypot(d, 1), nx = -d / m, ny = -1 / m;
      const k = 1 - eta * eta * (1 - ny * ny);
      if (k < 0) continue;
      const s = eta * ny + Math.sqrt(k);
      out[i] = -s * nx * ((y * bezel + thick) / (eta - s * ny));
    }
    return out;
  }
  /* One image for the bend (red = x, green = y, 128 = none) and one for the rim light, both the capsule's size. */
  function maps(w, h, r, bezel, prof, max) {
    const make = () => { const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d"); return [c, g, g.createImageData(w, h)]; };
    const [dc, dg, di] = make(), [sc, sg, si] = make();
    const D = di.data, S = si.data, light = [Math.cos(Math.PI / 3), Math.sin(Math.PI / 3)], n = prof.length;
    for (let i = 0; i < D.length; i += 4) { D[i] = 128; D[i + 1] = 128; D[i + 3] = 255; }
    for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) {
      const x = px < r ? px - r : px >= w - r ? px - (w - r) : 0, y = py < r ? py - r : py >= h - r ? py - (h - r) : 0;
      const dist = Math.hypot(x, y), from = r - dist;
      if (dist === 0 || from < 0 || from > bezel) continue;
      const cos = x / dist, sin = y / dist, k = (py * w + px) * 4;
      const bend = prof[Math.min((from / bezel * n) | 0, n - 1)] / max;
      D[k] = (128 - cos * bend * 127 + 0.5) | 0;
      D[k + 1] = (128 - sin * bend * 127 + 0.5) | 0;
      const lit = Math.abs(cos * light[0] - sin * light[1]) * Math.sqrt(Math.max(0, 1 - (1 - from / 2) ** 2));
      S[k] = S[k + 1] = S[k + 2] = 255;
      S[k + 3] = (255 * lit * lit) | 0;
    }

    return [dc.toDataURL(), sc.toDataURL()];
  }
  const chromium = !!navigator.userAgentData?.brands?.some(b => /Chromium/.test(b.brand)) || /Chrome\//.test(navigator.userAgent);
  let size = "";
  function lens() {
    const w = nav.offsetWidth, h = nav.offsetHeight;
    if (w < 8 || h < 8 || nav.classList.contains("morph")) return;
    if (`${w}x${h}` === size) { nav.classList.add("lens"); return; }
    size = `${w}x${h}`;
    const r = Math.floor(h / 2), bezel = Math.min(16, r - 1), prof = profile(36, bezel, 1.5);
    const max = Math.max(...prof.map(Math.abs)) || 1, [disp, spec] = maps(w, h, r, bezel, prof, max);
    document.getElementById("topnav-defs").innerHTML = `<filter id="topnav-lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="frost"/>
      <feImage href="${disp}" x="0" y="0" width="${w}" height="${h}" result="map"/>
      <feDisplacementMap in="frost" in2="map" scale="${max.toFixed(1)}" xChannelSelector="R" yChannelSelector="G" result="bent"/>
      <feImage href="${spec}" x="0" y="0" width="${w}" height="${h}" result="spec"/>
      <feComponentTransfer in="spec" result="rim"><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feBlend in="rim" in2="bent" mode="normal"/>
    </filter>`;
    nav.classList.add("lens");
  }
  const lensOn = chromium && !matchMedia("(prefers-reduced-transparency: reduce)").matches && !!window.ResizeObserver;
  let lensTimer = 0;
  if (lensOn) new ResizeObserver(() => { clearTimeout(lensTimer); lensTimer = setTimeout(lens, 120); }).observe(nav);

  afterRender.push(build);
  return { build, spy, lens: () => { if (lensOn) lens(); } };
})();

/* #5 The inbox as one small square per mail: those that need the reader, those that can wait, then what was hidden. */
function waffle(parts) {
  const MAX = 64, total = parts.reduce((s, p) => s + p[1], 0);
  if (!DESIGN.waffle || !total) return "";
  let n = 0, cells = "";
  for (const [k, count] of parts) for (let j = 0; j < count && n < MAX; j++, n++) cells += `<i class="w-${k}" style="--i:${n}"></i>`;
  return `<span class="waffle" aria-hidden="true">${cells}${total > MAX ? `<span class="w-more">+${total - MAX}</span>` : ""}</span>`;
}

/*
 * #5 The inbox's week: a column of squares a day, today's last. Past days come from mail.week, which the workflow
 * does not send yet (it reads the last 24 hours of mail); without it the inbox keeps today's squares. Today's column
 * is always counted from today's lists, so it matches the figure above it.
 */
function mailWeek(E, today) {
  if (!DESIGN.week || !Array.isArray(E.mail.week) || !E.mail.week.length) return "";
  const past = E.mail.week.filter(d => d && /^\d{4}-\d\d-\d\d$/.test(d.date) && d.date < E.date).slice(-6);
  if (!past.length) return "";
  const days = [...past, { date: E.date, ...today }], KEYS = ["act", "later", "hidden", "codes"], CAP = 36;
  const name = iso => new Date(iso + "T12:00:00Z").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", timeZone: "UTC" });
  const said = d => `${name(d.date)}: ${d.act || 0} need you, ${d.later || 0} can wait, ${d.hidden || 0} hidden${d.codes ? `, ${d.codes} ${d.codes === 1 ? "code" : "codes"}` : ""}`;
  /* the squares rise today first, then back through the week */
  const cols = days.map((d, j) => {
    let cells = "", c = 0;
    for (const k of KEYS) for (let i = 0; i < Math.max(0, d[k] || 0) && c < CAP; i++, c++) cells += `<i class="w-${k}" style="--i:${((days.length - 1 - j) * 5 + c * 0.4).toFixed(1)}"></i>`;
    const last = j === days.length - 1, w = name(d.date).split(" ");
    return `<span class="wk-day${last ? " today" : ""}" title="${esc(said(d))}"><span class="wk-sq">${cells}</span><span class="wk-l" data-d="${esc(w.find(x => /\d/.test(x)) || "")}">${last ? "today" : esc((w.find(x => /\D/.test(x)) || "").slice(0, 2))}</span></span>`;
  });
  return `<span class="wk" aria-hidden="true">${cols.join("")}</span><span class="sr">This week: ${esc(days.map(said).join("; "))}.</span>`;
}

/* The route on Google Flights, for the stub: from the origin and the dates in the travel note when it gives them. */
function flightUrl(from, to, said) {
  const M = "JanFebMarAprMayJunJulAugSepOctNovDec", m = String(said || "").match(/(\d{1,2}) ([A-Z][a-z]{2}) (\d{4}) to (\d{1,2}) ([A-Z][a-z]{2}) (\d{4})/);
  const iso = (d, mo, y) => M.indexOf(mo) < 0 ? "" : `${y}-${String(M.indexOf(mo) / 3 + 1).padStart(2, "0")}-${d.padStart(2, "0")}`;
  const out = m ? iso(m[1], m[2], m[3]) : "", back = m ? iso(m[4], m[5], m[6]) : "";
  return "https://www.google.com/travel/flights?q=" + encodeURIComponent(`Flights${from ? ` from ${from}` : ""} to ${to}${out && back ? ` on ${out} through ${back}` : ""}`);
}

/*
 * #4 Every route is a boarding pass (designeer: Malay's pass with a tear-off stub). v9: the left part is the ticket
 * itself, as on a real pass: the two airports in large codes with their cities under them, then labelled fields
 * (out, back, fare, hotel) and, on the lead pass, a barcode. The stub on the right carries what changed: the change
 * against the low, the week's fares as a line in the route's colour, and the low itself. The fare nearest its low
 * leads, bigger, with the dates. The origin and the dates come from the travel note ("Round trip from Paris CDG,
 * 24 Dec 2026 to 3 Jan 2027"); what the note does not say is left off.

    : `<svg class="spark" viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true"><title>Only today's fare so far</title><line class="end" x1="100" y1="12" x2="100" y2="12"/></svg>`;
  const pt = (code, city, cls = "") => `<span class="tk-pt${cls}"><span class="tk-code">${esc(code)}</span><span class="tk-city">${esc(city)}</span></span>`;
  const field = (k, v, cls = "") => `<span class="tk-f${cls}"><span class="tk-k">${k}</span><span class="tk-v">${v}</span></span>`;
  const fields = (lead && when ? field("out", esc(when[1]), " date") + field("back", esc(when[2]), " date") : "")
    + field("fare", `<span class="tk-fare figure-n"${perch("travel", r.code, r.fare < r.low7 ? "good" : "", "ride")}>${esc(eur0(r.fare))}</span>`)
    + field("hotel", `${esc(eur0(r.hotel))}<small> / night</small>`);

  const url = DESIGN.tear ? flightUrl(from ? from[2] : "", r.code, said) : "";
  const stub = url
    ? `<a class="tk-stub tear" href="${esc(url)}" target="_blank" rel="noopener" draggable="false" title="Tear off: ${esc(r.city)} on Google Flights">${stubIn}<span class="tk-go meta">tear for flights<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 8 8 2M3.5 2H8v4.5"/></svg></span></a>`
    : `<div class="tk-stub">${stubIn}</div>`;
  const foot = lead ? `<p class="tk-foot">${barcode(`${from ? from[2] : ""}${r.code}${when ? when[1] + when[2] : ""}`)}${ref}</p>` : ref ? `<p class="tk-foot">${ref}</p>` : "";
  return `<li><div class="ticket${lead ? " lead" : ""}" style="--c:var(--line-${c % 6})" role="group" aria-label="${esc(`${from ? from[1] + " to " : ""}${r.city}`)}${lead ? ", the fare closest to its low" : ""}">
      <div class="tk-main">

      ${stub}

}

/*
 * #2 The nav as a dot-matrix island (designeer: sanyam's island, withAnimation's dot to pill). Scrolling down folds
 * it to one pill: a status light, the block in view in LED dots, and "4/7". Scrolling up or a click on the island
 * opens it to every tab; near the top of the page it stays open. The width follows a spring (FLIP: the old width is
 * set, then the new one, so CSS can animate between them). The light turns orange while a source is cached and
 * pulses while the page is rebuilt; the dots then count the minutes and seconds.
 */
const Island = (() => {
  const nav = document.getElementById("topnav"), isl = document.getElementById("isl"), dm = document.getElementById("isl-dm"), num = document.getElementById("isl-n");
  const track = document.getElementById("topnav-track"), runway = document.getElementById("runway");

  const ctx = dm.getContext("2d");
  /* A 5 by 7 dot font: seven rows of five dots, top to bottom. */
  const FONT = Object.fromEntries(Object.entries({
    A: "01110 10001 10001 11111 10001 10001 10001", B: "11110 10001 10001 11110 10001 10001 11110", C: "01110 10001 10000 10000 10000 10001 01110",
    D: "11110 10001 10001 10001 10001 10001 11110", E: "11111 10000 10000 11110 10000 10000 11111", F: "11111 10000 10000 11110 10000 10000 10000",
    G: "01110 10001 10000 10111 10001 10001 01111", H: "10001 10001 10001 11111 10001 10001 10001", I: "01110 00100 00100 00100 00100 00100 01110",
    J: "00111 00010 00010 00010 00010 10010 01100", K: "10001 10010 10100 11000 10100 10010 10001", L: "10000 10000 10000 10000 10000 10000 11111",
    M: "10001 11011 10101 10101 10001 10001 10001", N: "10001 10001 11001 10101 10011 10001 10001", O: "01110 10001 10001 10001 10001 10001 01110",
    P: "11110 10001 10001 11110 10000 10000 10000", Q: "01110 10001 10001 10001 10101 10010 01101", R: "11110 10001 10001 11110 10100 10010 10001",
    S: "01111 10000 10000 01110 00001 00001 11110", T: "11111 00100 00100 00100 00100 00100 00100", U: "10001 10001 10001 10001 10001 10001 01110",
    V: "10001 10001 10001 10001 10001 01010 00100", W: "10001 10001 10001 10101 10101 10101 01010", X: "10001 10001 01010 00100 01010 10001 10001",
    Y: "10001 10001 01010 00100 00100 00100 00100", Z: "11111 00001 00010 00100 01000 10000 11111",
    0: "01110 10001 10011 10101 11001 10001 01110", 1: "00100 01100 00100 00100 00100 00100 01110", 2: "01110 10001 00001 00010 00100 01000 11111",
    3: "11111 00010 00100 00010 00001 10001 01110", 4: "00010 00110 01010 10010 11111 00010 00010", 5: "11111 10000 11110 00001 00001 10001 01110",
    6: "00110 01000 10000 11110 10001 10001 01110", 7: "11111 00001 00010 00100 01000 01000 01000", 8: "01110 10001 10001 01110 10001 10001 01110",
    9: "01110 10001 10001 01111 00001 00010 01100", " ": "00000 00000 00000 00000 00000 00000 00000", ":": "00000 01100 01100 00000 01100 01100 00000",
    ".": "00000 00000 00000 00000 00000 01100 01100", "-": "00000 00000 00000 11111 00000 00000 00000", "/": "00000 00001 00010 00100 01000 10000 00000",
    "'": "00100 00100 01000 00000 00000 00000 00000", "&": "01100 10010 10100 01000 10101 10010 01101"
  }).map(([k, v]) => [k, v.split(" ").map(r => parseInt(r, 2))]));
  /* v8: a finer dot, so the folded island stays small. */
  const P = 2.2, R = 0.8;
  let mini = false, acc = 0, lastY = scrollY, quietUntil = 0, chars = 6, shown = "", prev = "", wipe = 0, busyAt = 0, clock = 0, timer = 0;
  /* The spring for the width: a damped oscillator sampled into linear(), about 4 % overshoot, settled in 0.56 s. */

    if (!CSS.supports("transition-timing-function", "linear(0, 1)")) return "var(--ease)";
    const z = 0.72, T = 0.56, w = 4.6 / (z * T), wd = w * Math.sqrt(1 - z * z), out = [];

  })();

  /* Column bitmasks for a label, centred in the display. */
  function columns(text) {
    const w = chars * 6 - 1, out = new Uint8Array(w), t = [...text.toUpperCase()].slice(0, chars), x0 = (chars - t.length) * 3;
    t.forEach((ch, n) => {
      const g = FONT[ch] || FONT[" "];
      for (let cx = 0; cx < 5; cx++) {
        let m = 0;
        for (let y = 0; y < 7; y++) if (g[y] >> (4 - cx) & 1) m |= 1 << y;
        const X = x0 + n * 6 + cx;
        if (X >= 0 && X < w) out[X] = m;
      }

    return out;
  }
  /* p runs from 0 to 1 while a new label wipes in from the left, column by column; the dots dip as they change. */
  function paint(p) {

      const k = Math.min(1, Math.max(0, (p * (w + 8) - x) / 8)), col = k < 0.5 ? a[x] : b[x], dip = Math.abs(k * 2 - 1);

  function show(text) {

    const t0 = performance.now();

    requestAnimationFrame(step);
  }
  /* The display is as wide as the longest tab: with key words, six letters or so. */
  function size() {
    chars = Math.min(16, Math.max(4, ...[...track.querySelectorAll("[data-nav]")].map(b => b.textContent.trim().length)));
    const w = (chars * 6 - 1) * P, h = 7 * P, pr = pixelRatio();
    dm.width = Math.round(w * pr); dm.height = Math.round(h * pr);
    dm.style.width = w + "px"; dm.style.height = h + "px";
    ctx.setTransform(pr, 0, 0, pr, 0, 0);

  }

  function update() {
    const btns = [...track.querySelectorAll("[data-nav]")], cur = track.querySelector("[data-nav][aria-current]"), i = btns.indexOf(cur);
    const stale = state.sources.filter(s => s.status === "stale");
    if (state.busy && !busyAt) { busyAt = performance.now(); clock = setInterval(update, 1000); }
    if (!state.busy && busyAt) { busyAt = 0; clearInterval(clock); }
    isl.classList.toggle("busy", state.busy);
    isl.classList.toggle("bad", !state.busy && stale.length > 0);
    const name = cur ? cur.textContent.trim() : "", full = cur ? cur.title || name : "", secs = busyAt ? Math.floor((performance.now() - busyAt) / 1000) : 0;
    show(state.busy ? `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}` : name);
    num.textContent = i >= 0 ? `${i + 1}/${btns.length}` : "";
    isl.setAttribute("aria-label", [state.busy ? "Rebuilding" : "", full && i >= 0 ? `${full}, block ${i + 1} of ${btns.length}` : "Blocks on this page",
      stale.length ? `${stale.map(s => s.short).join(", ")} cached` : ""].filter(Boolean).join(". "));
  }

  function set(on) {
    if (on === mini) return;
    const animate = !reduce && nav.classList.contains("on");
    const w0 = animate ? nav.getBoundingClientRect().width : 0;
    mini = on;
    nav.classList.toggle("mini", on);
    isl.setAttribute("aria-expanded", String(!on));

    nav.classList.remove("lens");
    nav.classList.add("morph");
    nav.style.transition = ""; nav.style.width = "";
    const w1 = nav.getBoundingClientRect().width;
    nav.style.width = w0 + "px";
    nav.getBoundingClientRect();
    nav.style.transition = `opacity 400ms var(--ease), width ${on ? 420 : 560}ms ${SPRING}`;
    nav.style.width = w1 + "px";
    if (!on) Nav.spy();
    timer = setTimeout(settle, on ? 440 : 580);
  }
  /* After the spring: the width is fit to the content again, the current tab is scrolled into the track, the lens rebuilt. */
  function settle() {
    nav.classList.remove("morph");

  }

  addEventListener("scroll", () => {
    const y = scrollY, dy = y - lastY;
    lastY = y;
    if (!dy) return;
    const top = y < runway.offsetHeight + 160;
    if (top || performance.now() < quietUntil) { acc = 0; if (top) set(false); return; }
    if (Math.sign(dy) !== Math.sign(acc)) acc = 0;
    acc += dy;

    if (e.target.closest("#isl")) { set(!mini); acc = 0; quietUntil = performance.now() + 500; return; }

/* #6 A card's figure rolls into place like an odometer the first time it is seen (NumberFlow). The cat's numbers are left alone. */
(() => {
  if (reduce || !DESIGN.odometer || !window.IntersectionObserver) return;
  const done = new Set();
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    io.unobserve(e.target);
    setTimeout(() => roll(e.target), 220);
  }), { threshold: 0.6 });
  function watch() {
    io.disconnect();
    document.querySelectorAll(".blk .hero-n:not([data-perch]), .tk-n").forEach(el => {
      const key = `${el.closest("section")?.id}:${el.closest(".ticket")?.getAttribute("aria-label") || ""}:${el.textContent}`;
      if (!done.has(key)) { el.dataset.odo = key; io.observe(el); }
    });
  }
  function roll(el) {
    if (!el.isConnected || done.has(el.dataset.odo)) return;
    done.add(el.dataset.odo);
    const saved = el.innerHTML, color = getComputedStyle(el).color;
    let k = 0;
    for (const n of [...el.childNodes].filter(n => n.nodeType === 3 && /\d/.test(n.nodeValue))) {
      const frag = document.createDocumentFragment();
      for (const ch of n.nodeValue) {
        if (!/\d/.test(ch)) { frag.append(ch); continue; }
        const s = document.createElement("span"), w = document.createElement("span"), strip = document.createElement("span");
        s.className = "odo"; s.textContent = ch;
        w.className = "odo-w"; w.setAttribute("aria-hidden", "true"); w.style.setProperty("--odo-c", color);
        strip.className = "odo-s"; strip.textContent = "01234567890123456789".split("").join("\n");
        strip.style.cssText = `--from:0;--to:${10 + +ch};--dur:${900 + k * 120}ms;--delay:${k * 70}ms`;
        w.append(strip); s.append(w); frag.append(s);
        k++;
      }
      n.replaceWith(frag);
    }
    if (!k) return;
    el.querySelectorAll(".odo").forEach(s => s.style.setProperty("--h", s.getBoundingClientRect().height + "px"));
    requestAnimationFrame(() => requestAnimationFrame(() => el.querySelectorAll(".odo-s").forEach(s => s.classList.add("go"))));
    setTimeout(() => { if (el.isConnected) el.innerHTML = saved; }, 1100 + k * 190);
  }
  afterRender.push(watch);
})();

/* #6 A trend line answers the pointer: a dot on the line, in its colour, and that day's value; the other rows step back (v8.css). */
(() => {
  if (!DESIGN.sparkHover) return;
  let tip = null, dot = null, on = null;
  const clear = () => { tip?.remove(); dot?.remove(); tip = dot = on = null; };
  document.addEventListener("pointermove", e => {
    const svg = e.pointerType === "mouse" && e.target.closest?.("svg.spark[data-v]");
    if (!svg) { if (on) clear(); return; }
    const vals = svg.dataset.v.split(",").map(Number), b = svg.dataset.b === "" ? null : Number(svg.dataset.b), n = vals.length;
    if (n < 2) return;
    const r = svg.getBoundingClientRect(), i = Math.round(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * (n - 1));
    const all = b == null ? vals : [...vals, b], max = Math.max(...all), min = Math.min(...all);
    const y = 2 + (max - vals[i]) / ((max - min) || 1) * 20;
    if (!tip) { tip = document.createElement("div"); tip.className = "spk-tip"; dot = document.createElement("div"); dot.className = "spk-dot"; document.body.append(dot, tip); }
    if (on !== svg) dot.style.background = getComputedStyle(svg.querySelector("polyline")).stroke;
    on = svg;
    const ago = n - 1 - i, trip = !!svg.closest(".route, .ticket");
    tip.textContent = `${trip ? eur0(vals[i]) : vals[i].toFixed(2)} · ${ago ? `${ago} ${trip ? (ago === 1 ? "day" : "days") : (ago === 1 ? "session" : "sessions")} ago` : "today"}`;
    dot.style.left = tip.style.left = r.left + scrollX + i / (n - 1) * r.width + "px";
    dot.style.top = r.top + scrollY + y / 24 * r.height + "px";
    tip.style.top = r.top + scrollY + "px";
  }, { passive: true });
  addEventListener("scroll", () => { if (on) clear(); }, { passive: true });
})();

/*
 * #4 Tearing the stub. A click on it, or Enter, tears it off and opens the route on Google Flights in a new tab. A
 * pull to the right bends it away from the perforation; let go past 72px and it tears, short of that it springs back.
 * A vertical drag stays a scroll. The pass keeps its place: a new stub slides in after a moment.
 * v10: the flights open once the stub has flown off, not at the first touch (the user, 11-02: 撕完之后再跳转). The
 * 0.7s flight is well inside the time a browser still counts the open as the reader's (Safari's is about 1s). With a
 * modifier key the browser opens the tab its own way, in the background, and the stub still tears.
 */
(() => {
  if (!DESIGN.tear) return;
  const TEAR = 72;
  let drag = null, eat = false;
  function tear(a) {
    const t = a.closest(".ticket");
    if (!t || t.classList.contains("torn")) return null;
    const start = a.style.transform || "none";
    a.style.transform = "";
    t.classList.remove("pull");
    if (reduce) return Promise.resolve();
    const ghost = a.cloneNode(true);
    ghost.removeAttribute("href"); ghost.removeAttribute("title"); ghost.setAttribute("aria-hidden", "true"); ghost.tabIndex = -1;
    ghost.classList.remove("pull");
    ghost.classList.add("tk-ghost");
    /* above the passes after it, which it falls across */
    ghost.style.cssText = `position:absolute;z-index:4;left:${a.offsetLeft}px;top:${a.offsetTop}px;width:${a.offsetWidth}px;height:${a.offsetHeight}px;margin:0;pointer-events:none;transition:none;transform:${start}`;
    t.append(ghost);
    t.classList.add("torn");
    const flown = ghost.animate([
      { transform: start, opacity: 1 },
      { transform: "translate(34px, -8px) rotate(9deg)", opacity: 1, offset: 0.22 },
      { transform: "translate(120px, 110px) rotate(34deg)", opacity: 0 }
    ], { duration: 700, easing: "cubic-bezier(0.4, 0, 0.7, 0.6)", fill: "forwards" }).finished.then(() => ghost.remove());
    /* a new stub, a moment later */
    setTimeout(() => {
      t.classList.remove("torn");
      a.animate([{ transform: "translateX(18px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 420, easing: "cubic-bezier(0.22, 1, 0.36, 1)" });
    }, 1800);
    return flown;
  }
  /* the flights, once the stub is gone */
  const fly = a => tear(a)?.then(() => window.open(a.href, "_blank", "noopener"));
  document.addEventListener("pointerdown", e => {
    const a = e.button === 0 && e.target.closest?.(".tk-stub.tear");
    if (a) drag = { a, id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, on: false };
  });
  document.addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.on) {
      if (Math.hypot(dx, dy) < 6) return;
      if (Math.abs(dy) > Math.abs(dx) || dx < 0) { drag = null; return; }
      drag.on = true;
      try { drag.a.setPointerCapture(e.pointerId); } catch (err) { /* the pull still follows while the pointer stays on the stub */ }
      drag.a.classList.add("pull");
      drag.a.closest(".ticket").classList.add("pull");
    }
    drag.dx = Math.max(0, dx);
    const k = Math.min(1.3, drag.dx / TEAR);
    drag.a.style.transform = `translate(${(drag.dx * 0.7).toFixed(1)}px, ${(k * 6).toFixed(1)}px) rotate(${(k * 10).toFixed(1)}deg)`;
  });
  const end = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const { a, on, dx } = drag;
    drag = null;
    if (!on) return;
    /* the click that follows a pull is not a click on the link */
    eat = true;
    setTimeout(() => { eat = false; }, 0);
    a.classList.remove("pull");
    if (e.type === "pointerup" && dx >= TEAR) fly(a);
    else { a.style.transform = ""; a.closest(".ticket").classList.remove("pull"); }
  };
  document.addEventListener("pointerup", end);
  document.addEventListener("pointercancel", end);
  document.addEventListener("click", e => {
    const a = e.target.closest?.(".tk-stub.tear");
    if (!a) return;
    if (eat) { e.preventDefault(); return; }
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) { tear(a); return; }
    e.preventDefault();
    fly(a);
  });
})();

/*
 * #9 What has been read steps back (designeer: shawn.'s text scaling down as it leaves). Each line of a card, a
 * row, a figure or a pass, shrinks a little, fades and blurs as it passes the last 150px under the nav. Lines, not
 * whole cards, so the step back is seen while the card is still mostly on screen. Positions are measured once per
 * render and resize; the scroll only writes styles.
 * v9: only what the reader has scrolled past steps back: a line must have been below the zone before it rises into
 * it. A jump (a tab in the nav, a pick, "Go to the block") lands its block just under the nav, inside the zone; when
 * the jump ends, the lines there are taken as unread and come back sharp, so the block's title is never blurred.
 */
(() => {
  if (!DESIGN.readFade || reduce) return;
  const nav = document.getElementById("topnav"), SPAN = 150, read = new WeakSet();
  let units = [], queued = false, timer = 0, jumping = false, still = 0;
  const reset = u => { const s = u.el.style; s.opacity = s.scale = s.filter = s.transformOrigin = s.transition = ""; u.k = 0; };
  function split(el, out) {
    for (const c of el.children) {
      if (c.matches(".sr, .spk-tip, .spk-dot") || !c.getClientRects().length) continue;
      if (c.offsetHeight > 120 && c.children.length > 1 && !c.matches("svg, canvas, .chart, .waffle, .wk, .ticket")) split(c, out);
      else out.push(c);
    }
  }
  function measure() {
    units.forEach(reset);
    const out = [];
    document.querySelectorAll(".five, .blk, .quiet-strip").forEach(card => { if (card.offsetParent) split(card, out); });
    units = out.map(el => { const r = el.getBoundingClientRect(); return { el, top: r.top + scrollY, h: r.height, k: 0 }; });
    update();
  }
  const zone = () => { const top = nav.classList.contains("on") ? nav.getBoundingClientRect().bottom + 4 : 0; return [top, top + SPAN]; };
  function update() {

      if (c > from && !jumping) read.add(u.el);
      const k = read.has(u.el) ? Math.round(Math.min(1, Math.max(0, (from - c) / SPAN)) * 40) / 40 : 0;
      if (k === u.k) continue;

      s.scale = (1 - 0.06 * e).toFixed(4);
      s.filter = DESIGN.readBlur && e > 0.05 ? `blur(${(e * 1.8).toFixed(2)}px)` : "";
    }
  }

      read.delete(u.el);
      if (!u.k) continue;
      const s = u.el.style;
      s.transition = "opacity 360ms var(--ease), scale 360ms var(--ease), filter 360ms var(--ease)";
      s.opacity = "1"; s.scale = "1"; s.filter = "";
      u.k = 0;
    }
  }
