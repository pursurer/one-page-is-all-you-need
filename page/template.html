<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Page Is All You Need</title>
<meta name="description" content="A daily page built by n8n at 08:00: the five things that matter today, picked by an editor agent from six sources.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23e9e4da'/%3E%3Cpath d='M10 7h12v18H10z' fill='none' stroke='%231c1a17' stroke-width='2'/%3E%3Cpath d='M13 12h6M13 16h6M13 20h4' stroke='%239e3214' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5..100,500..700&family=Geist:wght@400..600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Tokens from DESIGN.md (v6, dark ground from the board layout). Add a value there before using it here.
     The page is dark: a near-black with a little of the pond's blue in it, and blocks a step lighter.
     Light is kept only for a reader who picks it under "Behind this page". */
  :root {
    --bg: #111618;
    --surface: #172024;
    --pond: #0e2a32;
    --ink: #ebe6dc;
    --accent: #e8784f;
    --koi-light: #ece6da;
    --koi-dark: #3a3632;
    --ink-2: color-mix(in srgb, var(--ink) 66%, transparent);
    --ink-3: color-mix(in srgb, var(--ink) 40%, transparent);
    --rule: color-mix(in srgb, var(--ink) 12%, transparent);
    --hover: color-mix(in srgb, var(--ink) 5%, transparent);
    --title-from: #ffffff;
    --title-to: #9b9b9b;
    --shadow: rgba(0, 0, 0, 0.5);
    /* The cat and its yarn only. The yarn is the pond's lake blue. */
    --yarn: #67adc1;
    --cat-eye: #e4b32a;
    --cat-pink: #ee9fb1;

    --serif: "Noto Serif Display", "Didot", Georgia, serif;
    --sans: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --slot-h: 128px;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #e9e4da; --surface: #e1dbcf;
    --ink: #1c1a17; --accent: #9e3214;
    --koi-light: #f7f2e8; --koi-dark: #2b2723;
    --rule: color-mix(in srgb, var(--ink) 14%, transparent);
    --title-from: #000000; --title-to: #666666;
    --shadow: rgba(60, 48, 30, 0.14);
    --yarn: #194a57;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.4  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 24px;
    font-variant-numeric: tabular-nums;
  }
  h1, h2, h3, p, ul, ol, figure { margin: 0; }
  ul, ol { padding: 0; list-style: none; }
  button, select { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  b, strong { font-weight: 600; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .skip { position: absolute; left: 16px; top: -48px; z-index: 40; padding: 8px 12px; background: var(--ink); color: var(--bg); border-radius: 4px; }
  .skip:focus { top: 16px; }

  /* Type roles */
  .meta { font-family: var(--mono); font-size: 12px; line-height: 16px; letter-spacing: 0.02em; color: var(--ink-2); text-transform: lowercase; }
  .sub { color: var(--ink-2); font-size: 14px; line-height: 20px; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .accent { color: var(--accent); }
  .title { font-family: var(--serif); font-stretch: 75%; font-weight: 600; font-size: 30px; line-height: 36px; letter-spacing: -0.01em; }
  /* Links: a faint underline that firms up on hover or focus */
  .ink-link { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; text-decoration-color: var(--rule); transition: text-decoration-color 300ms var(--ease); }
  .ink-link:hover, .ink-link:focus-visible { text-decoration-color: currentColor; }
  .chev { width: 16px; height: 16px; flex: none; color: var(--ink-2); transition: transform 300ms var(--ease); }
  [aria-expanded="true"] .chev, details[open] > summary .chev { transform: rotate(90deg); }
  .cursor { display: inline-block; width: 0.55em; height: 1em; margin-left: 4px; transform: translateY(0.15em); background: var(--ink); }
  @media (prefers-reduced-motion: no-preference) {
    .cursor { animation: blink 1100ms steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  }

  /* Opening: the koi pond fills the screen, then shrinks into its band as the page scrolls */
  .runway { height: 88svh; }
  .stage { position: fixed; inset: 0; z-index: 20; pointer-events: none; background: var(--pond); }
  /* The pond is one lake blue in both themes, so whatever sits on it always takes the dark-theme inks. */
  .stage, .pond-slot {
    color-scheme: dark; color: var(--ink);
    --ink: #ebe6dc; --accent: #e8784f; --koi-light: #ece6da; --koi-dark: #3a3632;
    --ink-2: color-mix(in srgb, var(--ink) 66%, transparent); --ink-3: color-mix(in srgb, var(--ink) 40%, transparent);
    --title-from: #ffffff; --title-to: #9b9b9b;
  }
  .stage #pond { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .intro { position: absolute; inset: 0; z-index: 1; display: grid; place-content: center; justify-items: center; text-align: center; padding: 24px; }
  .intro-box { display: grid; justify-items: center; gap: 6px; }
  /* Only the title and the date: "One Page" drawn in character cells like the koi, the rest set in the page's serif */
  .wordmark, .wordmark-tag { display: block; }
  .intro-line { margin-top: 10px; font-family: var(--mono); font-size: 12px; line-height: 16px; letter-spacing: 0.16em; text-transform: lowercase; color: var(--ink-2); }
  .pond-slot { position: relative; height: var(--slot-h); }
  @media (prefers-reduced-motion: no-preference) { .pond-slot, .runway { cursor: pointer; } }
  .pond-pause {
    position: absolute; right: 12px; bottom: 8px; z-index: 21; padding: 4px 8px;
    opacity: 0; pointer-events: none; transition: opacity 300ms var(--ease);
  }
  .pond-pause.on { opacity: 1; pointer-events: auto; }
  .pond-pause:hover { color: var(--ink); }

  /* Page */
  .page { position: relative; max-width: 1264px; margin: 0 auto; padding: 0 32px 64px; }
  .mast { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 24px; padding: 16px 0; }
  .mast .name { display: inline-flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 12px; min-height: 36px; }
  .mast-mark { display: block; }
  .mast-tag { margin-bottom: 6px; font-family: var(--mono); font-size: 12px; line-height: 16px; letter-spacing: 0.16em; text-transform: lowercase; color: var(--ink-2); }
  .mast .right { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 24px; }
  .status { display: inline-flex; align-items: center; gap: 8px; transition: color 300ms var(--ease); }
  .status:hover { color: var(--ink); }
  .status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-2); }
  .status.bad { color: var(--ink); font-weight: 600; }
  .status.bad .dot { background: transparent; border: 1.5px solid var(--ink); }
  @media (prefers-reduced-motion: no-preference) {
    .status:not(.bad) .dot { animation: breathe 2400ms var(--ease) infinite; }
    @keyframes breathe { 50% { opacity: 0.35; } }
  }
  .notice { margin-top: 16px; padding: 12px 16px; background: var(--surface); font-size: 14px; line-height: 20px; }

  /* The five, with today's order of the blocks beside it; then the blocks as cards, two to a row, most important
     first; blocks with nothing today share one quiet strip at the end. */
  .top { margin-top: 24px; display: grid; grid-template-columns: minmax(0, 8fr) minmax(0, 4fr); gap: 32px; align-items: start; }
  .board { margin-top: 40px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
  .blk { min-width: 0; background: var(--surface); border-radius: 4px; padding: 20px 24px 24px; }
  .blk-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; }
  .blk > .title { margin-top: 8px; }
  .verdict { margin-top: 4px; color: var(--ink-2); font-size: 14px; line-height: 20px; text-wrap: pretty; overflow-wrap: anywhere; }
  .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; }
  /* What a block is today, the same word in the order beside the five and on the card */
  .tier { display: inline-block; padding: 0 6px; border: 1px solid var(--rule); border-radius: 3px; font-family: var(--mono); font-size: 11px; line-height: 16px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
  .tier.need { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  .tier.moved { border-color: var(--yarn); color: var(--yarn); }
  .tier.quiet { border-style: dashed; color: var(--ink-3); }
  .glance { padding-top: 24px; }
  .glance ol { margin-top: 8px; }
  .glance li { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 2px 12px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .glance li .tier { justify-self: start; }
  .glance .go { font-weight: 600; transition: color 300ms var(--ease); }
  .glance .go:hover { color: var(--accent); }
  .glance .st { grid-column: 2; overflow-wrap: anywhere; }
  .glance li.q .go { color: var(--ink-2); font-weight: 400; }
  .quiet-strip { margin-top: 24px; padding: 16px 24px; border: 1px dashed var(--rule); border-radius: 4px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px 24px; align-items: start; }
  .quiet-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px 32px; }
  .quiet-strip .q { min-width: 0; }
  .quiet-strip .q .title { font-size: 20px; line-height: 24px; }
  .quiet-strip .q .verdict { margin-top: 2px; }
  .quiet-strip[hidden] { display: none; }

  /* Today's five */
  .five { background: var(--surface); padding: 24px 24px 12px; }
  .lede { margin-top: 12px; color: var(--ink-2); max-width: 60ch; }
  .group { display: flex; align-items: center; gap: 12px; margin: 16px 0 4px; }
  .group::after { content: ""; flex: 1; border-top: 1px solid var(--rule); }
  .picks > li + li { border-top: 1px solid var(--rule); }
  .pick-row {
    display: grid; grid-template-columns: 40px minmax(0, 1fr) 16px; gap: 16px; align-items: start;
    padding: 12px 8px; margin: 0 -8px; border-radius: 4px; cursor: pointer;
    transition: background-color 300ms var(--ease), opacity 300ms var(--ease);
  }
  .pick-row:hover { background: var(--hover); }
  /* Hovering one pick lets the others step back */
  .picks:has(.pick-row:hover) .pick-row:not(:hover) { opacity: 0.5; }
  .rank { font-family: var(--serif); font-stretch: 75%; font-weight: 600; font-size: 30px; line-height: 32px; color: var(--ink-2); }
  .act .rank { color: var(--accent); }
  .pick-title { display: block; width: 100%; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.015em; text-wrap: balance; }
  .pick-meta { margin-top: 4px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
  .pick-why { color: var(--ink-2); text-wrap: pretty; }
  .pick-from { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
  .pick-row .chev { margin-top: 8px; }
  .pick-row.flat { cursor: default; }
  .tool { padding: 1px 6px; border-radius: 4px; background: var(--bg); color: var(--ink); }
  /* Sources as citations: hover one to see what that source sent today */
  .cite {
    position: relative; display: inline-flex; padding: 1px 6px; border: 1px solid var(--rule); border-radius: 4px;
    color: var(--ink); cursor: help; transition: background-color 300ms var(--ease), color 300ms var(--ease), border-color 300ms var(--ease);
  }
  .cite:hover, .cite:focus-visible { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .cite .card {
    position: absolute; left: 0; top: calc(100% + 8px); z-index: 10; width: 248px; padding: 12px;
    background: var(--bg); color: var(--ink); border: 1px solid var(--rule); border-radius: 4px; box-shadow: 0 8px 24px var(--shadow);
    font-family: var(--sans); font-size: 14px; line-height: 20px; letter-spacing: 0; text-transform: none; text-align: left; white-space: normal;
    opacity: 0; transform: translateY(-4px); pointer-events: none; transition: opacity 300ms var(--ease), transform 300ms var(--ease);
  }
  .cite:hover .card, .cite:focus-visible .card { opacity: 1; transform: none; }
  /* The tags sit at the right of a pick, so their cards open leftward and never widen the page */
  .pick-from .cite .card { left: auto; right: 0; }
  .cite .card .meta { display: block; margin-top: 8px; }
  .pick-row:has(.cite:hover) :is(.pick-title, .pick-why) { color: var(--ink-3); }
  /* The row a pick came from, or the pick a row leads back to, lights up in the yarn's blue when the reader jumps to it. */
  .lit { animation: lit 2400ms var(--ease) both; border-radius: 4px; }
  @keyframes lit {
    from { background: color-mix(in srgb, var(--yarn) 26%, transparent); box-shadow: 0 0 0 8px color-mix(in srgb, var(--yarn) 26%, transparent); }
    to { background: transparent; box-shadow: 0 0 0 8px transparent; }
  }

  /* Classes and mail */
  .agenda { margin-top: 12px; }
  .agenda li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--rule); }
  .agenda li:first-child { border-top: 0; }
  .agenda .time { font-family: var(--mono); font-size: 14px; line-height: 24px; font-weight: 600; }
  .agenda .when { grid-column: 2; }
  .rows > li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: baseline; padding: 12px 0; border-top: 1px solid var(--rule); }
  .rows > li:first-child { border-top: 0; }
  .rows .r { display: grid; justify-items: end; text-align: right; gap: 2px; }
  .ref { font-family: var(--mono); font-size: 12px; line-height: 16px; color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; white-space: nowrap; transition: color 300ms var(--ease), text-decoration-color 300ms var(--ease); }
  .ref:hover { color: var(--ink); text-decoration-color: currentColor; }
  .more summary { display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; cursor: pointer; list-style: none; transition: color 300ms var(--ease); }
  .more summary::-webkit-details-marker, .behind > summary::-webkit-details-marker { display: none; }
  .more summary:hover { color: var(--ink); }
  .more[open] .rows { margin-top: 8px; }
  .stale-tag { font-weight: 600; color: var(--ink); }
  .tag { display: inline-block; padding: 0 5px; border: 1px solid var(--rule); border-radius: 4px; color: var(--ink); white-space: nowrap; }
  .deal-src { display: block; margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deal-note { max-width: 21ch; text-wrap: balance; }
  .off-line { margin-top: 12px; }
  .chart .close-line { fill: none; stroke: var(--ink); stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  /* Real titles can be long or carry unbroken strings */
  .pick-title, .rows > li > span:first-child, .agenda li > span, .notice { overflow-wrap: anywhere; }
  .rows > li > span:first-child, .rows > li.news > span:nth-child(2) { text-wrap: pretty; }
  .dim-list:has(> li:hover) > li:not(:hover) { opacity: 0.5; }
  .dim-list > li { transition: opacity 300ms var(--ease); }

  /* Lower blocks */
  .rows > li.news { grid-template-columns: 24px minmax(0, 1fr) 88px; gap: 12px; align-items: baseline; }
  .news .n { color: var(--ink-3); }
  .heat { display: grid; justify-items: end; gap: 6px; }
  .bar { display: block; width: 72px; height: 2px; background: var(--rule); }
  .bar i { display: block; height: 2px; background: var(--ink); }
  .colhead { display: grid; grid-template-columns: 64px minmax(0, 1fr) 80px; gap: 12px; margin-top: 16px; padding: 0 48px 8px 0; border-bottom: 1px solid var(--rule); }
  .colhead span:last-child { text-align: right; }
  .holds > li { display: grid; grid-template-columns: minmax(0, 1fr) 40px; gap: 8px; align-items: center; border-bottom: 1px solid var(--rule); }
  .hold { display: grid; grid-template-columns: 64px minmax(0, 1fr) 80px; gap: 2px 12px; align-items: center; padding: 10px 8px; margin: 0 -8px; border-radius: 4px; transition: background-color 300ms var(--ease); }
  .hold:hover { background: var(--hover); }
  .hold .sym { font-family: var(--mono); font-size: 14px; font-weight: 600; }
  .hold[aria-expanded="true"] .sym::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 8px; border-radius: 50%; background: var(--ink); transform: translateY(-2px); }
  .hold .chg { text-align: right; font-family: var(--mono); font-size: 14px; }
  .hold .ext { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 12px; min-width: 0; }
  .hold .ext .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hold .ext .ed { flex: none; }
  .hold .ext .why { min-width: 0; text-align: right; }
  .hold.none .ext .nm { flex: none; max-width: 50%; }
  .hold .ext .broke { color: var(--ink); font-weight: 600; }
  .hold.none:hover { background: none; }
  .holds .ref { justify-self: end; }
  /* The codes past the three biggest moves: chips that open a code's chart, or every row when the reader asks for all. */
  .codes { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; padding-top: 12px; }
  /* positioned, so the screen-reader words inside a chip scroll with it instead of widening the page */
  .chips { position: relative; display: flex; flex-wrap: wrap; gap: 6px; }
  .chips > li { display: flex; align-items: center; gap: 4px; flex: none; }
  .chip { display: inline-flex; gap: 6px; align-items: baseline; padding: 2px 8px; border: 1px solid var(--rule); border-radius: 999px; font-family: var(--mono); font-size: 12px; line-height: 18px; color: var(--ink-2); white-space: nowrap; transition: background-color 300ms var(--ease), color 300ms var(--ease), border-color 300ms var(--ease); }
  .chip b { color: var(--ink); font-weight: 600; }
  .chip .out { color: var(--ink); font-weight: 600; }
  button.chip:hover { border-color: var(--ink-2); color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .chip[aria-pressed="true"] :is(b, .out) { color: var(--bg); }
  .chip.none { border-style: dashed; }
  .all-codes { padding: 2px 8px; border: 1px solid var(--rule); border-radius: 4px; font-family: var(--mono); font-size: 12px; line-height: 18px; color: var(--ink); white-space: nowrap; transition: border-color 300ms var(--ease); }
  .all-codes:hover { border-color: var(--ink-2); }
  .spark { display: block; width: 100%; height: 24px; overflow: visible; }
  .spark polyline { fill: none; stroke: var(--ink-3); stroke-width: 1.25; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .spark.strong polyline { stroke: var(--ink); stroke-width: 1.5; }
  .spark .end { stroke: var(--ink); stroke-width: 5; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .spark .base { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; }
  .chart-box { margin-top: 16px; }
  .chart { display: block; width: 100%; height: auto; }
  .chart .wick { stroke: var(--ink); stroke-width: 1; }
  .chart .up { fill: var(--bg); stroke: var(--ink); stroke-width: 1; }
  .chart .down { fill: var(--ink); stroke: var(--ink); stroke-width: 1; }
  .chart .gl { stroke: var(--rule); stroke-width: 1; }
  .chart .lv { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 4; vector-effect: non-scaling-stroke; }
  .axis { display: flex; justify-content: space-between; margin-top: 4px; }
  .figure-n { font-family: var(--mono); font-size: 20px; line-height: 28px; font-weight: 600; white-space: nowrap; }
  .rows > li.route { grid-template-columns: minmax(0, 1fr) 72px 112px; align-items: center; }
  .countdown { display: flex; align-items: baseline; gap: 8px; margin-top: 12px; }
  .countdown .figure-n { font-size: 30px; line-height: 36px; }
  .foot-note { margin-top: 16px; }

  /* Behind this page */
  .behind { margin-top: 64px; border-top: 1px solid var(--ink); }
  .behind > summary { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding: 16px 0; cursor: pointer; list-style: none; }
  .behind-body { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 48px; padding: 8px 0 24px; }
  .sources { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px; }
  .sources th { text-align: left; font-weight: 400; padding: 0 12px 8px 0; border-bottom: 1px solid var(--rule); }

  .marks { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; z-index: 5; overflow: hidden; pointer-events: none; }

    data.forEach((d, i) => {

  return { svg: `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(h.symbol)}, last ${c.length} daily closes${demo}.">${s}</svg>`, note: "daily closes" + demo };

/* A pick's title with its key words wrapped, so the cat can find them. When the agent gave no key, or one that is

}
function titleHtml(p) {

/* Whether a marked number is good or bad news for the reader, so the cat can play it the right way. */
function moodOf(ref) {
  if (!ref) return "";
  const E = EDITION;
  if (ref.block === "market") { const h = E.market?.holdings.find(x => x.symbol === ref.key); return h ? (h.pct < 0 ? "bad" : "good") : ""; }
  if (ref.block === "travel") { const r = E.travel?.routes.find(x => x.code === ref.key); return r && r.fare < r.low7 ? "good" : ""; }
  if (ref.block === "deals") { const d = E.deals?.rows.find(x => x.item === ref.key); return d && dealGood(d) ? "good" : ""; }

}
const moodAttr = m => m ? ` data-mood="${m}"` : "";
/* Every price is weighed against its 7-day low: the lowest price of the 7 days before today. The target only decides what is watched. */
const hasLow = d => "low7" in d;
const dealGood = d => !d.memberOnly && !d.note && (hasLow(d) ? d.low7 != null && d.price < d.low7 : d.price <= d.target);
/* "7-day low", or "3-day low" while the log is younger than a week. */
const lowName = n => n > 0 && n < 7 ? `${n}-day low` : "7-day low";
const rangeName = r => r.days >= 20 ? "1-month" : `${r.days}-day`;
const rangeSaid = r => `${(Math.round(r.x * 1000) / 10).toFixed(1)}\u00a0% ${r.broke ? (r.edge === "low" ? "under" : "over") : (r.edge === "low" ? "above" : "below")} ${rangeName(r)} ${r.edge}`;

  if (p == null) return ["", ""];

  if (p === d.low7) return [pub, `at ${lowName(d.lowDays)}`];
  return [pub, `${pctOff(p, d.low7)} % ${p < d.low7 ? "under" : "over"} ${lowName(d.lowDays)}`];

/* Featured numbers in the lower blocks are marked too: they are the rows the agent picked. */
const perch = (block, key, mood = "", act = "") => featured(block, key) >= 0 ? toy(block + "-" + key, act, mood) : "";

const toy = (id, act = "", mood = "") => ` data-perch="${esc(id)}"${act ? ` data-act="${act}"` : ""}${moodAttr(mood)}`;

/* What each tool checked, in the reader's words; shown when the reader hovers the tool's tag. The exact call is in the n8n execution log. */
const CHECKED = { lookup_courses: "Checked your timetable", get_price_history: "Checked the price history", search_ai_news: "Searched the AI news" };
/* The five read in three groups: to-dos, things to know, then shopping, which never outranks the rest. */
const groupOf = p => p.ref?.block === "deals" ? 2 : p.kind === "act" ? 0 : 1;
/* Where a pick leads: its row in the block below. */
const ROW = { mail: ["the mail", "h-mail"], courses: ["the class", "h-classes"], ai: ["the story", "h-ai"], market: ["the holding", "h-market"], deals: ["the deal", "h-deals"], travel: ["the fare", "h-trip"] };
const dest = p => p.ref && EDITION[p.ref.block] ? (p.ref.block === "market" && watchOnly() ? ["the symbol", "h-market"] : ROW[p.ref.block]) : null;
/* Brings a row to the middle of the screen and lights it up for a moment. */
function light(row) {
  row.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" });
  row.classList.remove("lit");
  void row.offsetWidth;
  row.classList.add("lit");
}
/* A pick goes straight to the row it came from, opening it if it is folded away. */
function goRow(i) {
  const r = dest(EDITION.picks[i] || {});
  const back = document.querySelector(`[data-open-pick="${i}"]`);
  const fold = back?.closest("details:not([open])");
  if (fold) fold.open = true;
  const row = back?.closest("li") || (r && document.getElementById(r[1])?.closest("section"));
  if (!row) return;
  light(row);
  if (back) back.focus({ preventScroll: true });
}

function more(key, label, inner) {
  return `<details class="more" data-more="${key}"${state.more[key] ? " open" : ""}><summary class="meta">${chev}${esc(label)}</summary>${inner}</details>`;
}

/*
 * Today's order of the blocks under the five, from the edition alone. Four tiers:
 *   needs you  a class still to come or under way today, or mail to act on;
 *   moved      a code out of its 1-month range or past the threshold, a deal or a fare under its 7-day low;
 *   to read    anything else with something in it today;
 *   quiet      no class, no mail to act on, no price, or the source is not connected. Quiet blocks share one strip at the end.
 * Within a tier, the block more of today's picks point to goes first; among moved blocks, then the bigger move in %;
 * then the usual order below. Each block also says in a few words why it sits where it does.
 */
const TIERS = ["needs you", "moved", "to read", "quiet"], TIER_CLASS = ["need", "moved", "", "quiet"];
const BLOCKS = [
  { key: "courses", sec: "sec-classes", head: "h-classes", src: ["zeus"] },
  { key: "mail", sec: "sec-mail", head: "h-mail", src: ["gmail"] },
  { key: "ai", sec: "sec-ai", head: "h-ai", src: ["aihot"] },
  { key: "market", sec: "sec-market", head: "h-market", src: ["market"] },
  { key: "deals", sec: "sec-deals", head: "h-deals", src: ["deals"] },
  { key: "travel", sec: "sec-trip", head: "h-trip", src: ["travel"] }
];
/* A fare with one day of prices has no week to compare with. */
const seenFare = r => !!(r.series && r.series.length > 1 && r.low7 > 0);
/* [tier, size of the move in % (moved only), what the block holds today] */
function weigh(key) {
  const E = EDITION, D = E[key];
  if (!D) return [3, 0, "not connected"];
  if (key === "courses") {
    const at = minutes(E.builtAt.slice(0, 5)), list = D.today || [];
    if (!list.length) return [3, 0, "no class today"];
    const next = list.find(c => minutes(c.time.slice(0, 5)) > at), on = list.find(c => minutes(c.time.slice(0, 5)) <= at && minutes(c.time.slice(-5)) > at);
    if (next) return [0, 0, `next ${esc(next.time.slice(0, 5))}, ${esc(until(next.time.slice(0, 5)))}`];
    if (on) return [0, 0, `in class until ${esc(on.time.slice(-5))}`];
    return [2, 0, `${list.length} ${list.length === 1 ? "class" : "classes"} today, all over`];
  }
  if (key === "mail") return [D.act.length ? 0 : 3, 0, `${D.act.length} ${D.act.length === 1 ? "needs" : "need"} you · ${D.later.length} can wait`];
  if (key === "ai") {
    const w = D.watch || [], fresh = w.filter(a => a.isNew).length;
    return w.length ? [2, 0, `${w.length} ${w.length === 1 ? "story matches" : "stories match"}${fresh ? ` · ${fresh} new` : ""}`] : [3, 0, "nothing on your watchlist"];
  }
  if (key === "market") {
    const th = D.threshold ?? 3, hs = byMove(D.holdings);
    if (!hs.length) return [3, 0, "no prices today"];
    const out = hs.map(rangeOf).filter(r => r?.broke), big = hs.filter(h => Math.abs(h.pct) >= th), lead = `${esc(hs[0].symbol)} ${chg(hs[0].pct)}`;
    if (!out.length && !big.length) return [2, 0, `all inside their range · ${lead}`];
    return [1, Math.max(0, ...out.map(r => r.x * 100), ...big.map(h => Math.abs(h.pct) - th)), `${out.length ? `${out.length} left their ${rangeName(out[0])} range` : `${big.length} moved over ${th} %`} · ${lead}`];
  }

    const good = D.rows.filter(dealGood), off = d => (1 - d.price / (hasLow(d) ? d.low7 : d.target)) * 100;
    if (good.length) return [1, Math.max(...good.map(off)), `${good.length} under ${hasLow(good[0]) ? lowName(good[0].lowDays) : "target"}`];
    return [2, 0, D.daysToBlackFriday != null ? `${esc(D.daysToBlackFriday)} days to black friday` : `${D.rows.length} ${D.rows.length === 1 ? "price" : "prices"}, none under the low`];
  }

  const best = known[0], said = best ? `${esc(best.city)} ${esc(eur0(best.fare))} · ${chg((best.fare / best.low7 - 1) * 100)}` : `${rs.length} fares, no 7-day low yet`;
  return best && best.fare < best.low7 ? [1, (1 - best.fare / best.low7) * 100, said] : [2, 0, said];
}
function order() {
  const name = { courses: "Classes", mail: "Mail", ai: "AI and tech", market: watchOnly() ? "Watchlist" : "Portfolio", deals: "Deals", travel: "Christmas trip" };
  return BLOCKS.map((b, i) => {
    const [tier, size, status] = weigh(b.key);
    return { ...b, i, tier, size, name: name[b.key], picks: EDITION.picks.filter(p => p.ref?.block === b.key).length, status: status + (b.src.some(stale) ? " · cached" : "") };
  }).sort((a, b) => a.tier - b.tier || b.picks - a.picks || (a.tier === 1 ? b.size - a.size : 0) || a.i - b.i);
}

function render() {
  const E = EDITION;
  citeId = 0;
  const connected = state.sources.filter(s => s.status !== "off");
  const staleOnes = connected.filter(s => s.status === "stale");
  const okCount = connected.length - staleOnes.length;
  rankOf = [];
  E.picks.map((p, i) => i).sort((a, b) => groupOf(E.picks[a]) - groupOf(E.picks[b]) || a - b).forEach((i, n) => { rankOf[i] = n + 1; });
  const builtAt = String(lastBuild()?.time || E.builtAt).slice(0, 5);
  const statusText = state.busy ? "rebuilding…" : `${okCount}/${connected.length} sources ok · ${builtAt}`;

  document.getElementById("mast-right").innerHTML = `
      <span>${esc(E.weekday.slice(0, 3))} ${esc(E.day)} ${esc(E.monthYear)}</span>
      <button class="status${staleOnes.length ? " bad" : ""}" type="button" data-jump="behind"><span class="dot" aria-hidden="true"></span>${esc(statusText)}</button>`;

  /* An older edition when today's is not built yet, one notice per stale source, and a failed rebuild request. */
  document.getElementById("notice").innerHTML = (state.renewing ? `<p class="notice" role="status"><b>Loading today's edition.</b> If the 08:00 run was missed, n8n builds it first, which takes up to a minute.</p>`
    : E.staleEdition ? `<p class="notice" role="status"><b>This is the edition of ${esc(E.weekday)} ${esc(E.day)} ${esc(E.monthYear)}.</b> Today's edition is not built yet; it appears after the next run.</p>` : "")
    + staleOnes.map(s =>
      `<p class="notice" role="status"><b>⚠ ${esc(s.short)} failed twice${s.code ? ` (${esc(s.code)})` : ""}.</b> ${esc(s.note || "The last cached data is shown.")}</p>`).join("")
    + (state.error ? `<p class="notice" role="status"><b>⚠ ${esc(state.error)}</b></p>` : "");

  /* Today's five */
  const pick = (p, i) => {
    /* The title and the line under it say what to do and why. Selecting the pick goes to the row it came from. */
    const found = String(p.result ?? "").trim(), r = dest(p);
    const checked = p.tool && found && found !== "—" ? `${CHECKED[p.tool] || `Checked with ${p.tool}`}: ${found}` : "Tool the agent called";
    const head = `<span class="sr">${rankOf[i]}. </span><span class="tt">${titleHtml(p)}</span>`;
    return `<li class="${p.kind}">
      <div class="pick-row${r ? "" : " flat"}" data-pick="${i}">
        <span class="rank" aria-hidden="true"${moodAttr(moodOf(p.ref))}>${rankOf[i]}</span>
        <div>
          ${r ? `<button class="pick-title" type="button">${head}<span class="sr">, go to ${r[0]}</span></button>` : `<span class="pick-title">${head}</span>`}
          <div class="pick-meta">
            <p class="pick-why">${esc(nb(p.decision))}</p>
            <p class="pick-from meta">${p.from.map(cite).join("")}<span aria-hidden="true">→</span>${p.tool ? `<span class="tool" title="${esc(checked)}">${esc(p.tool)}</span>` : `<span>no tool</span>`}</p>
          </div>
        </div>
        ${r ? chev : ""}
      </div></li>`;
  };

  const group = (n, label) => {
    const items = indexed.filter(([p]) => groupOf(p) === n);
    return items.length ? `<h3 class="group meta">${label} · ${items.length}</h3><ol class="picks">${items.map(([p, i]) => pick(p, i)).join("")}</ol>` : "";
  };

  /* "new" marks a mail the last run had not seen, but only in a list that also has older mail; when every mail is new it says nothing. */
  const mixed = list => list.some(m => m.isNew) && list.some(m => !m.isNew);
  const codesHidden = Number(E.mail?.codesHidden) || 0;
  const mailRow = (m, act, tagNew) => `<li>
      <span${zh(m.subject)}>${esc(m.subject)}${tagNew && m.isNew ? ` <span class="tag meta">new</span>` : ""}<br><span class="meta">${esc(m.from)}</span></span>
      <span class="r">${m.deadline ? `<span class="meta${act ? " accent" : ""}"${act ? ` style="font-weight:600"` : ""}>due ${esc(m.deadline)}</span>` : ""}${refLink(featured("mail", m.subject))}</span>
    </li>`;

  /* Today's order of the blocks. A block on the board gets its tier and place on top of the card; a quiet one
     gets one line in the strip at the end. */

  const fill = (key, inner) => {
    const b = B[key], h = `<h2 class="title" id="${b.head}">${esc(b.name)}</h2>`;
    document.getElementById(b.sec).innerHTML = (b.tier === 3 ? `<div class="head">${h}${meta(b.src)}</div>`
      : `<div class="blk-top"><span class="tier ${TIER_CLASS[b.tier]}">${b.n} · ${TIERS[b.tier]}</span>${meta(b.src)}</div>${h}`) + inner;
  };

  document.getElementById("zone1").innerHTML = `
    <section class="five" id="five" aria-labelledby="h-five" tabindex="-1">
      <div class="head"><h2 class="title" id="h-five">${E.picks.length === 1 ? "Today's pick" : E.picks.length ? `Today's ${word(E.picks.length)}` : "Today's picks"}</h2><span class="meta">picked by the editor agent from ${connected.length} sources</span></div>
      ${E.picks.length ? "" : `<p class="lede">Nothing new is worth your attention today.<span class="cursor" aria-hidden="true"></span></p>`}
      ${group(0, "to do")}
      ${group(1, "to know")}
      ${group(2, "shopping")}
    </section>
    <nav class="glance" aria-labelledby="h-glance">
      <h2 class="meta" id="h-glance">today, in order</h2>
      <ol>${plan.map(b => `<li${b.tier === 3 ? ` class="q"` : ""}><span class="tier ${TIER_CLASS[b.tier]}">${TIERS[b.tier]}</span><button class="go" type="button" data-goto="${b.sec}">${esc(b.name)}</button><span class="st meta">${b.status}</span></li>`).join("")}</ol>
    </nav>`;

  const C = E.courses, classes = C?.today || [];
  const nextAt = classes.findIndex(x => until(x.time.slice(0, 5)) !== "started");
  const nextLine = C?.next ? `<p class="meta foot-note">next · ${esc(C.next)}</p>` : "";
  fill("courses", !C ? offLine("zeus") : !classes.length ? `<p class="verdict">No class today.</p>${nextLine}`
    : `<p class="verdict">${classes.length} ${classes.length === 1 ? "class" : "classes"} today${nextAt >= 0 ? `; the next starts at ${esc(classes[nextAt].time.slice(0, 5))}` : ", all started"}.</p>
    <ul class="agenda">${classes.map((c, i) => `<li><span class="time"${i === nextAt ? toy("zeus-next", "flip") : ""}>${esc(c.time.slice(0, 5))}</span><span>${esc(c.title)}<br><span class="meta">${c.where ? esc(c.where) + " · " : ""}until ${esc(c.time.slice(-5))}</span></span><span class="meta when">${esc(until(c.time.slice(0, 5)))}</span></li>`).join("")}</ul>
    ${nextLine}`);

  /* Mail */
  fill("mail", !E.mail ? offLine("gmail") : `<p class="verdict"><span class="num"${toy("mail-act", "hop", E.mail.act.length ? "" : "good")}>${E.mail.act.length}</span> ${E.mail.act.length === 1 ? "needs" : "need"} you · <span class="num">${E.mail.later.length}</span> can wait${E.mail.hidden ? ` · <span class="num">${E.mail.hidden}</span>&nbsp;${E.mail.hidden === 1 ? "newsletter" : "newsletters"} hidden` : ""}${codesHidden > 0 ? ` · <span class="num">${codesHidden}</span>&nbsp;verification ${codesHidden === 1 ? "code" : "codes"} hidden` : ""}</p>
    ${E.mail.act.length ? `<ul class="rows dim-list" style="margin-top:4px">${E.mail.act.map(m => mailRow(m, true, mixed(E.mail.act))).join("")}</ul>` : ""}
    ${E.mail.later.length ? more("mail", `${E.mail.later.length} to read later`, `<ul class="rows">${E.mail.later.map(m => mailRow(m, false, mixed(E.mail.later))).join("")}</ul>`) : ""}`);

  /* AI and tech. AIHOT has two lists whose heat means different things: on the hot list it is how many people
     take part, on the 24 hour list it is the editors' score. When every item says its list, each list gets its

  const heatOf = a => Number(a.heat) || 0;
  const topHeat = list => Math.max(0, ...list.map(heatOf)) || 1;
  const news = (a, i, max, unit) => `<li class="news">
      <span class="meta n">${String(i + 1).padStart(2, "0")}</span>

      <span class="heat"><span class="meta"${unit === "score" ? ` title="AIHOT editors' score"` : unit ? ` title="AIHOT heat: people taking part"` : ""}${featuredAi(a) >= 0 ? toy("ai-" + a.url, "bar") : ""}>${esc(a.heat)} ${unit || "heat"}</span><span class="bar" aria-hidden="true"><i style="width:${Math.round(heatOf(a) / max * 100)}%"></i></span></span>
    </li>`;

  const newsRows = (items, key, moreLabel, unit) => {

/*
 * The koi pond. Decoration only: it carries no information.
 *
 * Each koi is a chain of spine nodes that trails its head, plus a travelling
 * body wave. Every character cell is sampled against the nearest point on the
 * spine (with sub-samples for soft edges), classified as body, fin, eye or
 * barbel, coloured by the fish's markings, and shaded by a light from the
 * upper left: light skin gets sparse glyphs, shadowed skin dense ones. Koi cast
 * a shadow on the pond floor and leave a short wake.
 *
 * Technique informed by stackedlol/ascii-sharks (MIT) and daoho.dev; the code
 * here is written for this page.
 *
 * The canvas is fixed and full screen. A clip rectangle shrinks from the whole
 * screen to the pond slot during the opening and then follows the slot. Koi
 * heads live in coordinates relative to that rectangle, so the shoal gathers
 * into the band as it shrinks.
 */
const POND_SLOT = "slot";
const Pond = (() => {
  const stage = document.getElementById("stage");
  const canvas = document.getElementById("pond");
  const intro = document.getElementById("intro");
  const introBox = document.getElementById("intro-box");
  const runway = document.getElementById("runway");
  const pauseBtn = document.getElementById("pause");
  const ctx = canvas.getContext("2d");
  const N = 10;
  const RAMP = " .:-=+*#%@";
  const SUB = [0.25, 0.25, 0.75, 0.25, 0.25, 0.75, 0.75, 0.75];
  let vw = 0, vh = 0, dpr = 1, cw = 10, ch = 13, cols = 0, rows = 0, cw0 = 10, ch0 = 13, kOpen = 1.85;
  let t = 0, last = 0, paused = false, drawnAt = 0, prevKey = "", lastE = 0;
  let P = null;
  let tileRGB, tileA, glyphRGB, glyphA, glyphCode, shade, wake, wakeTmp;
  const touched = [];

  /* ── small maths ── */
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const sstep = (a, b, x) => { const k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
  const lerp = (a, b, e) => a + (b - a) * e;
  const h2 = (a, b) => { let x = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul(b | 0, 0x165667b1); x = Math.imul(x ^ (x >>> 15), 0x85ebca6b); x ^= x >>> 13; x = Math.imul(x, 0xc2b2ae35); return ((x ^ (x >>> 16)) >>> 0) / 4294967296; };
  const noise = (x, y, seed) => {
    const xi = Math.floor(x), yi = Math.floor(y), u = sstep(0, 1, x - xi), v = sstep(0, 1, y - yi);
    const a = h2(xi + seed * 131, yi), b = h2(xi + 1 + seed * 131, yi), c = h2(xi + seed * 131, yi + 1), d = h2(xi + 1 + seed * 131, yi + 1);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  };
  const rgb = hex => { const m = hex.trim().match(/^#?([0-9a-f]{6})$/i); const n = m ? parseInt(m[1], 16) : 0; return [n >> 16, (n >> 8) & 255, n & 255]; };
  const mixC = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
  const mul = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
  const pack = c => (clamp(c[0] | 0, 0, 255) << 16) | (clamp(c[1] | 0, 0, 255) << 8) | clamp(c[2] | 0, 0, 255);
  const css = n => `rgb(${n >> 16},${(n >> 8) & 255},${n & 255})`;

  /* ── koi body, as fractions of length: s runs from snout (0) to tail tip (1) ── */
  const BODY_END = 0.76;
  const halfW = s => s < 0.1 ? 0.118 * Math.pow(Math.sin(s / 0.1 * Math.PI / 2), 0.6)
    : s < 0.3 ? 0.118 + 0.02 * sstep(0.1, 0.3, s)
    : 0.03 + 0.108 * (1 - sstep(0.3, BODY_END, s));
  const tailW = s => 0.028 + 0.165 * Math.pow(sstep(0.72, 1, s), 0.85);
  const hit = { kind: 0, across: 0, rs: 1, ra: 0 };
  /* fin: an ellipse leaning back from a root on the body's edge */
  function fin(s, a, rootS, angle, reach, width) {
    const ra = halfW(rootS) * 0.85, ca = Math.cos(angle), sa = Math.sin(angle);
    const ds = s - rootS, da = a - ra;
    const along = ds * ca + da * sa - reach, perp = -ds * sa + da * ca;
    if ((along / reach) ** 2 + (perp / width) ** 2 > 1) return false;
    hit.kind = 2; hit.rs = ds; hit.ra = da;
    return true;
  }
  /* 1 body, 2 fin, 3 eye, 4 ridge, 5 barbel */
  function classify(s, a, past, flare, ahead, lateral) {
    hit.kind = 0; hit.across = 1; hit.rs = 1; hit.ra = 0;
    if (ahead > 0) {
      if (ahead < 0.05 && Math.abs(lateral - (0.042 + ahead * 0.75)) < 0.015) { hit.kind = 5; return true; }
      return false;
    }
    const w = halfW(s);
    if (s <= BODY_END && a <= w) {
      hit.across = a / w;
      hit.kind = s > 0.056 && s < 0.084 && hit.across > 0.5 && hit.across < 0.78 ? 3 : s > 0.3 && s < 0.6 && hit.across < 0.13 ? 4 : 1;
      return true;
    }
    if (s > 0.7 && past <= 0) {
      const tw = tailW(s) * flare;
      if (a <= tw && s <= 0.88 + 0.12 * (a / tw)) { hit.kind = 2; hit.rs = 1; hit.ra = (a / tw) * 0.8; return true; }
    }
    return fin(s, a, 0.2, 0.9 + 0.45 * (flare - 1), 0.07 * flare, 0.038) || fin(s, a, 0.47, 0.75, 0.038, 0.019);
  }

  /* ── markings: kohaku (red saddles), sanke (plus black spots), tancho (red crown) ── */

/*
 * "One Page", drawn in character cells like the koi. The letters are sampled
 * from the real font outline (descenders included), then each cell gets a
 * glyph by how much of it the letter covers. On first sight the cells flicker
 * through random glyphs and settle into the word; afterwards a thin red glint

const Marks = (() => {

    text: "One Page", font: `700 ${narrow() ? 110 : 170}px "Noto Serif Display"`,
    cw: narrow() ? 4 : 7, ch: narrow() ? 5 : 9, maxW: Math.min(window.innerWidth * (narrow() ? 0.9 : 0.8), 700)
  }));
  /* "is all you need", drawn the same way as the title, smaller and a little fainter */
  const tag = AsciiMark(document.getElementById("wordmark-tag"), () => ({
    text: "is all you need", font: `700 ${narrow() ? 64 : 84}px "Noto Serif Display"`,
    cw: narrow() ? 3 : 4, ch: narrow() ? 4 : 5, maxW: Math.min(window.innerWidth * (narrow() ? 0.66 : 0.42), 420), tone: 0.88
  }));
  /* The masthead: fine cells, glyphs that fill them and a backing tile, so it reads at its small size. */
  const mast = AsciiMark(document.getElementById("mast-mark"), () => ({
    text: "One Page", font: `700 110px "Noto Serif Display"`, cw: 3, ch: 3.8, maxW: 250, crisp: true

  let mastShown = false, last = 0;
  function frame(now) {

  return {
    async start() {
      await build();
      intro.restart(); tag.restart();
      if (reduce) { drawAll(0); return; }

    }

})();

      const only = fiveMid(), other = targets.filter(x => x !== tg && x.type === "play" && seen(x) && (!only || x.five) && now - (played.get(x.id) ?? -1e9) > 20000);
      if (other.length && r < 0.35) await go(other[Math.floor(Math.random() * other.length)]);
      else if (tg && tg.type === "play" && r < 0.5 && now - (played.get(tg.id) ?? 0) > 8000) { played.set(tg.id, now); await play(tg); }
      else if (r < 0.55) await stroll();
      else if (r < 0.62) { for (let i = 0; i < 2; i++) { st.ears = 0.45; await wait(130); st.ears = 0; await wait(170); } }
      else if (r < 0.69) { st.tilt = -0.14 * st.dir; st.look = { x: pos.x - 160 * st.dir, y: pos.y - 120 }; await wait(800); st.look = { x: pos.x + 160 * st.dir, y: pos.y - 40 }; await wait(700); }
      else if (st.pose !== "sit") { st.eye = "blink"; tailSpeed = 6; await wait(900); }
      else if (r < 0.77) await slowBlink();
      else if (r < 0.85) await wash();
      else if (r < 0.92) await yawn();
      else await knead();
    } catch (e) {
      /* see go() */
    } finally {
      st.look = null; st.tilt = 0; st.eye = "open"; st.ears = 0; tailSpeed = 2.2;
      st.lid = 0; st.knead = false; st.yawnAt = null; if (st.arm === "lick" || st.arm === "wash") st.arm = null;
      busy = false;
      idleAt = performance.now() + 3500 + Math.random() * 4500;
    }
  }
  /*
   * Small things a contented cat does while the reader stays put. Each keeps inside the cat's own outline,
   * and each stops at once when the reader moves on to another line.
   */
  async function calm(ms) {
    const end = performance.now() + ms, from = current;
    while (performance.now() < end) {
      await wait(Math.min(120, end - performance.now()));
      const a = active();
      if (wish || bank || (a && from && a.id !== from.id)) throw new Error("moved on");
    }
  }
  /* The slow blink cats give someone they trust: the lids come halfway down, close, and open again. */
  async function slowBlink() {
    st.tilt = -0.08 * st.dir;
    st.lid = 0.25; await calm(150);
    st.lid = 0.5; await calm(550);
    st.lid = 0; st.eye = "blink"; await calm(520);
    st.eye = "open"; st.lid = 0.5; await calm(260);
    st.lid = 0.25; await calm(140);
  }
  /* A wash: a few licks of the paw, two wipes over the cheek, a last lick. */
  async function wash() {
    st.eye = "happy"; st.tilt = -0.1;
    st.arm = "lick"; await calm(800);
    st.arm = "wash"; st.washAt = t; await calm(2860);
    st.arm = "lick"; await calm(360);
  }
  /* A big yawn, ears a little back. */
  async function yawn() {
    st.yawnAt = t; st.ears = 0.3; st.eye = "happy";
    await calm(1700);
  }
  /* Kneading the floor with half-shut eyes and a slow tail. */
  async function knead() {
    st.knead = true; st.lid = 0.45; tailSpeed = 1.2;
    await calm(2700);
  }
  async function stroll() {
    const T = aim(current);
    if (!T || !pos) return;
    const { list, obs } = spots(T, { left: pos.x - 160, right: pos.x + 160, top: pos.y - 80, bottom: pos.y + 4 });
    const clear = to => { for (let x = Math.min(pos.x, to.x); x <= Math.max(pos.x, to.x); x += 8) { const R = box(x, to.y, to.s, to.dir); if (obs.some(o => hit(o, R))) return false; } return true; };
    const opts = list.filter(c => c.y === pos.y && c.s === pos.s && Math.abs(c.x - pos.x) >= 36 && Math.abs(c.x - pos.x) <= 150 && c.score < list[0].score + 90 && clear(c));
    if (!opts.length) { tailSpeed = 6; await wait(900); return; }
    await travel(opts[Math.floor(Math.random() * opts.length)]);
  }

  /*
   * At the pond's edge. Once the pond has settled into its band, a click on the water also calls the cat: it
   * jumps to the band's bottom edge near the spot and sits there. When the paw dips into the water, the cat
   * scoops along with it: its paw comes up and presses down, and its head dips. The two need not meet; the
   * paw in the pond is drawn as before. After eight quiet seconds, or when the reader scrolls on, the cat goes
   * back to its usual places.
   */
  /* Where the cat sits under the band's edge, just beside x on the side it faces from. */
  function bankSpot(X, dir) {
    const z = Pond.band(), s = bank.s;
    if (!z) return null;
    lrect();
    const lo = z.left - LR.left + 30 * s, hi = z.right - LR.left - 30 * s;
    return { x: Math.min(hi, Math.max(lo, X - dir * 24 * s)), y: z.bottom - LR.top + 66 * s, s, dir };
  }
  /* To the edge: a pounce from where it sat if that is on screen, a trot along the edge once it is there, or a short fall into view. */
  async function toBank(b, X) {
    lrect();
    const seen = !!pos && !hidden && pos.y + LR.top > 0 && pos.y + LR.top - 74 * pos.s < window.innerHeight;
    const to = bankSpot(X, seen && X < pos.x ? -1 : 1);
    if (!to) throw new Error("no band");
    st.look = null; st.arm = null; st.eye = "open"; st.lid = 0; st.knead = false; st.yawnAt = null; st.tilt = 0; st.ears = 0;
    const from = pos, dx = seen ? to.x - from.x : 0, dy = seen ? to.y - from.y : 0, d = Math.hypot(dx, dy);
    pos = to; hidden = false;
    cv.style.transform = tf(to);
    if (seen && b.on && Math.abs(dy) < 2) {
      st.pose = "walk"; st.dir = Math.sign(dx) || to.dir;
      await cv.animate([{ transform: tf(from) }, { transform: tf(to) }], { duration: Math.min(800, Math.max(160, Math.abs(dx) / 0.35)), easing: "linear" }).finished;
    } else if (seen) {
      st.pose = "jump"; st.dir = Math.sign(dx) || to.dir;
      const lift = Math.min(80, 24 + d * 0.12), frames = [];
      for (let i = 0; i <= 12; i++) {
        const k = i / 12;
        frames.push({ transform: tf({ x: from.x + dx * k, y: from.y + dy * k - 4 * lift * k * (1 - k), s: from.s + (to.s - from.s) * k }, { r: st.dir * (-16 + 30 * k) }) });
      }
      await cv.animate(frames, { duration: Math.min(720, 320 + d * 0.45), easing: "linear" }).finished;
    }
    st.pose = "sit"; st.dir = to.dir; b.on = true;
    await cv.animate([
      { transform: tf({ ...to, y: to.y - (seen ? 0 : 20) }), opacity: seen ? 1 : 0 },
      { transform: tf(to, { sx: 1.08, sy: 0.88 }), opacity: 1, offset: 0.5 },
      { transform: tf(to), opacity: 1 }
    ], { duration: seen ? 220 : 340, easing: "ease-out" }).finished;
  }
  /* One scoop: the paw comes up while the paw in the pond shoots in, and presses down as it dips (0.24 s after the click), the head dipping with it. */
  async function scoop(b, X, Y, at) {
    st.dir = X >= pos.x ? 1 : -1;
    st.look = { x: X, y: Y };
    st.arm = "up";
    await wait(Math.max(90, at + 240 - performance.now()));
    if (bank !== b) return;
    st.arm = "down"; st.tilt = 0.16 * st.dir;
    cv.animate([{ transform: tf(pos) }, { transform: tf({ ...pos, y: pos.y + 2 }, { sx: 1.05, sy: 0.92, r: st.dir * 5 }), offset: 0.3 }, { transform: tf(pos) }], { duration: 520, easing: "ease-out" });
    await wait(420);
    if (bank !== b) return;
    st.arm = null; st.tilt = 0;
    await wait(200);
    if (bank === b) st.look = null;
  }
  /* The clicks, one at a time; only the latest waiting click counts. A scoop only while its paw is still in the water. */
  async function pump(b) {
    if (b.busy) return;
    b.busy = true;
    try {
      while (b.next && bank === b) {
        const { X, Y, at } = b.next;
        b.next = null;
        if (!b.on || Math.abs(X - pos.x) > 110) await toBank(b, X);
        if (bank !== b) break;
        if (performance.now() - at < 650) await scoop(b, X, Y, at);
        b.last = performance.now();
      }
    } catch (e) {
      /* it was called away on the way */
    } finally {
      b.busy = false;
    }
  }
  /* Back to the usual places: the next frame finds the spot under the band taken and moves on. */
  function leave() {
    bank = null;
    cv.getAnimations().forEach(a => a.cancel());
    st.pose = "sit"; st.look = null; st.arm = null; st.tilt = 0;
    stay = null; checkAt = 0; idleAt = performance.now() + 2500;
  }

  /* Puts the layer across the whole window width, so the margins beside the page are room to sit too. */
  function fit() {
    const pr = page.getBoundingClientRect();
    layer.style.left = -Math.round(pr.left) + "px";
    layer.style.width = document.documentElement.clientWidth + "px";
  }
  function refresh() {
    if (pixelRatio() !== dpr) { dpr = pixelRatio(); cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); drawnAt = 0; }
    fit();
    targets = collect();
    for (const [id] of threads) {
      const tg = targets.find(x => x.id === id);
      if (tg) placeThreads(id, tg.line || tg.el); else { threads.get(id).forEach(n => n.remove()); threads.delete(id); }
    }
    if (current) current = targets.find(x => x.id === current.id) || null;
    checkAt = 0;
  }

  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.1, (now - last) / 1000 || 0);
    last = now;
    const landed = Pond.progress() > 0.98;
    cv.classList.toggle("on", landed && !!pos && !hidden);
    if (!landed) return;
    if (!reduce) {
      t += dt;
      if (t > nextBlink) { blinkUntil = t + 0.14; nextBlink = t + 2.2 + Math.random() * 3.5; }
      /* A fast scroll makes the eyes go wide. */
      const y = window.scrollY;
      if (dt && Math.abs(y - lastY) / dt > 2400) wideUntil = t + 0.5;
      lastY = y;
    }
    if (bank) {
      /* At the edge it stays while the band is on screen and the reader keeps fishing. */
      const z = Pond.band();
      if (!z || z.bottom < 40 || window.innerWidth !== bank.w || Math.abs(window.scrollY - bank.y0) > 80 || (!bank.busy && now - bank.last > 8000)) leave();
    } else if (!busy && wish) {
      const w = targets.find(x => x.id === wish.id);
      wish = null;
      if (w) { stay = window.scrollY; go(w, true); }
    } else if (!busy) {
      const a = active();
      if (stay !== null && Math.abs(window.scrollY - stay) > 80) stay = null;
      if (a && (!current || a.id !== current.id) && stay === null) { if (settled(a)) go(a); }
      else if (current && now > checkAt) {
        checkAt = now + 700;
        if (hidden || !free()) go(current);
        else if (!reduce && now > idleAt) idle();
      }
    }
    if (now - drawnAt > 70) { drawnAt = now; draw(); }
    /* A thread turns for a few seconds after it is laid, then fades away so it does not pull at the eye while reading.
       With reduced motion it stays still until it goes. */
    if (now - threadAt > 80) {
      threadAt = now;
      const vh = window.innerHeight;
      for (const [id, ns] of threads) {
        const left = LIFE - (now - laid.get(id));
        if (left <= 0) { ns.forEach(n => n.remove()); threads.delete(id); continue; }
        for (const n of ns) {
          n.style.opacity = reduce ? 1 : Math.min(1, left / FADE);
          const r = n.getBoundingClientRect();
          if (!reduce && r.bottom > 0 && r.top < vh) drawThread(n, now);
        }
      }
    }
  }

  return {
    /* A paw went into the pond in its band: the cat comes to the edge and scoops along. */
    scoop(cx, cy) {
      if (reduce || !Pond.band()) return;
      lrect();
      const now = performance.now();
      if (!bank) {
        /* Whatever the cat was doing stops here: its moves fail, and go() or idle() winds down. A little smaller on a phone, as elsewhere. */
        bank = { on: false, s: window.innerWidth < 720 ? SCALES[1] : SCALES[0], y0: window.scrollY, w: window.innerWidth, last: now, next: null, busy: false };
        cv.getAnimations().forEach(a => a.cancel());
        ball.getAnimations().forEach(a => a.cancel());
      }
      bank.next = { X: cx - LR.left, Y: cy - LR.top, at: now };
      bank.last = now;
      pump(bank);
    },
    /* The threads are drawn, not styled, so a new theme draws them again in its colour. */
    recolor() { for (const ns of threads.values()) for (const n of ns) drawThread(n, performance.now()); },
    start() {
      cv.style.width = W + "px"; cv.style.height = H + "px";
      window.addEventListener("pointermove", e => { pointer = { x: e.clientX, y: e.clientY }; pointerAt = performance.now(); }, { passive: true });
      /* A mouse moving onto a pick, or the keyboard landing on one, asks the cat over. A touch only opens the pick. */
      const ask = e => {
        const row = e.target.closest?.("#zone1 [data-pick]");
        if (e.type === "pointerover") { if (row === overRow || e.pointerType !== "mouse") return; overRow = row; }
        else if (!e.target.matches?.(":focus-visible")) return;
        const tg = row && targets.find(x => x.id === "pick-" + row.dataset.pick);
        if (tg && !threads.has(tg.id)) wish = tg;
      };
      document.addEventListener("pointerover", ask);
      document.addEventListener("focusin", ask);
      afterRender.push(refresh);
      window.addEventListener("resize", refresh);
      refresh();
      document.fonts?.ready.then(refresh);
      requestAnimationFrame(frame);
    }
  };
})();

/* Lower blocks rise into place once. */
if (!reduce && "IntersectionObserver" in window) {
  const io = new IntersectionObserver(entries => entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { threshold: 0.12 });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));
} else {
  document.querySelectorAll(".reveal").forEach(el => el.classList.add("in"));
}

const now = () => new Date().toLocaleTimeString("en-GB", { hour12: false, timeZone: "Europe/Paris" });
const pause = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));

/* Live: ask n8n to rebuild today's edition, then load the new page. Demo: play the run in the page. */
async function rebuild() {
  if (state.busy) return;
  state.busy = true;
  state.behind = true;
  state.error = null;
  if (live) {
    render();
    try {
      let r;
      try { r = await fetch("/webhook/rebuild", { method: "POST" }); }
      catch (net) {
        /* The request could not be sent from this sandboxed page: post a plain form instead; n8n answers with a redirect to today's page. */
        const f = Object.assign(document.createElement("form"), { method: "post", action: "/webhook/rebuild" });
        document.body.appendChild(f);
        f.submit();
        return;
      }
      if (r.status === 429) throw new Error("the last rebuild was less than 10 minutes ago");
      if (r.status === 502) throw new Error("the editor agent failed");
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      location.assign("/webhook/today");
    } catch (e) {
      state.busy = false;
      state.error = `Rebuild not started: ${e.message}. Today's edition is unchanged.`;
      state.log.push({ t: now(), msg: `Rebuild request failed (${e.message})`, bad: true });
      render();
    }
    return;
  }
  const fail = FAILURES[state.failure];
  const say = async (msg, bad = false, ms = 240) => { state.log.push({ t: now(), msg, bad }); render(); await pause(ms); };
  await say("Rebuild requested from this page");
  const on = state.sources.filter(s => s.status !== "off");
  for (const s of on) {
    if (fail && fail.source === s.key) {
      await say(`${s.short}: ${fail.code}, retrying once`, true, 420);
      await say(`${s.short}: ${fail.code} again, cache used`, true);
    } else {
      await say(`${s.short}: OK`, false, 150);
    }
  }
  await say(`Diff vs v${state.version}: 0 new items`);
  await say(`Editor agent: ${EDITION.picks.length} picks, ${EDITION.picks.filter(p => p.tool).length} tool calls`, false, 400);
  const v = state.version + 1, t = now();
  state.log.push({ t, msg: `Edition ${EDITION.date} replaced: v${state.version} to v${v}, still 1 row` });
  for (const s of on) {
    if (fail && fail.source === s.key) Object.assign(s, { status: "stale", code: fail.code, note: fail.note, cachedAt: s.cachedAt || `${EDITION.date}T${EDITION.builtAt}` });
    else Object.assign(s, { status: "ok", code: null, note: null, cachedAt: null, fetched: t });
  }
  state.version = v;
  state.history.push({ v, time: t, how: fail ? `a rebuild; ${src(fail.source).short} failed, so its cache was used` : "a manual rebuild" });
  state.busy = false;
  render();
}

/* From a row below back up to its pick. */
function openPick(i) {
  const row = document.querySelector(`[data-pick="${i}"]`);
  if (!row) return;
  light(row);
  row.querySelector("button.pick-title")?.focus({ preventScroll: true });
}

document.addEventListener("click", e => {
  if (e.target.closest(".cite")) return;
  const ref = e.target.closest("[data-open-pick]");
  if (ref) { openPick(Number(ref.dataset.openPick)); return; }
  const pick = e.target.closest("[data-pick]");
  if (pick) {
    if (!pick.classList.contains("flat")) goRow(Number(pick.dataset.pick));
    return;
  }
  const goto = e.target.closest("[data-goto]");
  if (goto) { const el = document.getElementById(goto.dataset.goto); if (el) light(el); return; }
  if (e.target.closest("[data-all-codes]")) {
    state.more.codes = !state.more.codes;
    render();
    document.querySelector("[data-all-codes]")?.focus();
    return;
  }
  const sym = e.target.closest("[data-symbol]");
  if (sym) {
    state.symbol = state.symbol === sym.dataset.symbol ? null : sym.dataset.symbol;
    render();
    document.querySelector(`[data-symbol="${sym.dataset.symbol}"]`).focus();
    return;
  }
  if (e.target.closest("[data-jump]")) {
    state.behind = true;
    render();
    document.getElementById("behind").scrollIntoView({ behavior: reduce ? "auto" : "smooth" });
    return;
  }
  if (e.target.closest("#rebuild")) rebuild();
});
/* A source card that would run off the left edge opens rightward instead, still inside the window. */
function fitCard(c) {
  const card = c && c.querySelector(".card");
  if (!card) return;
  card.style.left = card.style.right = "";
  const r = card.getBoundingClientRect();
  if (r.left >= 8) return;
  card.style.right = "auto";
  card.style.left = Math.min(0, document.documentElement.clientWidth - 8 - c.getBoundingClientRect().left - r.width) + "px";
}
document.addEventListener("pointerover", e => fitCard(e.target.closest?.(".cite")));
document.addEventListener("focusin", e => fitCard(e.target.closest?.(".cite")));
document.addEventListener("change", e => {
  if (e.target.id === "fail") { state.failure = e.target.value; rebuild(); }
  if (e.target.id === "theme") {
    state.theme = e.target.value;
    try { localStorage.setItem(THEME_KEY, state.theme); } catch (err) { /* storage can be blocked; the theme still applies */ }
    applyTheme();
  }
});
/* Keep <details> open across re-renders. The toggle event does not bubble, so listen in the capture phase. */
document.addEventListener("toggle", e => {
  const d = e.target;
  if (d.id === "behind") state.behind = d.open;
  else if (d.dataset && d.dataset.more) state.more[d.dataset.more] = d.open;
}, true);
/* The system theme can change while the page is open. */
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { Pond.colors(); Cat.recolor(); });

render();
applyTheme();
Pond.start();
Marks.start();
Cat.start();

/* Live: a tab that stays open, or that Chrome puts back from its cache, keeps the edition it was opened with.
   From 08:05 Paris n8n has today's edition (the 08:00 run, or the page builds it when that run was missed),
   so once this edition is older than that, today's page is opened again. The page is sandboxed (origin null):
   it cannot ask n8n first and has no storage. The time of the last try is kept in window.name, which a reload
   keeps, and there is at most one try every 30 minutes. When n8n is not running, the browser shows its error page. */
const Renew = (() => {
  const KEY = "one-page-renew:", WAIT = 30 * 60e3, DUE = 8 * 60 + 5;
  const parts = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Paris", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  /* The date of the newest edition n8n should have at this time: today from 08:05 Paris, the day before until then. */
  const due = (ms = Date.now()) => {
    const p = Object.fromEntries(parts.formatToParts(ms).map(x => [x.type, x.value]));
    const back = Number(p.hour) * 60 + Number(p.minute) < DUE ? 1 : 0;
    return new Date(Date.UTC(Number(p.year), Number(p.month) - 1, Number(p.day) - back)).toISOString().slice(0, 10);
  };
  const lastTry = () => { const m = /^one-page-renew:(\d+)$/.exec(window.name); return m ? Number(m[1]) : 0; };
  const mark = () => { window.name = KEY + Date.now(); };
  const old = () => EDITION.date < due();
  function check() {
    if (!live || state.renewing || state.busy || document.visibilityState !== "visible" || !old()) return;
    /* A try in the future means the clock was set back: do not let it block. */
    const since = Date.now() - lastTry();
    if (since >= 0 && since < WAIT) return;
    mark();
    state.renewing = true;
    render();
    location.replace("/webhook/today");
    /* Still here after two minutes: the load was stopped. Take the notice away; the next try waits for WAIT. */
    setTimeout(() => { state.renewing = false; render(); }, 120e3);
  }
  function start() {
    if (!live) return;
    /* Straight from n8n (not from the cache) and still not today's: n8n has just tried to build it, so wait before asking again. */
    const nav = performance.getEntriesByType?.("navigation")?.[0];
    if (nav && nav.transferSize > 0 && EDITION.staleEdition && old()) mark();
    document.addEventListener("visibilitychange", check);
    window.addEventListener("focus", check);
    window.addEventListener("pageshow", e => { if (e.persisted && state.renewing) { state.renewing = false; render(); } check(); });
    setInterval(check, 60e3);
    check();
  }
  return { due, check, start };
})();
Renew.start();
</script>
</body>
