<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wdth,wght@0,62.5..100,500..700;1,62.5..100,500..700&family=Geist:wght@400..600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Tokens from DESIGN.md (v6, dark ground from the board layout). Add a value there before using it here.
     The page is dark: a near-black with a little of the pond's blue in it, and blocks a step lighter.
     Light is kept only for a reader who picks it under "Behind this page". */
  :root {
    --bg: #111618;
    --surface: #172024;
    --pond: #0e2a32;
    --ink: #ebe6dc;
    --accent: #e8784f;
    --koi-light: #ece6da;
    --koi-dark: #3a3632;
    --ink-2: color-mix(in srgb, var(--ink) 66%, transparent);
    --ink-3: color-mix(in srgb, var(--ink) 40%, transparent);
    --rule: color-mix(in srgb, var(--ink) 12%, transparent);
    --hover: color-mix(in srgb, var(--ink) 5%, transparent);
    --title-from: #ffffff;
    --title-to: #9b9b9b;
    --shadow: rgba(0, 0, 0, 0.5);
    /* The cat and its yarn only. The yarn is the pond's lake blue. */
    --yarn: #67adc1;
    --cat-eye: #e4b32a;
    --cat-pink: #ee9fb1;

    --serif: "Noto Serif Display", "Didot", Georgia, serif;
    --sans: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --slot-h: 128px;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #e9e4da; --surface: #e1dbcf;
    --ink: #1c1a17; --accent: #9e3214;
    --koi-light: #f7f2e8; --koi-dark: #2b2723;
    --rule: color-mix(in srgb, var(--ink) 14%, transparent);
    --title-from: #000000; --title-to: #666666;
    --shadow: rgba(60, 48, 30, 0.14);
    --yarn: #194a57;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background-color: var(--bg);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.4  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 24px;
    font-variant-numeric: tabular-nums;
  }
  h1, h2, h3, p, ul, ol, figure { margin: 0; }
  ul, ol { padding: 0; list-style: none; }
  button, select { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  b, strong { font-weight: 600; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .skip { position: absolute; left: 16px; top: -48px; z-index: 40; padding: 8px 12px; background: var(--ink); color: var(--bg); border-radius: 4px; }
  .skip:focus { top: 16px; }

  /* Type roles */
  .meta { font-family: var(--mono); font-size: 12px; line-height: 16px; letter-spacing: 0.02em; color: var(--ink-2); text-transform: lowercase; }
  .sub { color: var(--ink-2); font-size: 14px; line-height: 20px; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .accent { color: var(--accent); }
  .title { font-family: var(--serif); font-stretch: 75%; font-weight: 600; font-size: 30px; line-height: 36px; letter-spacing: -0.01em; }
  /* Links: a faint underline that firms up on hover or focus */
  .ink-link { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; text-decoration-color: var(--rule); transition: text-decoration-color 300ms var(--ease); }
  .ink-link:hover, .ink-link:focus-visible { text-decoration-color: currentColor; }
  .chev { width: 16px; height: 16px; flex: none; color: var(--ink-2); transition: transform 300ms var(--ease); }
  [aria-expanded="true"] .chev, details[open] > summary .chev { transform: rotate(90deg); }
  .cursor { display: inline-block; width: 0.55em; height: 1em; margin-left: 4px; transform: translateY(0.15em); background: var(--ink); }
  @media (prefers-reduced-motion: no-preference) {
    .cursor { animation: blink 1100ms steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  }

  /* Opening: the koi pond fills the screen, then shrinks into its band as the page scrolls */
  .runway { height: 88svh; }
  .stage { position: fixed; inset: 0; z-index: 20; pointer-events: none; background: var(--pond); }
  /* The pond is one lake blue in both themes, so whatever sits on it always takes the dark-theme inks. */
  .stage, .pond-slot {
    color-scheme: dark; color: var(--ink);
    --ink: #ebe6dc; --accent: #e8784f; --koi-light: #ece6da; --koi-dark: #3a3632;
    --ink-2: color-mix(in srgb, var(--ink) 66%, transparent); --ink-3: color-mix(in srgb, var(--ink) 40%, transparent);
    --title-from: #ffffff; --title-to: #9b9b9b;
  }
  .stage #pond { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .intro { position: absolute; inset: 0; z-index: 1; display: grid; place-content: center; justify-items: center; text-align: center; padding: 24px; }
  .intro-box { display: grid; justify-items: center; gap: 6px; }
  /* Only the title and the date: "One Page" drawn in character cells like the koi, the rest set in the page's serif */
  .wordmark, .wordmark-tag { display: block; }
  .intro-line { margin-top: 10px; font-family: var(--mono); font-size: 12px; line-height: 16px; letter-spacing: 0.16em; text-transform: lowercase; color: var(--ink-2); }
  .pond-slot { position: relative; height: var(--slot-h); }
  @media (prefers-reduced-motion: no-preference) { .pond-slot, .runway { cursor: pointer; } }
  .pond-pause {
    position: absolute; right: 12px; bottom: 8px; z-index: 21; padding: 4px 8px;
    opacity: 0; pointer-events: none; transition: opacity 300ms var(--ease);
  }
  .pond-pause.on { opacity: 1; pointer-events: auto; }
  .pond-pause:hover { color: var(--ink); }

  /* Page */
  .page { position: relative; max-width: 1264px; margin: 0 auto; padding: 0 32px 64px; }
  .mast { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 24px; padding: 16px 0; }
  .mast .name { display: inline-flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 12px; min-height: 36px; }
  .mast-mark { display: block; }
  .mast-tag { margin-bottom: 6px; font-family: var(--mono); font-size: 12px; line-height: 16px; letter-spacing: 0.16em; text-transform: lowercase; color: var(--ink-2); }
  .mast .right { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 24px; }
  .status { display: inline-flex; align-items: center; gap: 8px; transition: color 300ms var(--ease); }
  .status:hover { color: var(--ink); }
  .status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-2); }
  .status.bad { color: var(--ink); font-weight: 600; }
  .status.bad .dot { background: transparent; border: 1.5px solid var(--ink); }
  @media (prefers-reduced-motion: no-preference) {
    .status:not(.bad) .dot { animation: breathe 2400ms var(--ease) infinite; }
    @keyframes breathe { 50% { opacity: 0.35; } }
  }
  .notice { margin-top: 16px; padding: 12px 16px; background: var(--surface); font-size: 14px; line-height: 20px; }

  /* The five, with today's order of the blocks beside it; then the blocks as cards, two to a row, most important
     first; blocks with nothing today share one quiet strip at the end. */
  .top { margin-top: 24px; display: grid; grid-template-columns: minmax(0, 8fr) minmax(0, 4fr); gap: 32px; align-items: start; }
  .board { margin-top: 40px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
  .blk { min-width: 0; background: var(--surface); border-radius: 4px; padding: 20px 24px 24px; }
  .blk-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; }
  .blk > .title { margin-top: 8px; }
  .verdict { margin-top: 4px; color: var(--ink-2); font-size: 14px; line-height: 20px; text-wrap: pretty; overflow-wrap: anywhere; }
  .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; }
  /* What a block is today, the same word in the order beside the five and on the card */
  .tier { display: inline-block; padding: 0 6px; border: 1px solid var(--rule); border-radius: 3px; font-family: var(--mono); font-size: 11px; line-height: 16px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
  .tier.need { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  .tier.moved { border-color: var(--yarn); color: var(--yarn); }
  .tier.quiet { border-style: dashed; color: var(--ink-3); }
  .glance { padding-top: 24px; }
  .glance ol { margin-top: 8px; }
  .glance li { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 2px 12px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .glance li .tier { justify-self: start; }
  .glance .go { font-weight: 600; transition: color 300ms var(--ease); }
  .glance .go:hover { color: var(--accent); }
  .glance .st { grid-column: 2; overflow-wrap: anywhere; }
  .glance li.q .go { color: var(--ink-2); font-weight: 400; }
  .quiet-strip { margin-top: 24px; padding: 16px 24px; border: 1px dashed var(--rule); border-radius: 4px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px 24px; align-items: start; }
  .quiet-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px 32px; }
  .quiet-strip .q { min-width: 0; }
  .quiet-strip .q .title { font-size: 20px; line-height: 24px; }
  .quiet-strip .q .verdict { margin-top: 2px; }
  .quiet-strip[hidden] { display: none; }

  /* Today's five */
  .five { background: var(--surface); padding: 24px 24px 12px; }
  .lede { margin-top: 12px; color: var(--ink-2); max-width: 60ch; }
  .group { display: flex; align-items: center; gap: 12px; margin: 16px 0 4px; }
  .group::after { content: ""; flex: 1; border-top: 1px solid var(--rule); }
  .picks > li + li { border-top: 1px solid var(--rule); }
  .pick-row {
    display: grid; grid-template-columns: 40px minmax(0, 1fr) 16px; gap: 16px; align-items: start;
    padding: 12px 8px; margin: 0 -8px; border-radius: 4px; cursor: pointer;
    transition: background-color 300ms var(--ease), opacity 300ms var(--ease);
  }
  .pick-row:hover { background: var(--hover); }
  /* Hovering one pick lets the others step back */
  .picks:has(.pick-row:hover) .pick-row:not(:hover) { opacity: 0.5; }
  .rank { font-family: var(--serif); font-stretch: 75%; font-weight: 600; font-size: 30px; line-height: 32px; color: var(--ink-2); }
  .act .rank { color: var(--accent); }
  .pick-title { display: block; width: 100%; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.015em; text-wrap: balance; }
  .pick-meta { margin-top: 4px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
  .pick-why { color: var(--ink-2); text-wrap: pretty; }
  .pick-from { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
  .pick-row .chev { margin-top: 8px; }
  .pick-row.flat { cursor: default; }
  .tool { padding: 1px 6px; border-radius: 4px; background: var(--bg); color: var(--ink); }
  /* Sources as citations: hover one to see what that source sent today */
  .cite {
    position: relative; display: inline-flex; padding: 1px 6px; border: 1px solid var(--rule); border-radius: 4px;
    color: var(--ink); cursor: help; transition: background-color 300ms var(--ease), color 300ms var(--ease), border-color 300ms var(--ease);
  }
  .cite:hover, .cite:focus-visible { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .cite .card {
    position: absolute; left: 0; top: calc(100% + 8px); z-index: 10; width: 248px; padding: 12px;
    background: var(--bg); color: var(--ink); border: 1px solid var(--rule); border-radius: 4px; box-shadow: 0 8px 24px var(--shadow);
    font-family: var(--sans); font-size: 14px; line-height: 20px; letter-spacing: 0; text-transform: none; text-align: left; white-space: normal;
    opacity: 0; transform: translateY(-4px); pointer-events: none; transition: opacity 300ms var(--ease), transform 300ms var(--ease);
  }
  .cite:hover .card, .cite:focus-visible .card { opacity: 1; transform: none; }
  /* The tags sit at the right of a pick, so their cards open leftward and never widen the page */
  .pick-from .cite .card { left: auto; right: 0; }
  .cite .card .meta { display: block; margin-top: 8px; }
  .pick-row:has(.cite:hover) :is(.pick-title, .pick-why) { color: var(--ink-3); }
  /* The row a pick came from, or the pick a row leads back to, lights up in the yarn's blue when the reader jumps to it. */
  .lit { animation: lit 2400ms var(--ease) both; border-radius: 4px; }
  @keyframes lit {
    from { background: color-mix(in srgb, var(--yarn) 26%, transparent); box-shadow: 0 0 0 8px color-mix(in srgb, var(--yarn) 26%, transparent); }
    to { background: transparent; box-shadow: 0 0 0 8px transparent; }
  }

  /* Classes and mail */
  .agenda { margin-top: 12px; }
  .agenda li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--rule); }
  .agenda li:first-child { border-top: 0; }
  .agenda .time { font-family: var(--mono); font-size: 14px; line-height: 24px; font-weight: 600; }
  .agenda .when { grid-column: 2; }
  .rows > li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: baseline; padding: 12px 0; border-top: 1px solid var(--rule); }
  .rows > li:first-child { border-top: 0; }
  .rows .r { display: grid; justify-items: end; text-align: right; gap: 2px; }
  .ref { font-family: var(--mono); font-size: 12px; line-height: 16px; color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; white-space: nowrap; transition: color 300ms var(--ease), text-decoration-color 300ms var(--ease); }
  .ref:hover { color: var(--ink); text-decoration-color: currentColor; }
  .more summary { display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; cursor: pointer; list-style: none; transition: color 300ms var(--ease); }
  .more summary::-webkit-details-marker, .behind > summary::-webkit-details-marker { display: none; }
  .more summary:hover { color: var(--ink); }
  .more[open] .rows { margin-top: 8px; }
  .stale-tag { font-weight: 600; color: var(--ink); }
  .tag { display: inline-block; padding: 0 5px; border: 1px solid var(--rule); border-radius: 4px; color: var(--ink); white-space: nowrap; }
  .deal-src { display: block; margin-top: 2px; font-size: 12px; line-height: 16px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deal-note { max-width: 21ch; text-wrap: balance; }
  .off-line { margin-top: 12px; }
  .chart .close-line { fill: none; stroke: var(--ink); stroke-width: 1.5; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  /* Real titles can be long or carry unbroken strings */
  .pick-title, .rows > li > span:first-child, .agenda li > span, .notice { overflow-wrap: anywhere; }
  .rows > li > span:first-child, .rows > li.news > span:nth-child(2) { text-wrap: pretty; }
  .dim-list:has(> li:hover) > li:not(:hover) { opacity: 0.5; }
  .dim-list > li { transition: opacity 300ms var(--ease); }

  /* Lower blocks */
  .rows > li.news { grid-template-columns: 24px minmax(0, 1fr) 88px; gap: 12px; align-items: baseline; }
  .news .n { color: var(--ink-3); }
  .heat { display: grid; justify-items: end; gap: 6px; }
  .bar { display: block; width: 72px; height: 2px; background: var(--rule); }
  .bar i { display: block; height: 2px; background: var(--ink); }
  .colhead { display: grid; grid-template-columns: 64px minmax(0, 1fr) 80px; gap: 12px; margin-top: 16px; padding: 0 48px 8px 0; border-bottom: 1px solid var(--rule); }
  .colhead span:last-child { text-align: right; }
  .holds > li { display: grid; grid-template-columns: minmax(0, 1fr) 40px; gap: 8px; align-items: center; border-bottom: 1px solid var(--rule); }
  .hold { display: grid; grid-template-columns: 64px minmax(0, 1fr) 80px; gap: 2px 12px; align-items: center; padding: 10px 8px; margin: 0 -8px; border-radius: 4px; transition: background-color 300ms var(--ease); }
  .hold:hover { background: var(--hover); }
  .hold .sym { font-family: var(--mono); font-size: 14px; font-weight: 600; }
  .hold[aria-expanded="true"] .sym::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 8px; border-radius: 50%; background: var(--ink); transform: translateY(-2px); }
  .hold .chg { text-align: right; font-family: var(--mono); font-size: 14px; }
  .hold .ext { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 12px; min-width: 0; }
  .hold .ext .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hold .ext .ed { flex: none; }
  .hold .ext .why { min-width: 0; text-align: right; }
  .hold.none .ext .nm { flex: none; max-width: 50%; }
  .hold .ext .broke { color: var(--ink); font-weight: 600; }
  .hold.none:hover { background: none; }
  .holds .ref { justify-self: end; }
  /* The codes past the three biggest moves: chips that open a code's chart, or every row when the reader asks for all. */
  .codes { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; padding-top: 12px; }
  /* positioned, so the screen-reader words inside a chip scroll with it instead of widening the page */
  .chips { position: relative; display: flex; flex-wrap: wrap; gap: 6px; }
  .chips > li { display: flex; align-items: center; gap: 4px; flex: none; }
  .chip { display: inline-flex; gap: 6px; align-items: baseline; padding: 2px 8px; border: 1px solid var(--rule); border-radius: 999px; font-family: var(--mono); font-size: 12px; line-height: 18px; color: var(--ink-2); white-space: nowrap; transition: background-color 300ms var(--ease), color 300ms var(--ease), border-color 300ms var(--ease); }

  /* The cat layer: decoration over the page, never in the way of a click */
  .marks { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; z-index: 5; overflow: hidden; pointer-events: none; }
  .cat { position: absolute; left: 0; top: 0; opacity: 0; transform-origin: 60px 94px; transition: opacity 300ms var(--ease); will-change: transform; }
  .cat.on { opacity: 1; }
  .yarn { position: absolute; left: 0; top: 0; width: 16px; height: 16px; display: grid; place-items: center; font-family: var(--mono); font-size: 16px; line-height: 16px; font-weight: 600; color: var(--yarn); opacity: 0; will-change: transform; }
  .thread { position: absolute; pointer-events: none; }
  mark.key { background: none; color: inherit; }
  /* While the cat plays with a number, each digit is its own box so it can hop, sink or flip */
  /* While the ball plays, the characters it touches are hidden in place and copies in the cat's layer move (Cat, split). */
  .split .ch { color: transparent; }
  .ch-copy { position: absolute; display: block; white-space: pre; pointer-events: none; }

  .chart rect { transform-box: fill-box; transform-origin: 50% 100%; }

  /* ===== MotionSites trial (page/trial-motionsites/SPEC.md). Everything below is the trial; delete it to go back. ===== */
  :root { --r: 16px; --lift: color-mix(in srgb, var(--ink) 3.5%, var(--surface)); --edge: color-mix(in srgb, var(--ink) 7%, transparent); }
  :root[data-theme="light"] { --lift: color-mix(in srgb, #ffffff 35%, var(--surface)); --edge: color-mix(in srgb, #ffffff 60%, transparent); }
  body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  ::selection { background: color-mix(in srgb, var(--accent) 32%, transparent); color: var(--ink); }

  /* One material: light from above, a hairline top edge, a soft shadow */
  .five, .blk { border-radius: var(--r); background: linear-gradient(180deg, var(--lift), var(--surface) 160px); box-shadow: inset 0 1px 0 var(--edge), 0 18px 40px -24px var(--shadow); }
  .quiet-strip { border-radius: var(--r); }

  /* The band in the cards' material (v5, SPEC.md section 8): the same 1px top edge as a dark card, and no light outside it.
     The pond keeps the dark inks in both themes, so its edge is the dark theme's --edge.
     The edge sits on the water, so it waits until the pond has settled into its band (.lit, set in frame()). */
  .pond-slot::before {
    content: ""; position: absolute; inset: 0; z-index: 21; pointer-events: none; border-radius: 14px;
    box-shadow: inset 0 1px 0 color-mix(in srgb, var(--ink) 7%, transparent); opacity: 0; transition: opacity 600ms var(--ease);
  }
  .pond-slot.lit::before { opacity: 1; }

  /* Type: bigger, lighter display; labels as tracked caps */
  .title { font-weight: 500; font-size: clamp(32px, 2.8vw, 40px); line-height: 1; letter-spacing: -0.02em; }
  .five .head .title { font-size: clamp(40px, 4.2vw, 58px); line-height: 0.95; letter-spacing: -0.025em; }
  .quiet-strip .q .title { font-size: 22px; line-height: 24px; }
  .rank { font-size: 46px; line-height: 36px; font-weight: 500; color: var(--ink-3); }
  .pick-title { font-weight: 500; font-size: 26px; line-height: 32px; letter-spacing: -0.02em; }
  .group, .colhead, #h-glance { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }

  /* Room */
  @media (min-width: 1101px) { .top { margin-top: 40px; gap: 48px; } }
  @media (min-width: 721px) {
    .board { margin-top: 64px; gap: 32px; }

    .five { padding: 32px 32px 16px; }
    .glance { padding-top: 36px; }
  }

  /* Blocks blur-rise into place once; the second of a row follows */
  .reveal { transform: translateY(28px); filter: blur(8px); transition: opacity 900ms var(--ease), transform 900ms var(--ease), filter 900ms var(--ease); }
  .reveal.in { filter: none; }
  .board > .reveal:nth-child(even) { transition-delay: 120ms; }

  @media (max-width: 720px) {
    .five, .blk { border-radius: 0; }
    .title { font-size: 28px; line-height: 30px; }
    .five .head .title { font-size: 36px; line-height: 36px; }

  /* ===== MotionSites trial v2 (SPEC.md section 4): the title's italic word, the dated top row, colours from the pond ===== */
  :root:not([data-theme="light"]) { --bg: #0d1315; }
  /* "Today's five": the count word in the display serif's italic, a step quieter than the rest */
  .five .head .title em { font-style: italic; font-weight: 500; color: color-mix(in srgb, var(--ink) 60%, transparent); letter-spacing: -0.03em; padding-right: 0.05em; }
  /* The top row: the date set as a headline, the run status under it as a label */
  .mast .right { flex-direction: column; align-items: flex-end; gap: 2px; }
  .mast .right > span:first-child { font-family: var(--serif); font-stretch: 75%; font-weight: 500; font-size: 26px; line-height: 28px; letter-spacing: -0.01em; text-transform: capitalize; color: var(--ink); }
  /* Colours come from the pond: koi orange is "act now", lake blue is "moved", cream is everything else */
  .blk:has(> .blk-top .tier.moved) { background: linear-gradient(180deg, color-mix(in srgb, var(--yarn) 6%, var(--lift)), var(--surface) 160px); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--yarn) 70%, transparent), 0 18px 40px -24px var(--shadow); }
  .blk:has(> .blk-top .tier.need) { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 6%, var(--lift)), var(--surface) 160px); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--accent) 70%, transparent), 0 18px 40px -24px var(--shadow); }

  @media (max-width: 720px) {

  /* ===== MotionSites trial v4 (SPEC.md section 7): read from the back of the room, a quieter footer ===== */
  /* The faintest ink goes from 40% to 52%: 4.6:1 on a card instead of 3.3:1 */
  :root, .stage, .pond-slot { --ink-3: color-mix(in srgb, var(--ink) 52%, transparent); }
  /* On a wide screen (the projector) the small labels go up one step. The code chips stay at 12px: at 13px the five chips under Markets wrap onto a third line. */
  @media (min-width: 1101px) {

  /* The date: a label in tracked capitals like the page's group labels, big enough for the back of the room.
     It comes in last, after the title and the tagline have settled (.go is set when the marks start). */
  .intro-line { margin-top: 14px; font-size: 13px; line-height: 18px; letter-spacing: 0.24em; text-transform: uppercase; color: color-mix(in srgb, var(--ink) 80%, transparent); opacity: 0; }
  .intro-box.go .intro-line { opacity: 1; animation: intro-line-in 900ms var(--ease) 900ms backwards; }

  /* ===== Impeccable trial v1 (page/trial-impeccable/NOTES.md). Everything below is this trial; delete it to go back to MotionSites v6. ===== */
  /* A failed source, seen from the back of the room: a cream "cached" badge, the card loses its light and gets a dashed edge,
     the old data steps back, and one sentence under the title says what failed and what is shown. */
  .tier.stale { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 600; }
  .blk:has(> .blk-top .tier.stale) { background: var(--surface); box-shadow: none; outline: 1px dashed color-mix(in srgb, var(--ink) 45%, transparent); outline-offset: -1px; }
  .blk:has(> .blk-top .tier.stale) > :not(.blk-top, .title, .stale-note) { opacity: 0.45; }
  .stale-note { margin-top: 8px; max-width: 60ch; font-size: 16px; line-height: 24px; color: var(--ink); text-wrap: pretty; }
  .notice .ink-link { text-decoration-color: currentColor; }
  @media (min-width: 1101px) { .notice { font-size: 16px; line-height: 24px; padding: 14px 20px; } }

  /* The agent's tool call is part of what the defense grades: when a pick used a tool, its result is written out, not hidden in a tooltip.
     A pick with no tool shows only its source. */
  .pick-from .found { font-family: var(--sans); font-size: 14px; line-height: 20px; letter-spacing: 0; text-transform: none; color: var(--ink-2); }
  @media (min-width: 1101px) { .pick-from { font-size: 14px; line-height: 20px; } }

  /* Mono is for codes, times and figures; sentences of metadata are set in the sans */
  .foot-note, .five .head > .meta, .more > summary, .chart-box figcaption, .behind > summary .meta { font-family: var(--sans); letter-spacing: 0; }
  .foot-note, .chart-box figcaption { max-width: 60ch; text-wrap: pretty; }
  @media (min-width: 1101px) { .five .head > .meta { font-size: 14px; line-height: 20px; } }

  /* A short card beside a tall one keeps its own height instead of stretching into an empty slab */
  .board { align-items: start; }

  /* AI news rows lose their 01–03 counters (one numbering system on the page: the five's ranks) */
  .rows > li.news { grid-template-columns: minmax(0, 1fr) 88px; }

     block is today (tier, title, one sentence), on the right at most three rows; the rest is folded. */
  .board { grid-template-columns: minmax(0, 1fr); }

  .blk:has(> .blk-head .tier.need) { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 6%, var(--lift)), var(--surface) 160px); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--accent) 70%, transparent), 0 18px 40px -24px var(--shadow); }
  .blk:has(> .blk-head .tier.stale) { background: var(--surface); box-shadow: none; outline: 1px dashed color-mix(in srgb, var(--ink) 45%, transparent); outline-offset: -1px; }

  /* Beside the five: mail and classes, the two blocks whose length changes most from day to day. Mail shows as many

  /* ===== Impeccable trial v5 (NOTES.md section 10): clear liquid glass for every block, a glass nav on the top row ===== */
  /* Glass without colour: the page's own background shows through. A rim catches the light at the top left and the
     bottom right (a 1px gradient ring, masked to the border), the glass's thickness shows as a faint glow inside the
     edge, and a soft shadow lifts it. No fill, no tint by tier, no light across the top. The blocks sit on a flat
     background, so nothing behind them would bend; only the nav, with the page moving under it, refracts. */
  :root { --glass-hi: rgba(255, 255, 255, 0.30); --glass-lo: rgba(255, 255, 255, 0.05); --glass-glow: rgba(255, 255, 255, 0.06); --glass-drop: rgba(0, 0, 0, 0.32); }
  :root[data-theme="light"] { --glass-hi: rgba(255, 255, 255, 0.95); --glass-lo: rgba(60, 48, 30, 0.10); --glass-glow: rgba(255, 255, 255, 0.55); --glass-drop: rgba(60, 48, 30, 0.12); }
  :root .five, :root .blk, :root .quiet-strip,
  :root .blk:has(> .blk-head .tier.moved), :root .blk:has(> .blk-head .tier.need) {
    position: relative; border: 0; background: transparent;
    box-shadow: inset 0 0 24px -8px var(--glass-glow), 0 12px 32px -16px var(--glass-drop);
  }
  :root .five::before, :root .blk::before, :root .quiet-strip::before, .topnav::before {
    content: ""; position: absolute; inset: 0; padding: 1px; border-radius: inherit; pointer-events: none;
    background: linear-gradient(135deg, var(--glass-hi), var(--glass-lo) 30%, var(--glass-lo) 70%, color-mix(in srgb, var(--glass-hi) 55%, transparent));
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }
  /* A cached block keeps v3's dashed outline instead of the rim: the glass is "broken" until the source is back. */
  :root .blk:has(> .blk-head .tier.stale) { background: transparent; box-shadow: none; }
  :root .blk:has(> .blk-head .tier.stale)::before { display: none; }

  /* The nav: a glass capsule on the top row, above the masthead, that stays at the top while the page scrolls. One tab
     per block in the order the blocks sit on the page; a lighter pill marks the block in view. Hidden during the opening. */
  .topnav {
    position: sticky; top: 12px; z-index: 25; display: flex; align-items: center; gap: 2px;
    width: fit-content; max-width: 100%; margin: 16px auto 0; padding: 4px; border-radius: 999px;
    background: color-mix(in srgb, var(--bg) 62%, transparent);
    -webkit-backdrop-filter: blur(14px) saturate(150%); backdrop-filter: blur(14px) saturate(150%);
    box-shadow: inset 0 0 16px -6px var(--glass-glow), 0 10px 28px -12px var(--glass-drop);
    opacity: 0; pointer-events: none; transition: opacity 400ms var(--ease);
  }
  .topnav.lens { -webkit-backdrop-filter: url(#topnav-lens); backdrop-filter: url(#topnav-lens); }
  .topnav.on, .topnav:focus-within { opacity: 1; pointer-events: auto; }
  .topnav-track { position: relative; display: flex; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; border-radius: 999px; }
  .topnav-track::-webkit-scrollbar { display: none; }
  .topnav-pill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px;
    background: color-mix(in srgb, var(--ink) 14%, transparent); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--ink) 12%, transparent);
    transition: transform 450ms var(--ease), width 450ms var(--ease);
  }
  .topnav button {
    position: relative; z-index: 1; flex: none; min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px;
    background: none; color: var(--ink-2); font: 500 15px/20px var(--sans); white-space: nowrap; cursor: pointer;
    transition: color 300ms var(--ease);
  }
  .topnav button:hover, .topnav button[aria-current] { color: var(--ink); }
  .topnav button.q { color: var(--ink-3); }
  .topnav button:focus-visible { outline-offset: -2px; border-radius: 999px; }
  .topnav .topnav-more { display: grid; place-items: center; width: 40px; padding: 0; }
  .topnav-more svg { width: 20px; height: 20px; }
  .lens-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
  /* Rows and blocks brought into view stop clear of the nav. */
  html { scroll-padding-top: 76px; }
  @media (max-width: 720px) {
    .topnav { top: 8px; margin-top: 12px; }
    html { scroll-padding-top: 64px; }
    .topnav button { padding: 0 12px; font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { .topnav, .topnav-pill { transition: none; } }
  @media (prefers-reduced-transparency: reduce) {
    .topnav, .topnav.lens { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; }
  }

  /* ===== Impeccable trial v6 (NOTES.md section 11): Apple keynote patterns, read from the back of the room ===== */
  /* Sizes for a projector (design-research/apple-keynote-layout.md, section 3): nothing under 14px, sentences at
     17-18px, item titles at 18-22px, and on each card one figure at 72px as the loudest line. */
  .meta, .mast-tag, .ref, .holds .ref, .deal-src, .log, .chip, .all-codes, .intro-line { font-size: 14px; line-height: 20px; }
  .tier, .group, .colhead, #h-glance { font-size: 14px; line-height: 20px; }
  .sub { font-size: 16px; line-height: 24px; }
  .verdict { font-size: 17px; line-height: 24px; }
  .lede { font-size: 18px; line-height: 28px; }
  .rows > li > span:first-child { font-size: 18px; line-height: 26px; }
  .rows > li.route b { font-size: 19px; }
  .hold .sym, .hold .chg { font-size: 17px; line-height: 24px; }
  .colhead, .hold { grid-template-columns: 72px minmax(0, 1fr) 96px; }
  /* The column labels end where the row's change ends, clear of the "→ pick" column. */
  .colhead { padding-right: 72px; }

  /* Pattern A, the five as numbered statements: a big grey number that is not read, one statement, one line under it. */
  .pick-row { grid-template-columns: 56px minmax(0, 1fr) 16px; gap: 20px; padding: 16px 8px; }
  .rank { font-size: 64px; line-height: 56px; font-weight: 500; letter-spacing: -0.03em; }
  .pick-title { font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -0.02em; }
  .pick-meta { margin-top: 6px; }
  .pick-why { font-size: 18px; line-height: 26px; }
  .pick-row .chev { margin-top: 10px; }

  /* Pattern B, a figure as the card's header: the block's name steps down to an eyebrow beside its tier. */
  .blk-top { gap: 6px 12px; }
  .blk-name { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; min-width: 0; }
  .eyebrow { font-family: var(--sans); font-size: 16px; line-height: 20px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); }
  .hero { display: grid; justify-items: start; margin-top: 20px; }
  .hero-n { font-family: var(--serif); font-stretch: 75%; font-weight: 600; font-size: 72px; line-height: 64px; letter-spacing: -0.02em; color: var(--ink); white-space: nowrap; font-variant-numeric: lining-nums; }
  .hero-n small { font-family: var(--sans); font-size: 0.4em; font-weight: 500; letter-spacing: 0; }
  .hero-n .dir { display: inline-block; margin-right: 0.14em; font-family: var(--sans); font-size: 0.36em; vertical-align: 0.62em; }
  .hero-l { margin-top: 10px; font-size: 22px; line-height: 28px; font-weight: 500; letter-spacing: -0.01em; color: var(--ink); text-wrap: balance; overflow-wrap: anywhere; }
  .hero-l b { font-family: var(--mono); font-weight: 600; letter-spacing: 0; }
  .hero-x { margin-top: 4px; font-size: 17px; line-height: 24px; color: var(--ink-2); text-wrap: pretty; overflow-wrap: anywhere; }
  .hero + .verdict { margin-top: 10px; }
  /* A day with nothing to show is said as one sentence instead of a figure. */
  .statement { margin-top: 16px; font-size: 28px; line-height: 34px; font-weight: 500; letter-spacing: -0.015em; color: var(--ink); text-wrap: balance; }
  .blk:has(> .blk-head .tier.stale) > .blk-head > :is(.hero, .statement) { opacity: 0.45; }
  /* In the quiet strip the figure, what it counts and its note run as one line of text. */
  .quiet-strip :is(.hero, .statement) { display: block; margin-top: 2px; font: 400 17px/24px var(--sans); letter-spacing: 0; color: var(--ink-2); }
  .quiet-strip .hero > span, .quiet-strip .hero-n small, .quiet-strip .hero-n .dir { display: inline; margin: 0; font: inherit; letter-spacing: 0; vertical-align: baseline; color: inherit; }
  .quiet-strip .hero-x::before { content: "· "; }

  /* Pattern C, classes on a timeline: a dot per class on a line down the card. The next class has the accent dot and the
     word "next"; a class that has started has a filled grey dot. */
  .agenda.timeline { margin-top: 20px; }
  .agenda.timeline li { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; align-items: baseline; padding: 0 0 20px 32px; border-top: 0; }
  .agenda.timeline li:last-child { padding-bottom: 0; }
  .agenda.timeline li::before { content: ""; position: absolute; left: 3px; top: 7px; width: 14px; height: 14px; box-sizing: border-box; border: 2px solid var(--ink-2); border-radius: 50%; }
  .agenda.timeline li:not(:last-child)::after { content: ""; position: absolute; left: 9px; top: 25px; bottom: -3px; width: 2px; border-radius: 1px; background: var(--rule); }
  .agenda.timeline li.next::before { border-color: var(--accent); background: var(--accent); }
  .agenda.timeline li.started::before { border-color: var(--ink-3); background: var(--ink-3); }
  .timeline .time { font-family: var(--mono); font-size: 22px; line-height: 28px; font-weight: 600; }
  .timeline .next-tag { justify-self: start; font-family: var(--mono); font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
  .timeline .tl-title { grid-column: 1 / -1; font-size: 18px; line-height: 26px; }
  .timeline .started :is(.time, .tl-title) { color: var(--ink-2); }

  /* Pattern D, AI news as bars: the title on its own line, then a bar to the hottest story's length and its value at the
     end. The first story's bar is full ink, the others grey. */
  .rows > li.news { grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 14px 0; }
  .rows > li.news > span:first-child { font-size: 20px; line-height: 28px; }
  .news .heat { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; justify-items: stretch; gap: 16px; }
  .news .heat > .meta { order: 2; font-size: 20px; line-height: 24px; font-weight: 600; color: var(--ink); text-align: right; white-space: nowrap; }
  .news .bar { order: 1; width: auto; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--ink) 12%, transparent); overflow: hidden; }
  .news .bar i { height: 8px; border-radius: 4px; background: var(--ink-3); }
  .news.first .bar i { background: var(--ink); }

  @media (max-width: 720px) {
    .pick-row { grid-template-columns: 36px minmax(0, 1fr) 16px; gap: 12px; padding: 14px 8px; }
    .rank { font-size: 44px; line-height: 40px; }
    .pick-title { font-size: 22px; line-height: 30px; }
    .pick-why { font-size: 17px; line-height: 24px; }
    .hero-n { font-size: 56px; line-height: 52px; }
    .hero-l { font-size: 19px; line-height: 26px; }
    .statement { font-size: 24px; line-height: 30px; }
    .rows > li.news > span:first-child { font-size: 18px; line-height: 26px; }
    .news .heat > .meta { font-size: 18px; }
    .colhead, .hold { grid-template-columns: 64px minmax(0, 1fr) 88px; }
    .colhead { padding-right: 64px; letter-spacing: 0.04em; }
    .hold .sym, .hold .chg { font-size: 16px; }
  }
  /* ===== Impeccable trial v8 (NOTES.md section 13): v7's designeer effects, each one a switch (DESIGN, data-fx) ===== */
  /* v8 keeps v5's clear liquid glass on every block, with no fill and no glow (user, 2026-11-02). The v7 effects below
     only apply while their switch is on: :root[data-fx~="name"]. The "design" button at the end of the page sets them. */

  /* glass off: v7's flat cards, a hairline and no shadow (designeer: Damir's unslopped dashboard) */
  :root:not([data-fx~="glass"]) .five, :root:not([data-fx~="glass"]) .blk, :root:not([data-fx~="glass"]) .quiet-strip,
  :root:not([data-fx~="glass"]) .blk:has(> .blk-head .tier.moved), :root:not([data-fx~="glass"]) .blk:has(> .blk-head .tier.need) {
    background: transparent; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 11%, transparent);
  }
  :root:not([data-fx~="glass"]) .five::before, :root:not([data-fx~="glass"]) .blk::before, :root:not([data-fx~="glass"]) .quiet-strip::before { display: none; }
  :root:not([data-fx~="glass"]) .blk:has(> .blk-head .tier.stale) { box-shadow: none; }
  /* cardGlow (v7, off by default): a soft light around the five */
  :root[data-fx~="cardGlow"] .five {
    box-shadow: inset 0 0 24px -8px var(--glass-glow), 0 0 44px -4px color-mix(in srgb, var(--yarn) 26%, transparent), 0 0 140px 8px color-mix(in srgb, var(--yarn) 9%, transparent);
  }

  /* #2 The nav, smaller: one key word per tab, 32px tall, and the same 4px of glass around every end. Open, the island
     is a 32px circle holding the status light, so both ends of the capsule are circles inside circles. */
  .topnav { padding: 4px; gap: 0; }
  .topnav-track { gap: 0; }
  .topnav button { min-height: 32px; padding: 0 12px; font: 500 13px/16px var(--sans); letter-spacing: 0.01em; }
  .topnav .topnav-more { width: 32px; padding: 0; }
  .topnav-more svg { width: 16px; height: 16px; }
  @media (max-width: 720px) { .topnav button { padding: 0 10px; font-size: 13px; } }
  html { scroll-padding-top: 64px; }

  /* #2 The island: scrolling down folds the nav to the light, the block in view in LED dots, and "4/7". */
  .topnav.morph { overflow: hidden; justify-content: center; }
  .topnav.morph > * { flex: none; }
  .topnav .isl {
    position: relative; z-index: 1; flex: none; display: flex; align-items: center; justify-content: center; gap: 9px;
    min-width: 32px; min-height: 32px; padding: 0; border-radius: 999px; color: var(--ink); --led: var(--ink); transition: background-color 300ms var(--ease);
  }
  .topnav.mini .isl { padding: 0 13px 0 12px; }
  .topnav .isl:hover { background: var(--hover); }
  .isl-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: color-mix(in srgb, var(--ink) 55%, transparent); transition: background-color 300ms var(--ease), box-shadow 300ms var(--ease); }
  .isl.bad { --led: var(--accent); }
  .isl.bad .isl-dot { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .isl.busy { --led: var(--yarn); }
  .isl.busy .isl-dot { background: var(--yarn); animation: isl-pulse 1.1s var(--ease) infinite; }
  @keyframes isl-pulse { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--yarn) 25%, transparent); } }
  .isl-dm { display: block; flex: none; color: var(--led); }
  .isl-n { font: 500 12px/16px var(--mono); color: var(--ink-3); white-space: nowrap; }
  .topnav:not(.mini) .isl-dm, .topnav:not(.mini) .isl-n { display: none; }
  .topnav.mini .topnav-track, .topnav.mini .topnav-more { display: none; }
  .topnav.morph .topnav-track, .topnav.morph .isl-dm { animation: isl-in 260ms var(--ease) both; }
  @keyframes isl-in { from { opacity: 0; } }
  .topnav .isl[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) { .isl.busy .isl-dot, .topnav.morph .topnav-track, .topnav.morph .isl-dm { animation: none; } }

  /* #1 The title's light, blurred behind the letters (titleGlow), and the band's ends melting into the page (bandFade, off since v9: the user prefers the hard ends). */
  .intro-box { position: relative; isolation: isolate; }
  .mark-glow { position: absolute; z-index: -1; pointer-events: none; filter: blur(var(--blur, 14px)); }
  :root[data-fx~="bandFade"] .pond-slot::before { -webkit-mask: linear-gradient(90deg, transparent, #000 72px, #000 calc(100% - 72px), transparent); mask: linear-gradient(90deg, transparent, #000 72px, #000 calc(100% - 72px), transparent); }

  /* colorLines: each trend line in its own colour, thin, as in Damir's unslopped chart. The dashed low stays grey. */
  :root { --line-0: #e3b65c; --line-1: #e58ba5; --line-2: #a895ee; --line-3: #5fc4ba; --line-4: #95c97a; --line-5: #7aaee8; }
  :root[data-theme="light"] { --line-0: #a9761a; --line-1: #c0506f; --line-2: #6b55c8; --line-3: #1e877e; --line-4: #4c8a30; --line-5: #2f6cb5; }
  :root[data-fx~="colorLines"] .spark[style] polyline { stroke: var(--c); stroke-width: 1.5; }
  :root[data-fx~="colorLines"] .spark.strong[style] polyline { stroke-width: 1.9; }
  :root[data-fx~="colorLines"] .spark[style] .end { stroke: var(--c); }
  :root[data-fx~="colorLines"] .chart[style] .close-line { stroke: var(--c); }

  /* #4 Every route is a boarding pass. v9: the left part reads like a real pass (two airports in large codes with
     their cities under them, then small labelled fields, and a barcode on the lead pass); the stub on the right holds
     what changed: the change against the low, the week's fares as a line, the low itself. Each part carries its own
     outline, so the stub can be torn off along the dashed line: pulling it or clicking it opens the route on Google
     Flights (tear, v9.js). The notches are punched in the page's colour. Every stub is as wide as the others, so the
     perforations line up down the card. Below 520px of card the stub goes under the ticket. */
  .tickets { display: grid; gap: 12px; margin: 4px 0 0; padding: 0; list-style: none; container-type: inline-size; }
  .tickets > li { margin: 0; padding: 0; }
  .blk-body > .tickets:first-child { margin-top: 0; }
  .ticket { --rim: color-mix(in srgb, var(--ink) 17%, transparent); --c: var(--ink-3); position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 200px; }
  .tk-main { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); align-content: center; gap: 10px 24px; padding: 12px 18px 12px 18px; border: 1px solid var(--rim); border-right: 1.5px dashed transparent; border-radius: 12px 0 0 12px; transition: border-color 200ms var(--ease); }
  .tk-route { display: flex; align-items: flex-start; gap: 10px; min-width: 0; margin: 0; }
  .tk-pt { display: grid; min-width: 0; }
  .tk-code { font: 600 20px/24px var(--mono); letter-spacing: 0.04em; color: var(--ink); }
  .tk-city { overflow: hidden; font-size: 13px; line-height: 17px; color: var(--ink-2); white-space: nowrap; text-overflow: ellipsis; }
  .tk-line { display: flex; align-items: center; gap: 4px; width: 52px; height: 24px; color: var(--ink-3); }
  :root[data-fx~="colorLines"] .tk-line { color: var(--c); }
  .tk-line i { flex: 1; border-top: 1px dashed currentColor; }
  .tk-line svg { flex: none; width: 13px; height: 13px; fill: currentColor; }
  .tk-fields { display: flex; flex-wrap: wrap; gap: 6px 24px; margin: 0; }
  .tk-f { display: grid; gap: 2px; }
  .tk-k { font: 500 12px/14px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
  .tk-v { font: 500 15px/20px var(--mono); color: var(--ink); white-space: nowrap; }
  .tk-v small { font-size: 12px; color: var(--ink-3); }
  .tk-f.date .tk-v { text-transform: uppercase; letter-spacing: 0.04em; }
  .tk-fare { font-weight: 600; }
  .tk-foot { grid-column: 1 / -1; display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin: 0; }
  .tk-foot .ref { margin: 0 0 0 auto; }
  .tk-bar { width: 148px; height: 26px; fill: var(--ink-3); opacity: 0.6; }
  .tk-stub {
    position: relative; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 1px; min-width: 0; padding: 12px 16px 12px 18px;
    border: 1px solid var(--rim); border-left: 1.5px dashed var(--rim); border-radius: 0 12px 12px 0; color: var(--ink); text-decoration: none;
  }
  .tk-stub::before, .tk-stub::after { content: ""; position: absolute; left: -8.5px; width: 15px; height: 15px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 1px var(--rim); }
  .tk-stub::before { top: -8.5px; clip-path: inset(50% 0 0 0); }
  .tk-stub::after { bottom: -8.5px; clip-path: inset(0 0 50% 0); }
  .tk-n { font-family: var(--serif); font-stretch: 75%; font-weight: 600; font-size: 28px; line-height: 32px; letter-spacing: -0.01em; color: var(--ink); white-space: nowrap; font-variant-numeric: lining-nums; }
  .tk-n small { font-family: var(--sans); font-size: 0.42em; font-weight: 500; letter-spacing: 0; }
  .tk-n .dir { display: inline-block; margin-right: 0.12em; font-family: var(--sans); font-size: 0.38em; vertical-align: 0.55em; }
  .tk-n.new { font-size: 18px; line-height: 24px; }
  /* the shorter passes: the lead already says what the change is against */
  .ticket:not(.lead) .tk-k.vs { display: none; }
  .tk-stub .spark { display: block; width: 100%; height: 20px; margin: 6px 0 4px; }
  .tk-go { display: flex; align-items: center; gap: 4px; margin-top: 4px; color: var(--ink-3); opacity: 0; transition: opacity 250ms var(--ease); }
  .tk-go svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.6; }
  /* the lead pass: the route across the whole ticket, the dates as fields, a barcode at the foot */
  .ticket.lead .tk-main { gap: 16px; padding: 16px 20px 14px 20px; }
  .ticket.lead .tk-route { gap: 14px; }
  .ticket.lead .tk-pt.to { text-align: right; }
  .ticket.lead .tk-line { flex: 1; width: auto; min-width: 40px; height: 40px; }
  .ticket.lead .tk-code { font-size: 34px; line-height: 40px; }
  .ticket.lead .tk-city { font-size: 15px; line-height: 20px; }
  .ticket.lead .tk-fields { gap: 8px 30px; }
  .ticket.lead .tk-v { font-size: 16px; line-height: 22px; }
  .ticket.lead .tk-fare { font-size: 20px; }
  .ticket.lead .tk-stub { padding: 16px 18px 16px 20px; }
  .ticket.lead .tk-n { font-size: 46px; line-height: 48px; letter-spacing: -0.02em; }
  .ticket.lead .tk-stub .spark { height: 28px; margin: 10px 0 6px; }
  .ticket.lit { animation: lit 2400ms var(--ease) both; }
  /* tear: the stub gives a little under the pointer, follows a pull to the right, and tears off past 72px */
  .tk-stub.tear { cursor: grab; touch-action: pan-y; -webkit-user-drag: none; user-select: none; -webkit-user-select: none; transform-origin: 0 100%; transition: transform 420ms cubic-bezier(0.34, 1.5, 0.64, 1); }
  .tk-stub.tear:hover, .tk-stub.tear:focus-visible { transform: translateX(2px) rotate(1.2deg); }
  .tk-stub.tear:hover .tk-go, .tk-stub.tear:focus-visible .tk-go, .tk-stub.tear.pull .tk-go { opacity: 1; }
  .tk-stub.tear.pull { cursor: grabbing; transition: none; }
  .ticket.pull .tk-main, .ticket.torn .tk-main { border-right-color: var(--rim); }
  /* v10: the flying copy (.tk-ghost) is a stub too; v8 and v9 hid it with the stub, so the tear was never seen */
  .ticket.torn .tk-stub:not(.tk-ghost) { visibility: hidden; }
  /* a torn piece is paper: it hides the passes it falls across, in the page's own colour (no new fill) */
  .tk-stub.tk-ghost { background: var(--bg); box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28); }
  /* it falls inside its card, so a phone's page never widens while it flies (96 px at 375 without this) */
  .blk:has(.ticket.torn) { overflow: clip; overflow-clip-margin: 8px; }
  @media (hover: none) { .tk-go { opacity: 1; } }
  /* a wide card: on the shorter passes the fields sit beside the route */
  @container (min-width: 680px) {
    .ticket:not(.lead) .tk-main { grid-template-columns: auto minmax(0, 1fr); align-items: center; }
    .ticket:not(.lead) .tk-fields { justify-content: flex-end; }
  }
  @container (max-width: 520px) {
    .ticket { grid-template-columns: minmax(0, 1fr); }
    .tk-main { grid-template-columns: minmax(0, 1fr); border-right: 1px solid var(--rim); border-bottom: 1.5px dashed transparent; border-radius: 12px 12px 0 0; }
    .ticket.pull .tk-main, .ticket.torn .tk-main { border-bottom-color: var(--rim); }
    /* the stub as one row under the ticket: the figure, the week's line, the low, an arrow at the end */
    .tk-stub, .ticket.lead .tk-stub { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 2px 12px; padding: 10px 16px 12px; border-left: 1px solid var(--rim); border-top: 1.5px dashed var(--rim); border-radius: 0 0 12px 12px; }
    .tk-stub .tk-k { flex-basis: 100%; }
    .tk-stub .spark, .ticket.lead .tk-stub .spark { flex: 1; min-width: 56px; height: 20px; margin: 0; }
    .tk-stub .tk-go { margin: 0; font-size: 0; opacity: 1; }
    .tk-stub .tk-go svg { width: 12px; height: 12px; }
    .tk-stub::before { top: -8.5px; left: -8.5px; clip-path: inset(0 0 0 50%); }
    .tk-stub::after { top: -8.5px; bottom: auto; left: auto; right: -8.5px; clip-path: inset(0 50% 0 0); }
    .ticket.lead .tk-n { font-size: 34px; line-height: 38px; }
    .ticket.lead .tk-code { font-size: 26px; line-height: 30px; }
    .ticket.lead .tk-line { height: 30px; }
    .ticket.lead .tk-fields { gap: 8px 20px; }
  }

  /* #5 The inbox as one small square per mail; pointing at a count lights its squares. */
  .waffle { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 14px; max-width: 340px; }
  .waffle i, .wk i { width: 10px; height: 10px; border-radius: 2.5px; background: color-mix(in srgb, var(--ink) 18%, transparent); transition: opacity 250ms var(--ease), transform 300ms var(--ease); }
  .waffle .w-act, .wk .w-act { background: var(--accent); }
  .waffle .w-later, .wk .w-later { background: color-mix(in srgb, var(--ink) 62%, transparent); }
  .waffle .w-codes, .wk .w-codes { background: transparent; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 30%, transparent); }
  .waffle .w-more { font: 500 12px/10px var(--mono); color: var(--ink-3); }
  .hero:has([data-w="act"]:hover) :is(.waffle, .wk) i:not(.w-act),
  .hero:has([data-w="later"]:hover) :is(.waffle, .wk) i:not(.w-later),
  .hero:has([data-w="hidden"]:hover) :is(.waffle, .wk) i:not(.w-hidden),
  .hero:has([data-w="codes"]:hover) :is(.waffle, .wk) i:not(.w-codes) { opacity: 0.18; }
  .hero [data-w] { transition: color 250ms var(--ease); }
  .hero-x [data-w]:hover { color: var(--ink); }
  .quiet-strip :is(.waffle, .wk) { display: none; }
  /* The week: a column of squares a day, three wide and filled from the bottom, today's last and named. */
  .wk { display: flex; align-items: flex-end; gap: 10px; margin-top: 16px; }
  .wk-day { display: grid; justify-items: center; gap: 6px; }
  .wk-sq { display: flex; flex-wrap: wrap-reverse; align-content: flex-start; gap: 3px; width: 36px; }
  .wk i { width: 10px; height: 10px; }
  .wk-l { font: 500 11px/14px var(--mono); color: var(--ink-3); text-transform: lowercase; }
  .wk-day.today .wk-l { color: var(--ink); font-weight: 600; }
  .wk-day:not(.today) .wk-sq { opacity: 0.62; transition: opacity 250ms var(--ease); }
  .wk:hover .wk-day .wk-sq, .wk-day.today .wk-sq { opacity: 1; }
  .wk:hover .wk-day:not(:hover) .wk-sq { opacity: 0.35; }
  .wk-day .wk-sq + .wk-l::after { content: attr(data-d); display: block; color: var(--ink-3); font-weight: 400; }
  @media (prefers-reduced-motion: no-preference) {
    .reveal :is(.waffle, .wk) i { transform: scale(0); }
    .reveal.in :is(.waffle, .wk) i { transform: none; transition: opacity 250ms var(--ease), transform 360ms cubic-bezier(0.34, 1.5, 0.64, 1) calc(240ms + var(--i) * 12ms); }
  }

  /* #6 Figures roll into place like an odometer; a trend line answers the pointer with that day's value. */
  .odo { position: relative; color: transparent; }
  .odo-w { position: absolute; inset: 0; overflow: hidden; color: var(--odo-c); }
  .odo-s { display: block; white-space: pre; text-align: center; line-height: var(--h); transform: translateY(calc(var(--from) * -1 * var(--h))); }
  .odo-s.go { transform: translateY(calc(var(--to) * -1 * var(--h))); transition: transform var(--dur) cubic-bezier(0.18, 1.12, 0.32, 1) var(--delay); }
  :root[data-fx~="sparkHover"] .holds:has(> li:hover) > li:not(:hover), :root[data-fx~="sparkHover"] .tickets:has(> li:hover) > li:not(:hover) { opacity: 0.5; }
  .holds > li, .tickets > li { transition: opacity 300ms var(--ease); }
  .spk-tip { position: absolute; z-index: 30; padding: 4px 8px; border-radius: 6px; background: var(--ink); color: var(--bg); font: 500 12px/16px var(--mono); white-space: nowrap; pointer-events: none; transform: translate(-50%, calc(-100% - 10px)); }
  .spk-dot { position: absolute; z-index: 30; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bg) 80%, transparent); pointer-events: none; }

  /* #8 The end of the page: our pond once more, where the cat comes to sit when the reader gets there (Pond, Cat). */
  .foot-pond { position: relative; margin-top: 64px; padding-bottom: 104px; }
  .foot-pond[hidden] { display: none; }
  .foot-next { margin: 0 0 10px; }
  .marks.foot { z-index: 21; }
  @media (max-width: 720px) { .foot-pond { margin-top: 48px; padding-bottom: 84px; } }
  /* v9 (lily): the cat sits on a lily pad in the pond, so the pond is taller and nothing waits under it. */
  :root[data-fx~="lily"] .foot-slot { --slot-h: 220px; }
  :root[data-fx~="lily"] .foot-pond { padding-bottom: 40px; }
  @media (max-width: 720px) { :root[data-fx~="lily"] .foot-slot { --slot-h: 176px; } :root[data-fx~="lily"] .foot-pond { padding-bottom: 28px; } }

  /* The design switches: a small glass panel from the footer. A change reloads the page, as some effects start at load. */
  .fx-btn { margin-left: 4px; padding: 0; border: 0; background: none; color: var(--ink-3); font: inherit; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--ink) 25%, transparent); text-underline-offset: 3px; cursor: pointer; }
  .fx-btn:hover { color: var(--ink); }
  .fx-panel {
    position: fixed; right: 16px; bottom: 16px; z-index: 40; width: min(340px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto;
    padding: 16px 16px 14px; border-radius: 16px; background: color-mix(in srgb, var(--bg) 78%, transparent);
    -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 14%, transparent), 0 18px 48px -18px var(--glass-drop);
  }
  .fx-panel[hidden] { display: none; }
  .fx-panel h2 { margin: 0 0 4px; font: 600 13px/18px var(--sans); }
  .fx-panel p { margin: 0 0 10px; font-size: 12px; line-height: 16px; color: var(--ink-3); }
  .fx-panel label { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; line-height: 18px; cursor: pointer; }
  .fx-panel label .meta { font-size: 11px; }
  .fx-panel input { width: 14px; height: 14px; margin: 0; accent-color: var(--accent); }
  .fx-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .fx-row button { min-height: 32px; padding: 0 14px; border: 0; border-radius: 999px; background: color-mix(in srgb, var(--ink) 10%, transparent); color: var(--ink); font: 500 13px/16px var(--sans); cursor: pointer; }
  .fx-row button.go { background: var(--ink); color: var(--bg); }

  /* ===== v9 (rows): the board in rows (designeer's bento grids). A row is a wide card on the left two thirds and a
     narrow one on the right third, on the lines of the five and the inbox, so one gutter runs down the page; the cards
     in a row share their top and bottom edges. Two of a kind go half and half; a card left over has the row to itself.
     The gaps are the top row's gutter, across and down. ===== */
  :root[data-fx~="rows"] .board { display: flex; flex-direction: column; gap: 48px; margin-top: 48px; }
  .brow { display: grid; grid-template-columns: minmax(0, 1fr); gap: 48px; align-items: stretch; }
  .brow:empty { display: none; }
  .brow > .blk { min-width: 0; }
  .board.measure .brow { align-items: start; }
  :root[data-fx~="rows"] .board > .col { display: none; }
  .brow > .reveal + .reveal { transition-delay: 120ms; }
  @media (min-width: 1101px) {
    .brow.wn { grid-template-columns: minmax(0, 8fr) minmax(0, 4fr); }
    .brow.half { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (min-width: 900px) and (max-width: 1100px) {
    :root[data-fx~="rows"] .board, .brow { gap: 32px; }
    :root[data-fx~="rows"] .board { margin-top: 32px; }
    .brow.wn, .brow.half { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  /* A card with the row to itself sets its rows in two columns; the first boarding pass takes the height of two. */
  @media (min-width: 900px) {
    .brow.one ul.rows { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 48px; }
    .brow.one .tickets { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px; }
    .brow.one .tickets > li { display: grid; }
    .brow.one .tickets > li:has(> .lead) { grid-row: span 2; }
  }
  @media (max-width: 899px) { :root[data-fx~="rows"] .board, .brow { gap: 32px; } :root[data-fx~="rows"] .board { margin-top: 64px; } }
  @media (max-width: 720px) { :root[data-fx~="rows"] .board, .brow { gap: 12px; } :root[data-fx~="rows"] .board { margin-top: 32px; } }
  @media (prefers-reduced-motion: reduce) { .brow > .reveal + .reveal { transition-delay: 0ms; } }

  /* ===== Trial v11 (aiLead): AI news leads with its top story (Ayush Soni, "type is the motif": the headline set large
     is the picture; shawn., "X post cards": one post as an object, its counts in a row under it). The block's big
     figure is the top story's heat, its subject the headline in the title serif, as Markets leads with its biggest move
     and the trip with its best fare. The other stories follow as a ranked list: a number, the headline, the heat. ===== */
  :root[data-fx~="aiLead"] .hero-l .ai-lead { display: block; max-width: 30ch; font-family: var(--serif); font-weight: 500; font-size: 34px; line-height: 40px; letter-spacing: -0.012em; color: var(--ink); text-wrap: balance; text-decoration-thickness: 1px; text-underline-offset: 7px; }
  :root[data-fx~="aiLead"] .hero-l:has(> .ai-lead) { margin-top: 14px; }
  :root[data-fx~="aiLead"] .hero-l:has(> .ai-lead) + .hero-x { margin-top: 10px; }
  :root[data-fx~="aiLead"] .hero-x .tag { margin-right: 4px; }
  :root[data-fx~="aiLead"] .rows > li.news:has(> .n) { grid-template-columns: 2.4em minmax(0, 1fr) 104px; column-gap: 16px; align-items: baseline; padding: 14px 0; }
  :root[data-fx~="aiLead"] .rows > li.news > .n { font-size: 14px; line-height: 26px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  :root[data-fx~="aiLead"] .rows > li.news:has(> .n) > span:nth-child(2) { font-size: 18px; line-height: 26px; }
  :root[data-fx~="aiLead"] li.news:has(> .n) .heat { display: grid; grid-template-columns: auto; justify-items: end; gap: 8px; }
  :root[data-fx~="aiLead"] li.news:has(> .n) .heat > .meta { order: 0; font-size: 15px; line-height: 20px; font-weight: 600; color: var(--ink); text-align: right; white-space: nowrap; }
  :root[data-fx~="aiLead"] li.news:has(> .n) .bar { order: 1; width: 96px; height: 4px; border-radius: 2px; }
  :root[data-fx~="aiLead"] li.news:has(> .n) .bar i { height: 4px; border-radius: 2px; background: var(--ink-2); }
  @media (max-width: 600px) {
    :root[data-fx~="aiLead"] .hero-l .ai-lead { font-size: 26px; line-height: 32px; text-underline-offset: 5px; }
    :root[data-fx~="aiLead"] .rows > li.news:has(> .n) { grid-template-columns: 2em minmax(0, 1fr); row-gap: 8px; }
    :root[data-fx~="aiLead"] .rows > li.news:has(> .n) > span:nth-child(2) { font-size: 17px; line-height: 24px; }
    :root[data-fx~="aiLead"] li.news:has(> .n) .heat { grid-column: 2; grid-template-columns: auto minmax(0, 96px); justify-items: start; align-items: center; gap: 12px; }
    :root[data-fx~="aiLead"] li.news:has(> .n) .heat > .meta { font-size: 14px; }
  }

  /* ===== Trial v11 (candleFocus): the 30-day candles in the code's colour, today lit (see focusCandles in the script).
     Up days are hollow with a tint, down days filled, as before; the bodies are rounded; the 1-month range is a band. ===== */
  .chart.focus { overflow: visible; }
  .chart.focus .wick { stroke: var(--c); stroke-width: 1.2; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .chart.focus .up { fill: color-mix(in srgb, var(--c) 16%, var(--bg)); stroke: var(--c); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  .chart.focus .down { fill: var(--c); stroke: var(--c); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  .chart.focus .c-day { opacity: var(--age); transition: opacity 160ms var(--ease); }
  .chart.focus .c-day.on { opacity: 1; }
  .chart.focus .c-band { fill: color-mix(in srgb, var(--c) 9%, transparent); }
  .chart.focus .lv { stroke: color-mix(in srgb, var(--c) 55%, var(--ink-2)); }
  .chart.focus .c-col { fill: color-mix(in srgb, var(--ink) 7%, transparent); transition: transform 160ms var(--ease); }
  .c-wrap { position: relative; }
  .c-tip { position: absolute; transform: translate(-50%, calc(-100% - 10px)); padding: 2px 8px; border-radius: 6px; background: color-mix(in srgb, var(--bg) 82%, transparent); color: var(--ink-2); white-space: nowrap; pointer-events: none; }
  .c-tip:empty { display: none; }
  .c-tip b { color: var(--ink); font-weight: 600; }
  .c-tip.end { transform: translate(calc(-100% + 12px), calc(-100% - 10px)); }
  .c-tip.start { transform: translate(-12px, calc(-100% - 10px)); }
  @media (prefers-reduced-motion: reduce) { .chart.focus .c-day, .chart.focus .c-col { transition: none; } }

  /* ===== Trial v13 (water): the three waters of ASCII Koi (pond.css), for the pond only. The page keeps its colours;
     the pond's own inks follow its water, so the koi read on light water too. Without a pick the pond is as before. ===== */
  :root[data-water="pond"] { --pond: #0e2a32; }
  :root[data-water="black"] { --pond: #0d1315; }
  :root[data-water="light"] { --pond: #e9e4da; }
  :root:is([data-water="pond"], [data-water="black"]) :is(#stage, #intro) { --ink: #ebe6dc; --accent: #e8784f; --koi-light: #ece6da; --koi-dark: #3a3632; color-scheme: dark; }
  :root[data-water="light"] :is(#stage, #intro) { --ink: #1c1a17; --accent: #9e3214; --koi-light: #f7f2e8; --koi-dark: #2b2723; color-scheme: light; }
  /* The water panel, after shawn.'s "interactions on the toolbar" (designeer.xyz/finds/zzzzshawn-2110676622290624760):
     a rounded panel whose big tile is a rounded square filled by a dithered colour ball, beside a grid of smaller rounded
     squares. Here the ball is the water in use, drawn in cells like the pond; the grid holds the three waters, each
     square filled with its colour, and a tile that feeds the koi. The panel is the nav's liquid glass, with no words.
     It shows only when T is pressed (T moves to the next water, as in ASCII Koi), in the lower left corner of the pond
     on screen (under the nav when no pond is in view), stays while it is pointed at or holds the focus, and fades out
     a few seconds after. Radii step in by the padding: the panel 16px, a tile 10px (the big one) or 8px. */
  .pond-water {
    position: absolute; left: 8px; bottom: 8px; z-index: 22; display: grid; grid-template-columns: auto auto; gap: 6px; padding: 6px;
    border-radius: 16px; background: color-mix(in srgb, var(--bg) 62%, transparent);
    -webkit-backdrop-filter: blur(14px) saturate(150%); backdrop-filter: blur(14px) saturate(150%);
    box-shadow: inset 0 0 16px -6px var(--glass-glow), 0 10px 28px -12px var(--glass-drop);
    transform: translateY(6px) scale(0.96); transform-origin: 0 100%; opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 300ms var(--ease), transform 300ms var(--ease), visibility 0s linear 300ms;
  }
  .pond-water.float { position: fixed; left: 50%; top: var(--water-top, 64px); bottom: auto; transform: translate(-50%, -6px) scale(0.96); transform-origin: 50% 0; }
  .pond-water.on { transform: none; opacity: 1; visibility: visible; pointer-events: auto; transition-delay: 0s; }
  .pond-water.float.on { transform: translate(-50%, 0); }
  .pw-ball { display: block; width: 70px; height: 70px; border-radius: 10px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 10%, transparent); }
  .pw-grid { display: grid; grid-template-columns: repeat(2, 32px); grid-auto-rows: 32px; gap: 6px; }
  .pond-water button { position: relative; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; cursor: pointer; transition: transform 200ms var(--ease), box-shadow 200ms var(--ease); }
  .pond-water button:hover { transform: translateY(-1px); }
  .pond-water button:active { transform: scale(0.94); }
  .pond-water button:focus-visible { outline-offset: 2px; border-radius: 8px; }
  .pond-water [data-water-pick] { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 22%, transparent), inset 0 1px 0 rgba(255, 255, 255, 0.12); }
  .pond-water [data-water-pick][aria-checked="true"] { box-shadow: 0 0 0 2px color-mix(in srgb, var(--bg) 80%, transparent), 0 0 0 3.5px var(--ink); }
  .pond-water [data-water-pick="pond"] { background: #0e2a32; }
  .pond-water [data-water-pick="black"] { background: #0d1315; }
  .pond-water [data-water-pick="light"] { background: #e9e4da; }
  /* the feed tile: glass like the panel, with three pellets in the pond's food colour */
  .pond-water .pw-feed { background: color-mix(in srgb, var(--ink) 8%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 14%, transparent); }
  .pond-water .pw-feed:hover { background: color-mix(in srgb, var(--ink) 14%, transparent); }
  .pw-feed i { position: absolute; width: 6px; height: 5px; border-radius: 1px; background: #ce8e4a; box-shadow: inset 0 1.5px 0 #ecc595, 1.5px 2px 0 rgba(0, 0, 0, 0.35); }
  .pw-feed i:nth-child(1) { left: 9px; top: 10px; } .pw-feed i:nth-child(2) { left: 17px; top: 14px; } .pw-feed i:nth-child(3) { left: 11px; top: 19px; }
  /* the pause button across the band wears the same glass, so it reads on every water */
  :root[data-fx~="water"] .pond-pause {
    border-radius: 999px; background: color-mix(in srgb, var(--bg) 62%, transparent);
    -webkit-backdrop-filter: blur(14px) saturate(150%); backdrop-filter: blur(14px) saturate(150%);
    box-shadow: inset 0 0 16px -6px var(--glass-glow), 0 10px 28px -12px var(--glass-drop);
  }
  :root[data-fx~="water"] .pond-pause::before, .pond-water::before {
    content: ""; position: absolute; inset: 0; padding: 1px; border-radius: inherit; pointer-events: none;
    background: linear-gradient(135deg, var(--glass-hi), var(--glass-lo) 30%, var(--glass-lo) 70%, color-mix(in srgb, var(--glass-hi) 55%, transparent));
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  }
  @media (prefers-reduced-motion: reduce) { .pond-water, .pond-water.float { transition: opacity 300ms var(--ease), visibility 0s linear 300ms; } .pond-water { transform: none; } .pond-water.float { transform: translate(-50%, 0); } .pond-water button { transition: none; } }
  @media (prefers-reduced-transparency: reduce) { .pond-water, :root[data-fx~="water"] .pond-pause { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; } }
  /* a new water spreads from where it was picked: the old pond is kept on top and a widening hole shows the new one */
  @property --wr { syntax: "<length>"; inherits: false; initial-value: 0px; }
  .water-snap { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; opacity: 0; --wr: 0px; }
  .water-snap.show { opacity: 1; -webkit-mask: radial-gradient(circle at var(--x, 50%) var(--y, 50%), transparent var(--wr), #000 calc(var(--wr) + 28px)); mask: radial-gradient(circle at var(--x, 50%) var(--y, 50%), transparent var(--wr), #000 calc(var(--wr) + 28px)); }
  .water-snap.wipe { --wr: 160vmax; transition: --wr 1100ms cubic-bezier(0.55, 0, 0.25, 1); }
</style>
</head>
<body>
<a class="skip" href="#five">Skip to today's five</a>

<div class="runway" id="runway" aria-hidden="true"></div>
<div class="stage" id="stage" aria-hidden="true">
  <canvas id="pond"></canvas>

      const today = i === data.length - 1 ? ` data-perch="market-today-${esc(h.symbol)}" data-act="squash"${mood}` : "";
      s += `<line class="wick" x1="${cx}" x2="${cx}" y1="${y(d.h)}" y2="${y(d.l)}"/>`;
      s += `<rect class="${d.c >= d.o ? "up" : "down"}" x="${cx - bw / 2}" y="${top}" width="${bw}" height="${Math.max(1, bot - top)}"${today}/>`;
    });

  }

  return { svg: `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(h.symbol)}, last ${c.length} daily closes${demo}." style="--c:var(--line-${Math.max(0, EDITION.market.holdings.indexOf(h)) % 6})">${s}</svg>`, note: "daily closes" + demo };
}

/* A pick's title with its key words wrapped, so the cat can find them. When the agent gave no key, or one that is

  if (ref.block === "travel") { const r = E.travel?.routes.find(x => x.code === ref.key); return r && r.fare < r.low7 ? "good" : ""; }

const moodAttr = m => m ? ` data-mood="${m}"` : "";

/* Featured numbers in the lower blocks are marked too: they are the rows the agent picked. */

const toy = (id, act = "", mood = "") => ` data-perch="${esc(id)}"${act ? ` data-act="${act}"` : ""}${moodAttr(mood)}`;

/* What each tool checked, in the reader's words; shown when the reader hovers the tool's tag. The exact call is in the n8n execution log. */
const CHECKED = { lookup_courses: "Checked your timetable", get_price_history: "Checked the price history", search_ai_news: "Searched the AI news" };
/* The five read in groups: to-dos, then things to know. Deal picks are left out above (trial v2); 2 is kept for older editions. */
const groupOf = p => p.ref?.block === "deals" ? 2 : p.kind === "act" ? 0 : 1;
/* The inbox's mail to act on, plus any mail a to-do pick points to; then the rest, which can wait. */
const mailSplit = M => {
  const picked = M.later.filter(m => { const i = featured("mail", m.subject); return i >= 0 && groupOf(EDITION.picks[i]) === 0; });
  return [[...M.act, ...picked], M.later.filter(m => !picked.includes(m))];
};
/* Where a pick leads: its row in the block below. */
const ROW = { mail: ["the mail", "h-mail"], courses: ["the class", "h-classes"], ai: ["the story", "h-ai"], market: ["the holding", "h-market"], deals: ["the deal", "h-deals"], travel: ["the fare", "h-trip"] };

/* Brings a row to the middle of the screen and lights it up for a moment. */

  void row.offsetWidth;
  row.classList.add("lit");
}
/* A pick goes straight to the row it came from, opening it if it is folded away. */

  const r = dest(EDITION.picks[i] || {});

  const fold = back?.closest("details:not([open])");
  if (fold) fold.open = true;

function more(key, label, inner) {
  return `<details class="more" data-more="${key}"${state.more[key] ? " open" : ""}><summary class="meta">${chev}${esc(label)}</summary>${inner}</details>`;
}

/*
 * Today's order of the blocks under the five, from the edition alone. Four tiers:
 *   needs you  a class still to come or under way today, or mail to act on;
 *   moved      a code out of its 1-month range or past the threshold, a deal or a fare under its 7-day low;
 *   to read    anything else with something in it today;
 *   quiet      no class, no mail to act on, no price, or the source is not connected. Quiet blocks share one strip at the end.
 * Within a tier, the block more of today's picks point to goes first; among moved blocks, then the bigger move in %;
 * then the usual order below. Each block also says in a few words why it sits where it does.
 */
const TIERS = ["needs you", "moved", "to read", "quiet"], TIER_CLASS = ["need", "moved", "", "quiet"];
const BLOCKS = [
  { key: "courses", sec: "sec-classes", head: "h-classes", src: ["zeus"] },
  { key: "mail", sec: "sec-mail", head: "h-mail", src: ["gmail"] },
  { key: "ai", sec: "sec-ai", head: "h-ai", src: ["aihot"] },
  { key: "market", sec: "sec-market", head: "h-market", src: ["market"] },
  { key: "deals", sec: "sec-deals", head: "h-deals", src: ["deals"] },
  { key: "travel", sec: "sec-trip", head: "h-trip", src: ["travel"] }

/* A fare with one day of prices has no week to compare with. */

    if (!list.length) return [3, 0, "no class today"];
    const next = list.find(c => minutes(c.time.slice(0, 5)) > at), on = list.find(c => minutes(c.time.slice(0, 5)) <= at && minutes(c.time.slice(-5)) > at);
    if (next) return [0, 0, `next ${esc(next.time.slice(0, 5))}, ${esc(until(next.time.slice(0, 5)))}`];
    if (on) return [0, 0, `in class until ${esc(on.time.slice(-5))}`];

  }

    /* A mail the editor agent picked as a to-do needs the reader today, even when the inbox rules let it wait (Impeccable trial v1). */
    const [act, later] = mailSplit(D), n = act.length;
    return [n ? 0 : 3, 0, `${n} ${n === 1 ? "needs" : "need"} you · ${later.length} can wait`];
  }

    const w = D.watch || [], fresh = w.filter(a => a.isNew).length;
    return w.length ? [2, 0, `${w.length} ${w.length === 1 ? "story matches" : "stories match"}${fresh ? ` · ${fresh} new` : ""}`] : [3, 0, "nothing on your watchlist"];
  }

    const th = D.threshold ?? 3, hs = byMove(D.holdings);

    const out = hs.map(rangeOf).filter(r => r?.broke), big = hs.filter(h => Math.abs(h.pct) >= th), lead = `${esc(hs[0].symbol)} ${chg(hs[0].pct)}`;
    if (!out.length && !big.length) return [2, 0, `all inside their range · ${lead}`];
    return [1, Math.max(0, ...out.map(r => r.x * 100), ...big.map(h => Math.abs(h.pct) - th)), `${out.length ? `${out.length} left their ${rangeName(out[0])} range` : `${big.length} moved over ${th} %`} · ${lead}`];
  }

    if (good.length) return [1, Math.max(...good.map(off)), `${good.length} under ${hasLow(good[0]) ? lowName(good[0].lowDays) : "target"}`];
    return [2, 0, D.daysToBlackFriday != null ? `${esc(D.daysToBlackFriday)} days to black friday` : `${D.rows.length} ${D.rows.length === 1 ? "price" : "prices"}, none under the low`];
  }

function order() {
  const name = { courses: "Classes", mail: "Inbox", ai: "AI news", market: watchOnly() ? "Markets" : "Portfolio", deals: "Shopping", travel: "Christmas trip" };
  return BLOCKS.map((b, i) => {
    const [tier, size, status] = weigh(b.key);
    return { ...b, i, tier, size, name: name[b.key], picks: EDITION.picks.filter(p => p.ref?.block === b.key).length, status };
  }).sort(DESIGN.pickOrder
    /* Trial v10 (pickOrder): what needs the reader, then the blocks the five points to most, then the tiers as before; quiet blocks stay last. */
    ? (a, b) => (a.tier > 0) - (b.tier > 0) || (a.tier === 3) - (b.tier === 3) || b.picks - a.picks || a.tier - b.tier || (a.tier === 1 ? b.size - a.size : 0) || a.i - b.i
    : (a, b) => a.tier - b.tier || b.picks - a.picks || (a.tier === 1 ? b.size - a.size : 0) || a.i - b.i);

/*
 * Trial v4: the board's cards go to two columns. The split that leaves the two columns closest in height wins, so a
 * long card goes with a short one; each column keeps today's order, and the day's first card starts the left one.
 * The split holds until the cards on the board change or balance() runs again, so opening a fold moves no card.
 */
const GAP = () => parseFloat(getComputedStyle(document.getElementById("col-a")).rowGap) || 0;
